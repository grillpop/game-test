<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ひよこ100万羽">
<meta name="theme-color" content="#bfe7a0">
<title>ひよこ100万羽</title>
<style>
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: #bfe7a0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  .stick { position: fixed; border-radius: 50%; pointer-events: none; display: none; transform: translate(-50%, -50%); }
  #stick-base { width: 112px; height: 112px; background: rgba(255, 255, 255, .3); border: 3px solid rgba(255, 255, 255, .7); }
  #stick-knob { width: 52px; height: 52px; background: rgba(255, 255, 255, .95); box-shadow: 0 2px 6px rgba(0, 0, 0, .25); }

  /* 画面上の表示 */
  #hud {
    position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: 10px; right: 10px;
    display: flex; gap: 6px; align-items: stretch; pointer-events: none;
  }
  .pill {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(40, 50, 30, .5); border: 1px solid rgba(255, 255, 255, .2);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    color: #fff; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  #chick-pill { flex: 1.6; font-size: 20px; background: rgba(240, 160, 20, .82); }
  #chick-pill.pop { animation: pop .25s ease-out; }
  @keyframes pop { 50% { transform: scale(1.12); } }
  #feed-pill, #parts-pill { flex: 1; }
  #time-pill { flex: .8; }
  #time-pill.low { background: rgba(210, 50, 40, .85); }
  #combo {
    position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 64px);
    text-align: center; pointer-events: none; color: #fff; font-weight: 900; font-size: 30px;
    text-shadow: 0 2px 0 #d9480f, 0 4px 10px rgba(0, 0, 0, .35); opacity: 0; transition: opacity .3s;
  }
  #combo.show { opacity: 1; }
  #combo.bump { animation: bump .18s ease-out; }
  @keyframes bump { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
  #toast {
    position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 108px);
    text-align: center; pointer-events: none; color: #fff; font-size: 22px; font-weight: 900;
    text-shadow: 0 2px 0 #b45309, 0 4px 8px rgba(0, 0, 0, .35);
    opacity: 0; transform: scale(.8); transition: opacity .2s, transform .2s;
  }
  #toast.show { opacity: 1; transform: scale(1); }
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 44px);
    text-align: center; pointer-events: none; color: #fff; font-size: 17px; font-weight: 800;
    text-shadow: 0 2px 4px rgba(0, 0, 0, .5); transition: opacity .4s;
  }
  .pop-text {
    position: fixed; pointer-events: none; transform: translate(-50%, -50%); white-space: nowrap;
    font-weight: 900; font-size: 18px; color: #fff; text-shadow: 0 2px 0 rgba(120, 60, 0, .8), 0 3px 6px rgba(0, 0, 0, .4);
    display: none;
  }
  .hp-bar {
    position: fixed; width: 44px; height: 6px; margin-left: -22px; border-radius: 3px;
    background: rgba(0, 0, 0, .35); overflow: hidden; pointer-events: none; display: none;
  }
  .hp-bar div { height: 100%; background: #ff5a3c; }
  #arrow {
    position: fixed; display: none; width: 44px; height: 44px; margin: -22px 0 0 -22px;
    font-size: 34px; line-height: 44px; text-align: center; color: #ffd23f;
    text-shadow: 0 0 3px #7a4a10, 0 2px 4px rgba(0, 0, 0, .5); pointer-events: none;
  }
  #village-sign {
    position: fixed; transform: translate(-50%, -100%); pointer-events: none; white-space: nowrap; display: none;
    padding: 4px 12px; border-radius: 12px; background: rgba(255, 190, 30, .92); color: #5a3000;
    font-size: 16px; font-weight: 900; box-shadow: 0 2px 6px rgba(0, 0, 0, .25);
  }
  #village-sign.bump { animation: pop .3s ease-out; }
  #version { position: fixed; right: 8px; bottom: calc(env(safe-area-inset-bottom) + 6px); color: rgba(30, 60, 20, .55); font-size: 11px; pointer-events: none; }
  #error {
    position: fixed; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom) + 70px);
    padding: 8px 10px; border-radius: 10px; background: rgba(180, 30, 30, .9); color: #fff;
    font-size: 12px; white-space: pre-wrap; display: none; pointer-events: none;
  }
  #result {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(30, 40, 20, .5);
  }
  #result.show { display: flex; }
  #result .card {
    width: min(86vw, 360px); padding: 22px 20px 18px; border-radius: 22px; background: #fffbea; color: #5a3a10;
    text-align: center; box-shadow: 0 8px 24px rgba(0, 0, 0, .35); animation: cardin .45s cubic-bezier(.2, 1.6, .4, 1);
  }
  @keyframes cardin { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #result h1 { font-size: 22px; color: #c2410c; }
  #result .big { font-size: 46px; font-weight: 900; margin: 6px 0 10px; color: #e08a00; }
  #result .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-bottom: 14px; font-size: 15px; font-weight: 800; }
  #result .stats div { background: #f6ead0; border-radius: 10px; padding: 6px 4px; }
  #result button { display: block; width: 100%; margin-top: 8px; padding: 12px; border: 0; border-radius: 14px; font-size: 18px; font-weight: 900; }
  #again { background: #ff9f1c; color: #fff; box-shadow: 0 3px 0 #c2410c; }
  #keep { background: #ece2c6; color: #6a4a2c; font-size: 15px !important; }
</style>
</head>
<body>
  <div id="stick-base" class="stick"></div>
  <div id="stick-knob" class="stick"></div>
  <div id="hud">
    <div id="chick-pill" class="pill">🐤 <span id="chicks">0</span></div>
    <div id="feed-pill" class="pill">🌾 <span id="feed">0</span></div>
    <div id="parts-pill" class="pill">⚙️ <span id="parts">0</span></div>
    <div id="time-pill" class="pill">⏱ <span id="time">60</span></div>
  </div>
  <div id="combo"></div>
  <div id="toast"></div>
  <div id="hint">画面をなぞって ひよこを動かそう</div>
  <div id="arrow">➤</div>
  <div id="village-sign"></div>
  <div id="version"></div>
  <div id="error"></div>
  <div id="result"><div class="card">
    <h1>⏱ 60秒 しゅうりょう!</h1>
    <div class="big">🐤 <span id="r-chicks">0</span>羽</div>
    <div class="stats">
      <div>📦 <span id="r-broken">0</span>こ</div>
      <div>🔥 最大 <span id="r-combo">0</span>コンボ</div>
      <div>🏠 建物 <span id="r-lv">0</span>/8</div>
      <div>🌾 <span id="r-feed">0</span></div>
    </div>
    <button id="again" type="button">もう一回 ▶</button>
    <button id="keep" type="button">このまま続けて遊ぶ</button>
  </div></div>

<script type="module">
  import * as THREE from '../vendor/three.module.min.js';

  // ================================================================
  //  設定(ここの数字を変えると、テンポや爽快感を調整できます)
  // ================================================================
  const GAME_TIME = 60;          // 1回の遊びの長さ(秒)
  const START_CHICKS = 4;        // 最初のひよこ(リーダーとは別)
  const LEADER_SPEED = 7.5;      // リーダーの速さ
  const WORLD = 44;              // 歩ける範囲(-WORLD〜WORLD)
  const MAX_DISPLAY = 360;       // 画面に描くひよこの最大数(これより多いときは、1羽が何羽ぶんかを表す)
  const SPACING = 0.34;          // 群れの中のひよこの間かく
  const PECK_DPS = 1.3;          // ひよこ1羽が1秒に与えるダメージ
  const MAX_TARGETS = 8;         // 同時に攻撃できる物の数
  const EGG_COST = 2;            // 卵1つに使うエサ
  const SELF_HATCH = (n) => 2.5 + Math.sqrt(n) * 0.45; // 群れが自分で卵をかえす速さ(1秒あたり)
  // 壊せる物(2種類)
  const CRATE_TIERS = [ // 木箱: 遠くほど固くて、たくさん出る
    { hp: 8, feed: 9, parts: 4, color: '#ffffff', size: 0.85 },   // color は木目の上にかける色
    { hp: 45, feed: 34, parts: 12, color: '#d9a27a', size: 1.0 },
    { hp: 180, feed: 110, parts: 40, color: '#a9b4c0', size: 1.15 },
  ];
  const CRATE_RESPAWN = 7;       // 木箱が別の場所にまた出るまでの秒数
  const BIG = { hp: 900, feed: 900, parts: 320, respawn: 25 }; // でっかいコンテナ
  // ひよこ村: パーツを払うと、建物が1つずつ空から落ちてきて建つ。村がどんどん広がる
  // rate: その建物が1秒に生むひよこ(1羽にエサ1)。x, z は建物の真ん中、w×d は広さ
  const VILLAGE = { x1: 3, x2: 23, z1: -19, z2: 1.5 }; // 村の範囲(木箱はここに出さない)
  const BUILDINGS = [
    { type: 'hut', name: '孵化小屋', icon: '🐣', x: 6, z: -5, w: 3.6, d: 3, cost: 40, rate: 4 },
    { type: 'barn', name: 'エサ倉庫', icon: '🌾', x: 10.5, z: -9, w: 3.6, d: 3, cost: 70, rate: 6 },
    { type: 'incub', name: 'ふ卵器ハウス', icon: '🥚', x: 15.6, z: -5.5, w: 3.6, d: 3, cost: 120, rate: 10 },
    { type: 'belt', name: 'たまごコンベア', icon: '🥚', x: 11, z: -3.6, w: 5.4, d: 1.2, cost: 180, rate: 14 },
    { type: 'hut', name: '孵化小屋 2', icon: '🐣', x: 5.5, z: -12, w: 3.6, d: 3, cost: 260, rate: 20 },
    { type: 'mill', name: '風車', icon: '🌬️', x: 16, z: -12.5, w: 3, d: 3, cost: 380, rate: 28 },
    { type: 'factory', name: 'ひよこ工場', icon: '🏭', x: 11, z: -16, w: 6.4, d: 4, cost: 560, rate: 45 },
    { type: 'statue', name: '黄金ひよこ像', icon: '🏆', x: 20.5, z: -2.2, w: 3, d: 3, cost: 900, rate: 80 },
  ];

  const CAM_YAW = Math.PI / 4;
  const SCREEN_RIGHT = { x: Math.cos(CAM_YAW), z: -Math.sin(CAM_YAW) };
  const SCREEN_DOWN = { x: Math.sin(CAM_YAW), z: Math.cos(CAM_YAW) };
  const STICK_RADIUS = 56;

  const $ = (id) => document.getElementById(id);
  const GAME_VERSION = '2026.11.13-h2';
  $('version').textContent = '🐤 v' + GAME_VERSION;

  const errorsSeen = [];
  function reportError(where, err) {
    const text = where + ': ' + (err && err.message ? err.message : String(err));
    if (errorsSeen.includes(text)) return;
    errorsSeen.push(text);
    console.error(where, err);
    const stack = err && err.stack ? '\n' + String(err.stack).split('\n').slice(0, 3).join('\n') : '';
    $('error').textContent = 'エラー(v' + GAME_VERSION + ') ' + text + stack;
    $('error').style.display = 'block';
  }
  window.addEventListener('error', (e) => reportError('window', e.error || e.message));
  window.addEventListener('unhandledrejection', (e) => reportError('promise', e.reason));
  function safe(name, fn) { try { fn(); } catch (err) { reportError(name, err); } }

  // ================================================================
  //  3Dの土台
  // ================================================================
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.prepend(renderer.domElement);
  const SKY = '#bfe7a0';
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(SKY);
  scene.fog = new THREE.Fog(SKY, 45, 95);
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 160);
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.fov = w < h ? 42 : 30;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();
  scene.add(new THREE.HemisphereLight('#fffbe8', '#7a9a50', 1.6));
  const sun = new THREE.DirectionalLight('#fff1d0', 2.0);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.03;
  scene.add(sun, sun.target);
  const SUN_OFFSET = new THREE.Vector3(-10, 24, 6);

  let seed = 7;
  function rand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
  const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _p = new THREE.Vector3(), _s = new THREE.Vector3();
  const tmpA = new THREE.Vector3();
  function setInst(mesh, i, x, y, z, sx, sy, sz, ry = 0, rx = 0, rz = 0) {
    _q.setFromEuler(_e.set(rx, ry, rz));
    mesh.setMatrixAt(i, _m4.compose(_p.set(x, y, z), _q, _s.set(sx, sy, sz)));
  }
  function canvasTexture(size, draw, repeat = 1) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    draw(c.getContext('2d'), size);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    if (repeat !== 1) { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(repeat, repeat); }
    return tex;
  }
  // いくつかの形を1つにまとめる(色は頂点に焼きこむ)。描く回数を減らして軽くする
  function mergeGeometries(list) {
    let count = 0;
    const gs = list.map(({ geo, m }) => {
      const g = (geo.index ? geo.toNonIndexed() : geo.clone()).applyMatrix4(m);
      count += g.attributes.position.count;
      return g;
    });
    const pos = new Float32Array(count * 3), nor = new Float32Array(count * 3), col = new Float32Array(count * 3);
    let o = 0;
    gs.forEach((g, gi) => {
      const n = g.attributes.position.count;
      pos.set(g.attributes.position.array, o * 3);
      nor.set(g.attributes.normal.array, o * 3);
      const c = new THREE.Color(list[gi].color || '#ffffff');
      for (let i = 0; i < n; i++) col.set([c.r, c.g, c.b], (o + i) * 3);
      o += n;
    });
    const out = new THREE.BufferGeometry();
    out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    out.setAttribute('color', new THREE.BufferAttribute(col, 3));
    return out;
  }
  const M = (x = 0, y = 0, z = 0, sx = 1, sy = 1, sz = 1, rx = 0, ry = 0, rz = 0) =>
    new THREE.Matrix4().compose(V(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), V(sx, sy, sz));

  // ================================================================
  //  地面(草原と柵)
  // ================================================================
  const groundTex = canvasTexture(256, (g, n) => {
    g.fillStyle = '#9fd977'; g.fillRect(0, 0, n, n);
    g.fillStyle = '#93cf6b'; g.fillRect(0, 0, n / 2, n / 2); g.fillRect(n / 2, n / 2, n / 2, n / 2);
    for (let i = 0; i < 160; i++) {
      g.fillStyle = i % 3 ? 'rgba(70,140,50,.35)' : 'rgba(255,255,220,.35)';
      g.fillRect(Math.random() * n, Math.random() * n, 3, 7);
    }
  }, 22);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(WORLD * 2 + 30, WORLD * 2 + 30), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  {
    // まわりの柵(丸太の杭を1回で描く)
    let n = 0;
    for (let s = -WORLD; s < WORLD; s += 1.2) n += 4; // 杭の数を先に数える(多く描くと形がくずれる)
    const posts = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.22, 0.22, 1.1, 7), new THREE.MeshStandardMaterial({ color: '#a8743f', roughness: 0.9 }), n);
    let k = 0;
    for (let s = -WORLD; s < WORLD; s += 1.2) {
      for (const [x, z] of [[s, -WORLD - 0.6], [s, WORLD + 0.6], [-WORLD - 0.6, s], [WORLD + 0.6, s]]) setInst(posts, k++, x, 0.55, z, 1, 1, 1);
    }
    posts.count = k;
    posts.castShadow = true;
    scene.add(posts);
    // 飾りの木と花
    const trunks = [], leaves = [], flowers = [];
    for (let i = 0; i < 70; i++) {
      const a = rand() * Math.PI * 2, r = WORLD + 3 + rand() * 10;
      trunks.push([Math.cos(a) * r, Math.sin(a) * r, 0.8 + rand() * 0.6]);
    }
    for (let i = 0; i < 260; i++) flowers.push([(rand() * 2 - 1) * WORLD, (rand() * 2 - 1) * WORLD, rand()]);
    const trunkMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.25, 0.32, 1.4, 6), new THREE.MeshStandardMaterial({ color: '#8a5a30' }), trunks.length);
    const leafMesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1.6, 0), new THREE.MeshStandardMaterial({ color: '#4caf50', flatShading: true }), trunks.length);
    trunks.forEach(([x, z, s], i) => { setInst(trunkMesh, i, x, 0.7 * s, z, s, s, s); setInst(leafMesh, i, x, 2.3 * s, z, s, s * 1.1, s); });
    leafMesh.castShadow = trunkMesh.castShadow = true;
    const flowerMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.12, 5, 4), new THREE.MeshBasicMaterial({ color: '#ffffff' }), flowers.length);
    const fcol = ['#ffffff', '#ffe066', '#ff9ec7'].map(c => new THREE.Color(c));
    flowers.forEach(([x, z, c], i) => { setInst(flowerMesh, i, x, 0.06, z, 1, 0.6, 1); flowerMesh.setColorAt(i, fcol[Math.floor(c * 3)]); });
    scene.add(trunkMesh, leafMesh, flowerMesh);
  }

  // ================================================================
  //  ひよこの形(1つにまとめた形を、たくさん並べて描く)
  // ================================================================
  const YELLOW = '#ffd23a', ORANGE = '#ff8a1c';
  const chickGeo = mergeGeometries([
    { geo: new THREE.SphereGeometry(0.22, 9, 7), m: M(0, 0.22, 0, 1, 0.9, 1.1), color: YELLOW },          // からだ
    { geo: new THREE.SphereGeometry(0.16, 9, 7), m: M(0, 0.44, 0.12), color: YELLOW },                    // あたま
    { geo: new THREE.ConeGeometry(0.06, 0.12, 6), m: M(0, 0.43, 0.3, 1, 1, 1, Math.PI / 2), color: ORANGE }, // くちばし
    { geo: new THREE.SphereGeometry(0.03, 5, 4), m: M(0.08, 0.48, 0.24), color: '#2b1d10' },              // 目
    { geo: new THREE.SphereGeometry(0.03, 5, 4), m: M(-0.08, 0.48, 0.24), color: '#2b1d10' },
    { geo: new THREE.SphereGeometry(0.09, 6, 5), m: M(0.2, 0.24, -0.02, 0.5, 0.8, 1.2), color: '#ffc21a' }, // はね
    { geo: new THREE.SphereGeometry(0.09, 6, 5), m: M(-0.2, 0.24, -0.02, 0.5, 0.8, 1.2), color: '#ffc21a' },
    { geo: new THREE.ConeGeometry(0.05, 0.12, 5), m: M(0, 0.62, 0.1), color: '#ffcf2a' },                  // あたまの毛
  ]);
  const chickMat = new THREE.MeshLambertMaterial({ vertexColors: true });
  const flockMesh = new THREE.InstancedMesh(chickGeo, chickMat, MAX_DISPLAY);
  flockMesh.castShadow = true;
  flockMesh.frustumCulled = false;
  scene.add(flockMesh);

  // リーダー(赤いはちまきの、大きめのひよこ)
  const leader = new THREE.Group();
  const leaderBody = new THREE.Mesh(chickGeo, chickMat);
  leaderBody.scale.setScalar(1.7);
  leaderBody.castShadow = true;
  leader.add(leaderBody);
  const band = new THREE.Mesh(new THREE.TorusGeometry(0.27, 0.05, 6, 16), new THREE.MeshLambertMaterial({ color: '#e63946' }));
  band.rotation.x = Math.PI / 2;
  band.position.set(0, 0.8, 0.2);
  leader.add(band);
  scene.add(leader);
  const L = { x: 0, z: 2, vx: 0, vz: 0, face: Math.PI, moving: false };
  leader.position.set(L.x, 0, L.z);

  // ================================================================
  //  使い回しの粒(破片・エサ・パーツ・卵・けむり)
  // ================================================================
  function makePool(geo, material, max, opts = {}) {
    const mesh = new THREE.InstancedMesh(geo, material, max);
    mesh.count = 0;
    mesh.frustumCulled = false;
    mesh.castShadow = !!opts.shadow;
    scene.add(mesh);
    return { mesh, max, items: [] };
  }
  const debris = makePool(new THREE.BoxGeometry(0.22, 0.08, 0.14), new THREE.MeshLambertMaterial({ color: '#c58a4a' }), 260, { shadow: true });
  const puffs = makePool(new THREE.IcosahedronGeometry(0.25, 0), new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.8 }), 120);

      if (!audioPrimed || audio.state !== 'running') {
        const src = audio.createBufferSource();
        src.buffer = audio.createBuffer(1, 1, 22050);
        src.connect(audio.destination);
        src.start(0);
        audioPrimed = true;

    if (!audio || audio.state !== 'running' || blipBudget <= 0) return;

    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audio.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  const stick = { active: false, id: null, ox: 0, oy: 0, dx: 0, dy: 0 };

  let bot = false; // 自動テスト用: 近くの物へ自動で向かう
  function readInput() {

  function botInput() {

  // ================================================================

  function updateLeader(dt) {
    const { ix, iz } = readInput();
    const moving = Math.hypot(ix, iz) > 0.01;

    const sp = LEADER_SPEED * (1 + Math.min(0.4, Math.log10(1 + chicks) * 0.08));
    L.vx += (ix * sp - L.vx) * Math.min(1, dt * 14);

  let attackList = [];
  function updateFlock(dt, time) {
    // 群れの中心はリーダーを少し遅れて追う

    flock.cx += (L.x - flock.cx) * k;

    while (disp.length < D) addDisplay(flock.cx + (Math.random() - 0.5) * 2, flock.cz + (Math.random() - 0.5) * 2);
    if (disp.length > D) disp.length = D;
    flock.scale = 1 + Math.max(0, Math.log10(Math.max(1, chicks / MAX_DISPLAY))) * 0.35; // 表示より多いぶん、1羽を大きく見せる

    const n = disp.length;
    const alive = attackList.filter(a => a.t.alive);
    for (let i = 0; i < n; i++) {
      const c = disp[i];

  function damage(t, amount) {

  function updateTargets(dt, time) {
    let k = 0;

  // 破片・けむり・エサ・パーツ
  function updateParticles(dt) {
    const g = 22;
    let i = 0;
    debris.items = debris.items.filter(d => (d.t += dt) < d.life);
    for (const d of debris.items) {
      d.vy -= g * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt; d.r += d.vr * dt;
      if (d.y < 0.05) { d.y = 0.05; d.vy *= -0.3; d.vx *= 0.6; d.vz *= 0.6; }
      const s = d.sc * Math.min(1, (d.life - d.t) * 4);

          const tx = pay ? nb.x : L.x, tz = pay ? nb.z : L.z, ty = pay ? 1.2 : 0.6;
          const dx = tx - d.x, dy = ty - d.y, dz = tz - d.z, dist = Math.hypot(dx, dy, dz);

  let collectPitch = 0;

  }

  // ひよこが増える: 群れは自分で卵をかえし、孵化場はエサを使ってどんどん生む
  function updateHatching(dt) {
    collectPitch = Math.max(0, collectPitch - dt * 30);
    hatchAcc += dt * SELF_HATCH(chicks);
    let eggs = Math.floor(hatchAcc);
    if (eggs > 0) {
      eggs = Math.min(eggs, Math.floor(feed / EGG_COST));
      hatchAcc -= Math.floor(hatchAcc);
      if (eggs > 0) {
        feed -= eggs * EGG_COST;
        // 卵の見た目(足りないときは1つの卵が何羽ぶんかを持つ)
        const slots = Math.max(1, Math.min(eggs, eggPool.max - eggPool.items.length));
        for (let k = 0; k < slots; k++) {
          const n = Math.floor(eggs / slots) + (k < eggs % slots ? 1 : 0);
          if (eggPool.items.length >= eggPool.max) { chicks += n; continue; }
          const a = Math.random() * Math.PI * 2, r = Math.random() * flock.r;
          eggPool.items.push({ x: flock.cx + Math.cos(a) * r, z: flock.cz + Math.sin(a) * r, t: 0, n });
        }
      }
    }
    // 村の建物: エサを使ってひよこを生む。生まれたひよこは扉から群れへ走っていく
    for (let i = 0; i < village.built; i++) {
      const b = BUILDINGS[i];
      if (b.drop > 0) continue;
      b.acc += dt * b.rate;
      const born = Math.min(Math.floor(b.acc), Math.floor(feed));
      b.acc -= Math.floor(b.acc);
      if (born > 0) { feed -= born; chicks += born; b.working = 0.3; }
      b.runT -= dt;
      if (b.working > 0 && b.runT <= 0) {
        b.runT = 1 / Math.min(6, 1 + b.rate / 6);
        spawnRunner(b.x + b.door.x, b.z + b.door.z);
      }
      b.working = Math.max(0, (b.working || 0) - dt);
    }
  }
  function spawnRunner(x, z) {

  }
  function updateEggs(dt, time) {
    let i = 0;
    const keep = [];
    for (const e of eggPool.items) {
      e.t += dt;

        chicks += e.n;
        burstPuff(e.x, 0.3, e.z, 2, 0.4);
        blip(1100 + Math.random() * 300, 0.05, 'sine', 0.04, 1.6);

      }
      const wob = Math.sin(e.t * 50) * 0.25 * (e.t / 0.45);
      const s = Math.min(1, e.t * 8);
      setInst(eggPool.mesh, i++, e.x, 0.2, e.z, s, s * 1.3, s, 0, 0, wob);
      keep.push(e);
    }
    eggPool.items = keep;
    eggPool.mesh.count = i; eggPool.mesh.instanceMatrix.needsUpdate = true;

      setInst(runnerPool.mesh, i++, r.x, Math.abs(Math.sin(r.t * 18)) * 0.15, r.z, 0.9, 0.9, 0.9, Math.atan2(dx, dz));
      keepR.push(r);
    }
    runnerPool.items = keepR;
    runnerPool.mesh.count = i; runnerPool.mesh.instanceMatrix.needsUpdate = true;
  }

  // 次の建物の枠に立つと、パーツを払って建てる
  let payT = 0;
  function updateVillage(dt, time) {
    const b = nextBuilding();
    if (b) {
      const inZone = Math.abs(L.x - b.zone.x) < b.zone.half && Math.abs(L.z - b.zone.z) < b.zone.half;
      zoneMesh.scale.setScalar(inZone ? 1.08 : 1);
      zoneMat.color.set(inZone ? '#fff3b0' : '#ffffff');
      if (inZone && parts >= 1) {
        // 何秒も待たないように、1秒たらずで払い終わる
        const pay = Math.min(parts, Math.max(1, b.cost * dt * 1.8), b.cost - village.paid);
        parts -= pay; village.paid += pay;
        payT -= dt;
        if (payT <= 0) {
          payT = 0.04;
          blip(500 + village.paid / b.cost * 600, 0.04, 'sine', 0.04);
          for (let k = 0; k < 2 && partsPool.items.length < partsPool.max; k++)
            partsPool.items.push({ kind: 'pay', value: 0, x: L.x, y: 1, z: L.z, vx: (b.x - L.x) * 1.3 + (Math.random() - 0.5) * 3, vy: 8, vz: (b.z - L.z) * 1.3 + (Math.random() - 0.5) * 3, t: 0, delay: 0.3, r: 0 });
        }
        zc.redraw();
        if (village.paid >= b.cost - 1e-6) completeBuilding(b);
      }
      // 工事中の足場: 払った分だけ伸びる
      const k = village.paid / b.cost;
      ghost.visible = k > 0;
      if (ghost.visible) { const h = 0.2 + k * 3; ghost.scale.set(b.w * 0.9, h, b.d * 0.9); ghost.position.set(b.x, h / 2, b.z); }
    } else ghost.visible = false;

    // 建物の動き(落ちてくる・弾む・回る・けむり)
    let beltN = 0;
    for (let i = 0; i < village.built; i++) {
      const bd = BUILDINGS[i], g = bd.group;
      if (bd.drop > 0) {
        bd.drop = Math.max(0, bd.drop - dt);
        const k = 1 - bd.drop / 0.35;
        g.position.y = 9 * (1 - k * k);
        if (bd.drop === 0) landBuilding(bd);
      } else {
        g.position.y = 0;
      }
      if (bd.bounce > 0) {
        bd.bounce = Math.max(0, bd.bounce - dt);
        const k = bd.bounce / 0.45, w = Math.sin(k * Math.PI * 3) * k;
        g.scale.set(1 + w * 0.18, 1 - w * 0.25, 1 + w * 0.18);
      } else {
        const pulse = bd.working > 0 ? 1 + Math.sin(time * 18) * 0.015 : 1; // ひよこを生んでいる間は、少しぷるぷるする
        g.scale.set(pulse, 1 / pulse, pulse);
      }
      if (bd.spin) { if (bd.type === 'mill') bd.spin.rotation.z += dt * 2.2; else bd.spin.rotation.y += dt * 0.8; }
      if (bd.chimneys && bd.drop === 0) {
        bd.smokeT = (bd.smokeT || 0) - dt;
        if (bd.smokeT <= 0) {
          bd.smokeT = 0.18;
          for (const c of bd.chimneys) {
            if (puffs.items.length >= puffs.max) puffs.items.shift();
            puffs.items.push({ x: bd.x + c.x, y: 5.3, z: bd.z + c.z, vx: (Math.random() - 0.5) * 0.4, vy: 1.6, vz: (Math.random() - 0.5) * 0.4, t: 0, life: 1.1, sc: 0.8 });
          }
        }
      }
      if (bd.type === 'statue' && bd.drop === 0 && Math.random() < dt * 4) burstPuff(bd.x + (Math.random() - 0.5) * 2, 1 + Math.random() * 3, bd.z + (Math.random() - 0.5) * 2, 1, 0.3);
      if (bd.belt && bd.drop === 0) {
        for (let e = 0; e < 12; e++) {
          const u = ((time * 0.35 + e / 12) % 1);
          setInst(beltEggs, beltN++, bd.x - bd.w / 2 + 0.6 + u * (bd.w - 1.2), 0.72, bd.z, 1, 1.25, 1);
        }
      }
    }
    beltEggs.count = beltN;
    beltEggs.instanceMatrix.needsUpdate = true;

    // エサ袋のタワー(エサが多いほど高く積み上がる)
    const barn = BUILDINGS.find(x => x.type === 'barn');
    const n = barn.group && barn.drop === 0 ? Math.min(SACK_MAX, Math.ceil(Math.sqrt(Math.max(0, feed)) * 1.7)) : 0;
    if (n !== sacksShown) {
      sacksShown = n;
      const spot = barn.sackSpot || { x: 0, z: 0 }; // 倉庫が建つまでは0個
      const bx = barn.x + spot.x, bz = barn.z + spot.z;
      for (let i = 0; i < n; i++) {
        const layer = Math.floor(i / 6), j = i % 6;
        const x = bx + ((j % 2) - 0.5) * 0.46, z = bz + (Math.floor(j / 2) - 1) * 0.38;
        setInst(sackMesh, i, x, 0.32 + layer * 0.25, z, 1, 1, 1, ((i * 37) % 7 - 3) * 0.04);
      }
      sackMesh.count = n;
      sackMesh.instanceMatrix.needsUpdate = true;
    }
  }
  function completeBuilding(b) {
    village.built++;
    village.paid = 0;
    village.rate += b.rate;
    b.group = new THREE.Group();
    b.group.position.set(b.x, 9, b.z);
    MAKERS[b.type](b.group, b);
    scene.add(b.group);
    b.drop = 0.35; // 空から落ちてくる
    b.plot.visible = false;
    ghost.visible = false;
    if (marks.hatchery === null) marks.hatchery = elapsed;
    placeZone();
    blipBudget += 2;
    blip(300, 0.3, 'sine', 0.06, 2.5); // ひゅーん
  }
  function landBuilding(b) {
    b.bounce = 0.45;
    shake = Math.max(shake, b.type === 'factory' || b.type === 'statue' ? 0.45 : 0.3);
    boom(0.16);
    // 土ぼこりが輪になって広がる
    for (let i = 0; i < 18; i++) {
      if (puffs.items.length >= puffs.max) puffs.items.shift();
      const a = i / 18 * Math.PI * 2, r = Math.max(b.w, b.d) / 2;
      puffs.items.push({ x: b.x + Math.cos(a) * r, y: 0.3, z: b.z + Math.sin(a) * r, vx: Math.cos(a) * 4, vy: 0.6, vz: Math.sin(a) * 4, t: 0, life: 0.5, sc: 1.2 });
    }
    burstDebris(b.x, 0.3, b.z, 12, '#c9a06a', 5);
    // 開店の合図に、ひよこが一気に飛び出す
    for (let k = 0; k < 12; k++) spawnRunner(b.x + b.door.x, b.z + b.door.z);
    toast(b.icon + ' ' + b.name + ' ができた! +' + b.rate + '羽/秒');
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => { blipBudget++; blip(f, 0.12, 'triangle', 0.07, 1.05); }, i * 80));
  }

  // ================================================================
  //  画面の文字
  // ================================================================
  const popPool = [];
  for (let i = 0; i < 10; i++) { const el = document.createElement('div'); el.className = 'pop-text'; document.body.appendChild(el); popPool.push({ el, t: 0, x: 0, y: 0, z: 0 }); }
  let popIdx = 0;
  function popText(text, x, y, z, big) {
    const p = popPool[popIdx++ % popPool.length];
    p.el.textContent = text; p.t = 0.8; p.x = x; p.y = y; p.z = z;
    p.el.style.fontSize = big ? '30px' : '17px';
    p.el.style.display = 'block';
  }
  const hpBars = [];
  for (let i = 0; i < MAX_TARGETS; i++) { const el = document.createElement('div'); el.className = 'hp-bar'; el.innerHTML = '<div></div>'; document.body.appendChild(el); hpBars.push(el); }
  function project(x, y, z) {
    tmpA.set(x, y, z).project(camera);
    return { sx: (tmpA.x + 1) / 2 * window.innerWidth, sy: (1 - tmpA.y) / 2 * window.innerHeight, behind: tmpA.z > 1 };
  }
  let toastT = 0;
  function toast(text) { $('toast').textContent = text; $('toast').classList.add('show'); toastT = 2; }
  function showCombo() {
    const el = $('combo');
    if (combo < 3) return;
    el.textContent = combo + ' COMBO!';
    el.classList.add('show');
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  }
  let shownChicks = -1;
  function bumpChicks() { const el = $('chick-pill'); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  function updateHud(dt) {
    const c = Math.floor(chicks);
    if (c !== shownChicks) { shownChicks = c; $('chicks').textContent = fmt(c); }
    $('feed').textContent = fmt(feed);
    $('parts').textContent = fmt(parts);
    $('time').textContent = endless ? '∞' : Math.ceil(timeLeft);
    $('time-pill').classList.toggle('low', !endless && started && timeLeft < 10);
    if (comboT > 0) { comboT -= dt; if (comboT <= 0) { combo = 0; $('combo').classList.remove('show'); } }
    if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('show'); }
    for (const p of popPool) {
      if (p.t <= 0) continue;
      p.t -= dt;
      const s = project(p.x, p.y + (0.8 - p.t) * 1.5, p.z);
      p.el.style.left = s.sx + 'px'; p.el.style.top = s.sy + 'px';
      p.el.style.opacity = Math.min(1, p.t * 3);
      if (p.t <= 0) p.el.style.display = 'none';
    }
    // 村の看板: 村ぜんぶで1秒に何羽生むか
    const sign = $('village-sign');
    if (village.built > 0) {
      const p = project((VILLAGE.x1 + VILLAGE.x2) / 2 - 2, 5.5, -8);
      const text = '🐣 ひよこ村 +' + village.rate + '羽/秒';
      if (sign.textContent !== text) { sign.textContent = text; sign.classList.remove('bump'); void sign.offsetWidth; sign.classList.add('bump'); }
      sign.style.display = p.behind || p.sy < 190 || p.sy > window.innerHeight - 80 ? 'none' : 'block'; // 上のお知らせと重ならないように
      sign.style.left = p.sx + 'px'; sign.style.top = p.sy + 'px';
    }
    hpBars.forEach((el, i) => {
      const a = attackList[i];
      if (!a || !a.t.alive || a.t.hp >= a.t.maxHp) { el.style.display = 'none'; return; }
      const s = project(a.t.x, a.t.kind === 'big' ? 2.8 : a.t.size + 0.35, a.t.z);
      el.style.display = 'block';
      el.style.left = s.sx + 'px'; el.style.top = s.sy + 'px';
      el.style.width = (a.t.kind === 'big' ? 90 : 44) + 'px';
      el.style.marginLeft = (a.t.kind === 'big' ? -45 : -22) + 'px';
      el.firstChild.style.width = Math.max(0, a.t.hp / a.t.maxHp * 100) + '%';
    });
  }
  // 案内(画面下の文字と、行き先の矢印)
  const marker = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.85, 12), new THREE.MeshBasicMaterial({ color: '#ffc928' }));
  marker.rotation.x = Math.PI;
  marker.visible = false;
  scene.add(marker);
  function updateGuide(time) {
    let text = '', goal = null;
    const nb = nextBuilding();
    if (!started) text = '画面をなぞって ひよこを動かそう';
    else if (nb && parts >= nb.cost - village.paid) { text = '⚙️がたまった! ' + nb.icon + nb.name + 'を建てよう'; goal = nb.zone; }
    else if (village.built === 0 && elapsed < 25) text = '木箱に近づくと 自動でつつくよ';
    else if (village.built === 1 && elapsed - (marks.hatchery || 0) < 5) text = '建物が エサでひよこを自動で生むよ';
    else if (chicks >= 120) {
      const big = targets.filter(t => t.kind === 'big' && t.alive).sort((a, b) => Math.hypot(a.x - L.x, a.z - L.z) - Math.hypot(b.x - L.x, b.z - L.z))[0];
      if (big && Math.hypot(big.x - L.x, big.z - L.z) > flock.r + 3) { text = '💥 でっかいコンテナを こわそう!'; goal = big; }
    }
    $('hint').textContent = text;
    $('hint').style.opacity = text ? 1 : 0;
    const arrow = $('arrow');
    if (!goal) { marker.visible = false; arrow.style.display = 'none'; return; }
    marker.visible = true;
    marker.position.set(goal.x, (goal.kind === 'big' ? 3.4 : 1.6) + Math.abs(Math.sin(time * 4)) * 0.5, goal.z);
    marker.rotation.y = time * 2;
    const s = project(goal.x, 1, goal.z), W = window.innerWidth, H = window.innerHeight, top = 90;
    if (!s.behind && s.sx > 30 && s.sx < W - 30 && s.sy > top && s.sy < H - 90) { arrow.style.display = 'none'; return; }
    const c = project(L.x, 0, L.z);
    let dx = s.sx - c.sx, dy = s.sy - c.sy;
    if (s.behind) { dx = -dx; dy = -dy; }
    const k = Math.min(Math.abs((dx > 0 ? W - 30 - c.sx : c.sx - 30) / (dx || 1e-6)), Math.abs((dy > 0 ? H - 90 - c.sy : c.sy - top) / (dy || 1e-6)));
    arrow.style.display = 'block';
    arrow.style.left = (c.sx + dx * k) + 'px'; arrow.style.top = (c.sy + dy * k) + 'px';
    arrow.style.transform = 'rotate(' + Math.atan2(dy, dx) + 'rad)';
  }

  // ================================================================
  //  1回の遊び(60秒)
  // ================================================================
  function start() { started = true; }
  function finish() {
    ended = true;
    for (const e of eggPool.items) chicks += e.n; // かえりかけの卵も数に入れてから結果を出す
    eggPool.items = [];
    $('r-chicks').textContent = fmt(chicks);
    $('r-broken').textContent = broken;
    $('r-combo').textContent = maxCombo;
    $('r-lv').textContent = village.built;
    $('r-feed').textContent = fmt(feed);
    $('result').classList.add('show');
    Object.assign(stick, { active: false, id: null, dx: 0, dy: 0 }); showStick();
    [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => { blipBudget++; blip(f, 0.16, 'triangle', 0.08, 1.02); }, i * 110));
  }
  $('again').addEventListener('click', () => location.reload());
  $('keep').addEventListener('click', () => { endless = true; ended = false; $('result').classList.remove('show'); });

  function logic(dt, time) {
    blipBudget = Math.min(blipBudget + dt * 40, 6);
    if (started && !ended) {
      elapsed += dt;
      if (!endless) { timeLeft = Math.max(0, GAME_TIME - elapsed); if (timeLeft <= 0) finish(); }
    }
    const play = !ended;
    if (play) safe('leader', () => updateLeader(dt));
    safe('flock', () => updateFlock(play ? dt : 0, time));
    safe('targets', () => updateTargets(dt, time));
    safe('particles', () => updateParticles(dt));
    if (play) safe('hatch', updateHatching.bind(null, dt));
    safe('village', () => updateVillage(play ? dt : 0, time));
    safe('eggs', () => updateEggs(dt, time));
    if (marks.ten === null && chicks >= 10) marks.ten = elapsed;
    if (marks.hundred === null && chicks >= 100) marks.hundred = elapsed;
  }

  // ================================================================
  //  メインループ
  // ================================================================
  const camTarget = V(L.x, 0, L.z);
  let camDist = 12;
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const time = now / 1000;
    logic(dt, time);
    // カメラ: 群れが大きくなるほど引いて、全体が見えるようにする
    camTarget.x += (L.x - camTarget.x) * Math.min(1, dt * 6);
    camTarget.z += (L.z - camTarget.z) * Math.min(1, dt * 6);
    const want = 11 + flock.r * 2.1;
    camDist += (want - camDist) * Math.min(1, dt * 1.5);
    camera.position.set(camTarget.x + Math.sin(CAM_YAW) * camDist * 0.75, camDist * 1.05, camTarget.z + Math.cos(CAM_YAW) * camDist * 0.75);
    camera.lookAt(camTarget.x, 0, camTarget.z);
    if (shake > 0) {
      shake = Math.max(0, shake - dt);
      camera.position.x += (Math.random() - 0.5) * shake * 1.2;
      camera.position.y += (Math.random() - 0.5) * shake * 1.2;
    }
    const sh = Math.max(20, camDist * 1.3);
    Object.assign(sun.shadow.camera, { left: -sh, right: sh, top: sh, bottom: -sh, near: 1, far: 120 });
    sun.shadow.camera.updateProjectionMatrix();
    sun.position.copy(camTarget).add(SUN_OFFSET);
    sun.target.position.copy(camTarget);
    safe('hud', () => { updateHud(dt); updateGuide(time); });
    safe('render', () => renderer.render(scene, camera));
    adaptQuality(now);
  }
  let qFrames = 0, qStart = performance.now(), pixelRatio = renderer.getPixelRatio();
  function adaptQuality(now) {
    qFrames++;
    const el = now - qStart;
    if (el < 3000) return;
    const fps = qFrames / (el / 1000);
    qFrames = 0; qStart = now;
    if (document.hidden) return;
    if (fps < 40 && pixelRatio > 1) { pixelRatio = Math.max(1, pixelRatio - 0.25); renderer.setPixelRatio(pixelRatio); resize(); }
  }
  document.addEventListener('visibilitychange', () => { last = performance.now(); qStart = last; qFrames = 0; });
  renderer.domElement.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    $('hint').textContent = '画面が止まりました。ページを再読み込みしてください';
    $('hint').style.opacity = 1;
  });
  requestAnimationFrame(frame);

  // 自動テスト用
  window.__renderer = renderer;
  window.__game = {
    get state() {
      return { chicks: Math.floor(chicks), feed: Math.floor(feed), parts: Math.floor(parts), elapsed, timeLeft, started, ended, broken, maxCombo, hatchery: village.built, rate: village.rate, marks: { ...marks }, errors: errorsSeen.slice(), display: disp.length, drops: feedPool.items.length + partsPool.items.length, x: L.x, z: L.z, attacking: attackList.map(a => [a.t.kind, Math.round(a.t.hp), a.t.alive]), near: targets.filter(t => t.alive).map(t => [t.kind, +Math.hypot(t.x - L.x, t.z - L.z).toFixed(1), Math.round(t.hp)]).sort((a, b) => a[1] - b[1]).slice(0, 3), flockR: flock.r };
    },
    bot(on) { bot = on; },
    teleport(x, z) { L.x = x; L.z = z; flock.cx = x; flock.cz = z; },
    // 描かずに時間を進める(テンポの調整用)
    fastForward(sec, step = 1 / 30) { for (let t = 0; t < sec && !ended; t += step) logic(step, performance.now() / 1000 + t); return this.state; },
  };
</script>
</body>
