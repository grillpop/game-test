<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="雪原開拓">
<meta name="theme-color" content="#cfe2f0">
<title>雪原開拓(仮)</title>
<style>
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: #cfe2f0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  .stick { position: fixed; border-radius: 50%; pointer-events: none; display: none; transform: translate(-50%, -50%); }
  #stick-base { width: 112px; height: 112px; background: rgba(255, 255, 255, .25); border: 3px solid rgba(255, 255, 255, .7); }
  #stick-knob { width: 52px; height: 52px; background: rgba(255, 255, 255, .95); }
  #hud { position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: 10px; display: flex; gap: 6px; pointer-events: none; }
  .pill {
    display: flex; align-items: center; gap: 4px; padding: 4px 11px; border-radius: 999px; min-width: 64px; justify-content: center;
    background: rgba(20, 34, 52, .5); border: 1px solid rgba(255, 255, 255, .3); color: #fff; font-size: 16px; font-weight: 800;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .pill.hide { display: none; }
  .pill.bump { animation: bump .18s ease-out; }
  @keyframes bump { 50% { transform: scale(1.15); } }
  #toast { position: fixed; left: 0; right: 0; padding: 0 12px; top: calc(env(safe-area-inset-top) + 52px); text-align: center; pointer-events: none; color: #fff; font-size: clamp(15px, 4.6vw, 21px); font-weight: 900; text-shadow: 0 2px 0 #2a5a8a, 0 3px 10px rgba(0, 0, 0, .35); opacity: 0; transform: translateY(-8px); transition: opacity .25s, transform .25s; }
  #toast.show { opacity: 1; transform: none; }
  #combo { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 84px); text-align: center; pointer-events: none; color: #fff; font-size: 24px; font-weight: 900; text-shadow: 0 2px 0 #2f7a3a, 0 3px 10px rgba(0, 0, 0, .35); opacity: 0; transition: opacity .3s; }
  #combo.show { opacity: 1; }
  #combo.bump { animation: bump .15s ease-out; }
  #hint { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 26px); text-align: center; pointer-events: none; color: #fff; font-size: 15px; font-weight: 800; text-shadow: 0 1px 4px rgba(0, 0, 0, .6); transition: opacity .5s; }
  .pop { position: fixed; pointer-events: none; transform: translate(-50%, -50%); white-space: nowrap; font-weight: 900; font-size: 18px; color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .45); display: none; }
  .site-label { position: fixed; pointer-events: none; transform: translate(-50%, -100%); display: none; text-align: center; }
  .site-label b { display: inline-block; padding: 2px 10px; border-radius: 999px; background: rgba(20, 60, 30, .72); color: #fff; font-size: 15px; font-weight: 900; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .site-label .t { color: #fff; font-size: 13px; font-weight: 900; text-shadow: 0 1px 3px rgba(0, 0, 0, .6); margin-bottom: 2px; white-space: nowrap; }
  .site-label .bar { width: 92px; height: 8px; margin: 3px auto 0; border-radius: 4px; background: rgba(0, 0, 0, .35); overflow: hidden; border: 1px solid rgba(255, 255, 255, .6); }
  .site-label .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7dff6a, #3fd35a); }
  .site-label.full b { background: rgba(230, 150, 20, .85); }
  #arrow { position: fixed; display: none; width: 40px; height: 40px; margin: -20px 0 0 -20px; font-size: 28px; line-height: 40px; text-align: center; color: #ffd23f; text-shadow: 0 0 3px #000; pointer-events: none; }
  #version { position: fixed; left: 8px; bottom: calc(env(safe-area-inset-bottom) + 6px); color: rgba(30, 50, 70, .5); font-size: 11px; pointer-events: none; }
  #debug { position: fixed; right: 8px; top: calc(env(safe-area-inset-top) + 38px); padding: 4px 8px; border-radius: 8px; background: rgba(0, 0, 0, .55); color: #fff; font: 11px/1.4 monospace; white-space: pre; pointer-events: none; display: none; }
  #over { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #000; z-index: 10; }
  #over.show { display: flex; animation: overIn 1.6s ease-in; }
  #over .go { font-family: Georgia, 'Times New Roman', serif; font-size: clamp(44px, 13vw, 84px); font-weight: 700; letter-spacing: .08em; color: #d11a1a; text-shadow: 0 0 18px rgba(200, 0, 0, .55); }
  #over .card button { margin-top: 42px; padding: 10px 30px; border: 1px solid #8a1414; border-radius: 4px; background: transparent; color: #d11a1a; font-size: 16px; font-weight: 700; letter-spacing: .2em; }
  @keyframes overIn { from { opacity: 0; } }
  #over .card { text-align: center; }
  /* 一時的な10分タイマー(あとで消す) */
  #timer { position: fixed; right: 8px; top: calc(env(safe-area-inset-top) + 8px); padding: 3px 10px; border-radius: 999px; background: rgba(20, 30, 45, .55); color: #fff; font: 700 14px/1.4 monospace; pointer-events: none; z-index: 5; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 2.4s ease; z-index: 9; }
  #fade.on { opacity: 1; }
  #clear { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: linear-gradient(rgba(255, 236, 190, .12), rgba(0, 0, 0, .45)); z-index: 10; }
  #clear.show { display: flex; animation: overIn 2.2s ease-in; }
  #clear .card { text-align: center; }
  #clear .cl { font-family: Georgia, 'Times New Roman', serif; font-size: clamp(48px, 15vw, 92px); font-weight: 700; letter-spacing: .1em; color: #ffd76a; text-shadow: 0 0 22px rgba(255, 190, 60, .7), 0 2px 0 #7a4a10; }
  #clear .sub { margin-top: 6px; color: #fff4d6; font-size: 16px; letter-spacing: .3em; text-shadow: 0 1px 4px #000; }
  #clear button { margin-top: 40px; padding: 10px 30px; border: 1px solid #ffd76a; border-radius: 4px; background: rgba(0, 0, 0, .25); color: #ffd76a; font-size: 16px; font-weight: 700; letter-spacing: .2em; }
  #dog-label { position: fixed; left: 0; top: 0; display: none; pointer-events: none; transform: translate(-50%, -100%); padding: 3px 9px; border-radius: 999px; background: rgba(255, 255, 255, .92); color: #c0453a; font-size: 13px; font-weight: 900; white-space: nowrap; box-shadow: 0 2px 6px rgba(0, 0, 0, .25); }
  /* 上の表示はお金だけ(オーナーの希望)。ほかの数は中で数えているだけ */
  #wood-pill, #meat-pill, #ice-pill, #bld-pill, #pop-pill, #kill-pill { display: none !important; }
  #error { position: fixed; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom) + 60px); padding: 8px 10px; border-radius: 10px; background: rgba(180, 30, 30, .92); color: #fff; font-size: 12px; white-space: pre-wrap; display: none; pointer-events: none; }
</style>
</head>
<body>
  <div id="stick-base" class="stick"></div>
  <div id="stick-knob" class="stick"></div>
  <div id="hud">
    <div id="wood-pill" class="pill">🪵 <span id="wood">0</span></div>
    <div id="meat-pill" class="pill hide">🍖 <span id="meat">0</span></div>
    <div id="ice-pill" class="pill hide">🧟 <span id="ice">0</span></div>
    <div id="money-pill" class="pill hide" style="color:#ffe27a"><img id="money-ico" alt="" style="width:22px;height:22px;vertical-align:-5px;margin-right:3px"><span id="money">0</span></div>
    <div id="bld-pill" class="pill">🏠 <span id="bld">0</span></div>
    <div id="pop-pill" class="pill hide">👥 <span id="pop">0</span></div>
    <div id="kill-pill" class="pill hide">⚔️ <span id="kills">0</span></div>
  </div>
  <div id="toast"></div>
  <div id="combo"></div>
  <div id="hint">なぞって移動(PCは WASD・矢印キー)</div>
  <div id="arrow">➤</div>
  <div id="version"></div>
  <div id="debug"></div>
  <div id="error"></div>
  <div id="dog-label">🐶 たすけて!</div>
  <div id="over"><div class="card">
    <div class="go">GAME OVER</div>
    <button id="over-retry" type="button">最初から</button>
  </div></div>
  <div id="timer">⏱ 0:00 / 10:00</div>
  <div id="fade"></div>
  <div id="clear"><div class="card">
    <div class="cl">CLEAR</div>
    <div class="sub">朝が来た</div>
    <button id="clear-retry" type="button">最初から</button>
  </div></div>

<script type="module">
  import * as THREE from '../vendor/three.module.min.js';

  // ================================================================
  //  設定(テンポ・気持ちよさの数字)
  // ================================================================
  const GAME_VERSION = '2026.12.01-s37';
  const FX = { shake: 1, particles: 1, volume: 1 };            // 演出の強さ(重いときは粒が自動で減る)
  const PLAYER_CFG = { speed: 9.5, accel: 16, radius: 0.4, reach: 1.35 };
  const MAGNET = { radius: 7.5, settle: 0.38, gap: 0.03, minGap: 0.008 }; // 吸い寄せ: 範囲・地面で止まる時間・1個ずつの間隔
  const STACK = {                                             // 背中の積荷(段ごとに向きを変えて井桁に積む)
    wood: { per: 3, gap: 0.29, layerH: 0.27, max: 150 },
    meat: { per: 2, gap: 0.36, layerH: 0.31, max: 100 },
    ice: { per: 2, gap: 0.5, layerH: 0.48, max: 90 },   // 凍ったゾンビ(氷ブロック)
    cash: { per: 2, gap: 0.32, layerH: 0.17, max: 160 }, // 札束(1つ 💰10)
  };
  const TAKE_MAX = { wood: 120, ice: 60 }; // 置き場から1回に取れる数(背中が空のまま乗ったとき)
  const DELIVER = { gap: 0.07, minGap: 0.016, speedUp: 0.92, flight: 0.3 }; // 納品: 最初の間隔・最短・だんだん速く・飛ぶ時間
  const WORLD = { x1: -30, x2: 46, z1: -46, z2: 30 }; // 研究所のために東と北へ広げた
  // まわりを回る斧(シナリオの 'axes' で本数・半径・速さが増える)。hitR = 斧の当たりの大きさ、cd = 同じ相手に続けて当たる間隔
  const AXES = { kind: 'axe', n: 2, radius: 1.6, speed: 1.6, hitR: 0.45, cd: 0.09 };
  const TREE_FALL = 0.28;
  // 武器パワーアップ(お金で払う)。払うたびに次のレベルへ
  // 斧 2本 → 3 → 4 → 5本 → 剣(リーチが長い) → トゲ鉄球(鎖の先) → ロケットランチャー
  const WEAPON_LEVELS = [
    { cost: 200, kind: 'axe', icon: '🪓', label: '斧が3本に', n: 3, radius: 1.9, speed: 1.9, hitR: 0.45 },
    { cost: 400, kind: 'axe', icon: '🪓', label: '斧が4本に', n: 4, radius: 2.2, speed: 2.1, hitR: 0.45 },
    { cost: 800, kind: 'axe', icon: '🪓', label: '斧が5本に', n: 5, radius: 2.5, speed: 2.3, hitR: 0.45 },
    { cost: 1500, kind: 'sword', icon: '🗡️', label: '剣に進化! リーチがのびた', n: 4, radius: 3.2, speed: 2.0, hitR: 0.6 },
    { cost: 2500, kind: 'flail', icon: '⛓️', label: 'トゲ鉄球に進化!', n: 2, radius: 3.9, speed: 1.45, hitR: 1.0 },
    { cost: 4000, kind: 'rocket', icon: '🚀', label: 'ロケットランチャー!', n: 0, radius: 1, speed: 1, hitR: 0.45 },
  ];
  // ロケットランチャー: range 以内のゾンビ(いなければ木)へ every 秒ごとに発射。爆発の半径 blast
  const ROCKET = { range: 12, treeRange: 8, every: 0.2, blast: 2.6, speed: 26 };
  const CAM_YAW = Math.PI / 4;                                 // カメラは斜め45度から(四角いキャンプがひし形に見える)
  // ゾンビ(シナリオの 'zombies' で出し始める)。森の奥(画面の奥側)から群れで歩いてくる
  // 10分(遊び始めてから)で大群の夜。?night=秒 で変えられる(テスト用)
  const NIGHT = { at: +((location.search.match(/[?&]night=(\d+)/) || [0, 600])[1]), dusk: 120, fight: 45, lose: 30, breakAt: 20 };
  const night = { phase: 'day', t: 0, k: 0, kT: 0, win: false, said: {}, cheer: false };
  const ZOMBIES = { safe: 6, front: 0.45, drop: { ice: 1 }, on: false, interval: 2.6, group: [3, 5], max: 70, speed: [1.3, 2.1], hp: 1, from: -Math.PI * 3 / 4, spread: 2.4, dist: [19, 27] }; // dist = 拠点の中心からの距離                                      // 木が倒れきるまでの秒数
  // 川(最初から東の森の向こうに流れている)。(x0,z0)→(x1,z1) の線に幅 w
  const RIVER = { x0: 17.2, z0: -47, x1: 26, z1: 31, w: 3.6 };
  function riverDist(x, z) {
    const { x0, z0, x1, z1 } = RIVER, vx = x1 - x0, vz = z1 - z0, t = clamp(((x - x0) * vx + (z - z0) * vz) / (vx * vx + vz * vz), 0, 1);
    return Math.hypot(x - (x0 + vx * t), z - (z0 + vz * t));
  }
  // 水: くみ上げの速さ・貯水槽の容量。畑: 1つの作物が育つ秒数・使う水。研究所: 人間1人に使う頭と炭・何秒ごと
  const WATER = { rate: 2.5, cap: 200 };
  const FARM = { grow: 9, water: 0.35, cap: 54 };
  const TOWN = { bakeryEvery: 3, breadCap: 40, breadHunger: 2.5, marketEvery: 6, marketPer: 3, houseMax: 60 };
  const LAB = { heads: 4, coal: 2, every: 7, max: 40, startHeads: 420, startCoal: 250 };
  const HUMAN = { speed: 3.2, notice: 10, hp: 1.2, hunger: 28, starve: 7 };
  const ZOOM_BASE = 12;
  const DOG_NOTICE = 12; // ゾンビがワンコに気づく距離(キャラクターより6以上遠くなければ、ワンコを追う)
  const DOG_FLEE = 1.9; // ワンコがゾンビから逃げる速さ(ゾンビは 1.3〜2.1) // カメラの距離(オーナーの希望で 14 から寄せた)
  const RES_ICON = { wood: '🪵', meat: '🍖', ice: '🧟', cash: '💵', coal: '⚫' };

  // エリア(rect = x1, z1, x2, z2)。開くまで中に入れない。edges = 雪の吹きだまりの柵を置く線
  const AREAS = {}; // 今はエリアの区切りなし(森の中の空き地から始まる)

  // ================================================================
  //  シナリオ(データだけで、木の本数・資材の数・建物・演出の順番を変えられる)
  //   after: このシーンが終わったら始まる / delay: その何秒後
  //   enter: 始まったときの出来事 / goal: 完了条件 / exit: 終わったときの出来事
  //   goal.type: 'clear' = tag の対象を全部倒して、資材を全部拾った / 'gather' = このシーンが始まってから res を count 個拾った / 'build' = 建築エリアの建物が全部建った / 'none' = 終わらない
  // ================================================================
  const SCENARIO = [
    { id: 'scene_01', title: '森の空き地で伐採', after: null,
      enter: [
        // 森いっぱいに木を置く(まん中の空き地はあける)。見える木は全部切れる
        { do: 'scatter', what: 'tree', tag: 'wild', hits: 2, drops: { wood: 8 }, spacing: 2.25, avoid: [[-13.8, -13.8, 13.8, 13.8]], avoidCircles: [[0, 0, 15.6]], river: true, tries: 16000 },
        // おまけ: 森の奥でワンコがふるえている。ゾンビから守って、キャンプで保護すると…
        { do: 'dog', delay: 4 },
        { do: 'toast', text: '🐶 空き地にワンコが…! ゾンビから守ってあげて', delay: 5.5 },
        { do: 'zombies', on: true, first: 9, delay: 0.5 },
        { do: 'toast', text: '🧟 森の奥からゾンビが…! 急いでキャンプを作ろう!', delay: 1.2 },
        { do: 'axes', n: 2, radius: 1.6, speed: 1.6, quiet: true },
        { do: 'zoom', level: 1.1 },
      ],
      goal: { type: 'gather', res: 'wood', count: 6 } },
    { id: 'scene_02', title: 'キャンプ場の立ち上げ', after: 'scene_01',
      enter: [{ do: 'site', id: 'camp', title: '⛺ キャンプ場をつくる', icon: '⛺', at: [0, 0], res: 'wood', need: 40, build: ['fence', 'hut'], delays: [0.1, 2.8] }],
      goal: { type: 'build', site: 'camp' },
      exit: [
        { do: 'toast', text: '🎉 キャンプ場ができた!' },
        { do: 'zoom', level: 1.65 },
      ] },
    { id: 'scene_03', title: 'キャンプファイアー', after: 'scene_02', delay: 1.2,
      enter: [{ do: 'site', id: 'bonfire', title: '🔥 キャンプファイアーをつくる', icon: '🔥', at: [3.6, 0.2], res: 'wood', need: 60, build: ['bonfire'] }],
      goal: { type: 'build', site: 'bonfire' },
      exit: [{ do: 'toast', text: '🔥 立派なキャンプファイアーができた!' }] },
    { id: 'scene_04', title: '出荷ヘリポート', after: 'scene_03', delay: 1.2,
      enter: [
        { do: 'site', id: 'heli', title: '🚁 出荷ヘリポートをつくる', icon: '🚁', at: [5.2, -2.4], res: 'wood', need: 50, build: ['helipad'] },
      ],
      goal: { type: 'build', site: 'heli' },
      exit: [
        // 木材置き場: 木の床に乗ると、背中の薪がどんどん積まれる
        { do: 'storage', id: 'woodpad', kind: 'deposit', icon: '🪵', res: 'wood', yard: 'wood', grid: { cols: 3, rows: 7, layers: 12, cx: 0.66, cz: 0.29, h: 0.27, y0: 0.45 }, delay: 0.7 },
        // ヘリポートができたら、アップデートエリアが全部開く(どれから建ててもいい。見張り台だけ薪、ほかはお金)
        { do: 'site', id: 'tower', icon: '🗼', at: [8.3, 8.3], res: 'wood', need: 80, build: ['tower'], delay: 1.6,
          onBuilt: [{ do: 'toast', text: '🗼 見張り台ができた! 近くのゾンビを自動で撃つ' }] },
        { do: 'site', id: 'vacuum', icon: '🌀', at: [8.3, 3.9], res: 'cash', need: 60, build: ['vacuum'], delay: 1.8,
          onBuilt: [{ do: 'toast', text: '🌀 バキューマー完成! 散らばったゾンビの頭を吸いこんで置き場へ' }] },
        { do: 'site', id: 'kiln', icon: '🏭', at: [-6.8, 1.4], res: 'cash', need: 50, build: ['kiln'], delay: 2.0,
          onBuilt: [
            // 炭置き場(窯の前)。木材置き場の薪が3本ずつコンベアで窯へ → 炭1個。炭はヘリが高く買う
            { do: 'storage', id: 'coalpad', kind: 'deposit', icon: '⚫', res: 'coal', yard: 'coal', grid: { cols: 4, rows: 4, layers: 6, cx: 0.5, cz: 0.5, h: 0.44, y0: 0.52 } },
            { do: 'kilnline', kiln: 'kiln', from: 'woodpad', to: 'coalpad' },
            { do: 'toast', text: '🏭 炭焼き窯ができた! 薪が自動で炭になる(ヘリが高く買う)' },
          ] },
        { do: 'site', id: 'plant', icon: '⚡', at: [-2.8, -5.0], res: 'cash', need: 150, build: ['plant'], camera: [3, -16], delay: 2.2,
          onBuilt: [
            { do: 'power', from: 'plant', lamps: [[3.2, -10.2], [10.0, -5.6], [9.6, 5.0], [2.6, 9.6], [-2.6, 9.6], [-6.4, 9.6], [-9.6, 4.6], [-9.6, -9.6]] },
            { do: 'toast', text: '⚡ ゾンビ発電所が動き出した! 拠点に電気が通った' },
          ] },
        { do: 'upgrade', id: 'weapon', icon: '⚔️', at: [-3.0, 7.6], res: 'cash', levels: WEAPON_LEVELS, delay: 2.4 },
        // ガトリングは電気(発電所)と見張り台ができてから
        { do: 'site', id: 'gatling', icon: '🔫', at: [5.0, 8.4], res: 'cash', need: 80, build: ['gatling'], requires: ['plant', 'tower'],
          announce: '🔫 電気が来た! 見張り台にガトリングを積めるようになった',
          onBuilt: [{ do: 'toast', text: '🔫 ガトリング設置! 柵に来たゾンビをなぎ倒す' }] },
        // 電動木こりマシン(発電所ができてから)。勝手に森へ行って木を切り、木材置き場まで運ぶ

  const arrows = [];
  function updateTowers(dt) {

  // 範囲いっぱいに、間をあけて木などを置く(avoid の四角はあける)
  function scatter(a) {
    const sp = a.spacing || 2.3, cells = new Map(), key = (x, z) => Math.floor(x / sp) + ',' + Math.floor(z / sp);

  // ================================================================

  const stick = { active: false, id: null, ox: 0, oy: 0, dx: 0, dy: 0 };

  let bot = false;
  function readInput() {

  const botMem = { x: 0, z: 0, t: 0, side: 0 };

    let g = guideTarget();
    if (!g) return { ix: 0, iz: 0 };
    let tx = g.x, tz = g.z;
    // 柵の中と外を行き来するときは、扉を通る
    for (const f of fences) {
      if (!f.gateLanded) continue;
      const inside = (x, z) => (Math.abs(x - f.x) < f.H && Math.abs(z - f.z) < f.H) || inAnnex(x, z);
      const pin = inside(player.x, player.z), tin = inside(tx, tz);

    if (rings.mesh.instanceColor) rings.mesh.instanceColor.needsUpdate = true;
    // 広場が広がる
    plazaShown += (plazaR - plazaShown) * Math.min(1, dt * 1.5);
    plaza.scale.set(plazaShown, plazaShown, 1);
    // 夕暮れと窓の明かり
    dusk += (duskTarget - dusk) * Math.min(1, dt * 0.5);
    lightsOn += (lightsTarget - lightsOn) * Math.min(1, dt * 1.5);
    scene.background.copy(SKY_DAY).lerp(SKY_DUSK, dusk * 0.8);
    scene.fog.color.copy(scene.background);
    hemi.intensity = 1.9 - dusk * 0.55;
    sun.color.setRGB(1, 0.96 - dusk * 0.18, 0.9 - dusk * 0.3);
    night.k += (night.kT - night.k) * Math.min(1, dt * 0.6);
    if (night.k > 0.002) { scene.background.lerp(SKY_NIGHT, night.k * 0.92); scene.fog.color.copy(scene.background); hemi.intensity *= 1 - night.k * 0.72; hemi.color.setRGB(1 - night.k * 0.35, 1 - night.k * 0.25, 1); }
    else hemi.color.setRGB(0.957, 0.973, 1);
    sun.intensity = 1.5 * (1 - night.k * 0.82);
    windowMat.emissive.setRGB(1.0 * lightsOn, 0.72 * lightsOn, 0.28 * lightsOn);
    windowMat.color.setRGB(0.35 + lightsOn * 0.65, 0.47 + lightsOn * 0.45, 0.58 - lightsOn * 0.1);
  }
  function updateSnow(dt) {
    for (let i = 0; i < FLAKES; i++) {
      const f = flakes[i];
      f.y -= dt * f.s; f.x += Math.sin(gt + f.ph) * dt * 0.3;
      if (f.y < 0) { f.y = 14; f.x = (Math.random() - 0.5) * 44; f.z = (Math.random() - 0.5) * 34; }
      setInst(flakeMesh, i, cam.x + f.x, f.y, cam.z + f.z - 4, 1, 1, 1, f.ph);
    }
    flakeMesh.instanceMatrix.needsUpdate = true;
  }

  // ================================================================
  //  メインループ
  // ================================================================
  // ゲームオーバー(拠点の中に入りこんだゾンビにつかまったとき)
  let gameOver = false, godMode = false;
  function showGameOver(title, sub) {
    gameOver = true;

    shake(0.6); SND.boom(); if (!fastForwarding) tone(220, 0.8, 'sawtooth', 0.08, 0.4);
    $('over').classList.add('show');
  }
  $('over-retry').addEventListener('click', () => location.reload());
  $('clear-retry').addEventListener('click', () => location.reload());
  function logic(dt) {
    if (gameOver) return;
    gt += dt;
    if (started) elapsed += dt;
    sfxTick(dt);
    for (let i = timers.length - 1; i >= 0; i--) if (gt >= timers[i].at) { const t = timers[i]; timers.splice(i, 1); safe('timer', t.fn); }
    safe('scenario', updateScenario);
    safe('supply', () => ensureSupply(dt));
    safe('player', () => { if (!giantBusy()) updatePlayer(dt); });
    safe('axes', () => { if (giantBusy()) { axeInst.count = axeGhost.count = chainMesh.count = 0; axeTrail.visible = launcher.visible = false; } else updateAxes(dt); });
    safe('zombies', () => updateZombies(dt));
    safe('targets', () => updateTargets(dt));
    safe('drops', () => updateDrops(dt));
    safe('stacks', () => updateStacks(dt));
    safe('sites', () => updateSites(dt));
    safe('build', () => { updateConstructions(dt); updateBuildings(dt); updateFences(dt); updateBonfires(dt); updateHelis(dt); updateVacuums(dt); updateYards(dt); updateTowers(dt); updateKilns(dt); updatePlants(dt); updateLamps(dt); updateGatlings(dt); updateLumbers(dt); updateWater(dt); updateFarms(dt); updateTrap(dt); updateTown(dt); updateLabs(dt); updateHumans(dt); updateCorridors(dt); updateIgloos(dt); updateTraining(dt); });
    safe('night', () => updateNight(dt));
    safe('stumps', () => refreshStumps(dt));
    safe('dog', () => { updateDog(dt); updateGiant(dt); });
    safe('villagers', () => updateVillagers(dt));
    safe('areas', () => updateAreas(dt));
    safe('fx', () => updateFx(dt));
  }
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    logic(dt);
    safe('camera', () => updateCamera(dt));
    safe('snow', () => updateSnow(dt));
    safe('hud', () => { updateHud(dt); updateGuide(); });
    safe('render', () => renderer.render(scene, camera));
    adaptQuality(now);
  }
  // 重いとき(1秒に40コマ未満)は、画面の細かさと粒の量を下げる
  let qFrames = 0, qStart = performance.now(), pixelRatio = renderer.getPixelRatio();
  const NO_ADAPT = /[?&]noadapt/.test(location.search);
  function adaptQuality(now) {
    if (NO_ADAPT) return;
    qFrames++;
    const el = now - qStart;
    if (el < 2500) return;
    const fps = qFrames / (el / 1000);
    qFrames = 0; qStart = now;
    if (document.hidden) return;
    if (fps < 40) {
      if (pixelRatio > 1) { pixelRatio = Math.max(1, pixelRatio - 0.25); renderer.setPixelRatio(pixelRatio); resize(); }
      else FX.particles = Math.max(0.3, FX.particles - 0.2);
    }
  }
  document.addEventListener('visibilitychange', () => { last = performance.now(); qStart = last; qFrames = 0; });
  renderer.domElement.addEventListener('webglcontextlost', (e) => { e.preventDefault(); $('hint').textContent = '画面が止まりました。ページを再読み込みしてください'; $('hint').style.opacity = 1; });
  updateCamera(1);
  requestAnimationFrame(frame);

  // 自動テスト・デバッグ用(URL に ?debug を付けると、右上に進み具合が出る)
  window.__renderer = renderer;
  window.__game = {
    get state() {
      return { gt, elapsed, carried: { ...carried }, scenes: SCN.log.map(l => ({ ...l })), active: SCN.active.map(s => s.id), buildings: Object.keys(built).filter(k => built[k].done),
        villagers: villagers.length, targets: targets.filter(t => !t.gone).map(t => t.type + ':' + t.tag), drops: drops.wood.items.length + drops.meat.items.length,
        sites: Object.fromEntries(Object.values(sites).map(s => [s.id, s.paid + '/' + s.need + (s.done ? ' done' : s.building ? ' building' : '')])),
        unlocked: Object.keys(unlocked), over: gameOver, axesOff, workers: plants[0] ? plants[0].workers.length : 0, vacuumed: vacuums[0] ? vacuums[0].total : null, lampsLit: lamps.filter(l => l.lit).length, gatling: gatlings.length, coalStock: sites.coalpad ? sites.coalpad.stock : null, woodStock: sites.woodpad ? sites.woodpad.stock : null, money: carried.cash * CASH_UNIT, iceStock: sites.icepad ? sites.icepad.stock : null, cashStock: sites.cashpad ? sites.cashpad.stock : null, heli: helis[0] ? helis[0].state : null, zombies: zs.length, zKills, door: fences[0] ? +fences[0].doorOpen.toFixed(2) : null, errors: errorsSeen.slice(), x: player.x, z: player.z, calls: renderer.info.render.calls, fx: FX.particles };
    },
    bot(on) { bot = on; },
    fastForward(sec, step = 1 / 30) { fastForwarding = true; try { for (let t = 0; t < sec; t += step) logic(step); } finally { fastForwarding = false; } return this.state; },
    teleport(x, z) { player.x = x; player.z = z; },
    god(on) { godMode = on; },
    giveCash(n) { carried.cash += n; },
    giveWood(n) { carried.wood += n; },
    giveIce(n) { carried.ice += n; },
    kiln() { return kilnLines.map(L => ({ items: L.items.length, fuel: L.fuel, burnT: L.burnT, from: L.from.stock, to: L.to.stock, inc: L.to.incoming, cap: L.to.cap })); },
    weapon() { return { kind: AXES.kind, n: AXES.n, radius: AXES.radius, level: sites.weapon ? sites.weapon.level : 0, rockets: rockets.length }; },
    dog() { return dog ? { st: dog.st, hp: +dog.hp.toFixed(2), x: dog.x, z: dog.z } : null; },
    sitePos(id) { const st = sites[id]; return st ? [st.x, st.z] : null; },
    humans() { return humans.map(h => ({ st: h.st, x: h.x, z: h.z })); },
    zInBox(x1, z1, x2, z2) { return zs.filter(zb => !zb.dead && zb.x > x1 && zb.x < x2 && zb.z > z1 && zb.z < z2).length; },
    trap() { return trap ? { st: trap.st, cool: +trap.cool.toFixed(1), inPit: trapCount() } : null; },
    addVillagers(n) { const C = campInfo(); for (let i = 0; i < n; i++) humans.push({ x: C.x + (Math.random() - 0.5) * 8, z: C.z + (Math.random() - 0.5) * 8, st: 'villager', hp: 1, t: 0, face: 0, tint: HUMAN_TINTS[i % HUMAN_TINTS.length], hunger: HUMAN.hunger, starve: 0, wander: null, wanderT: 0, ph: Math.random() * 6 }); return villagerCount(); },
    town() { return { villagers: villagerCount(), jobs: town.jobs.map(j => j.label + (j.h ? (j.h.atJob ? '✓' : '…') : '×')), bread: town.bakery ? town.bakery.bread : null, max: LAB.max }; },
    igloos() { return { annex: annex.done, igloos: igloos.map(ig => ig.n + '/' + ig.pts.length + (ig.done ? '✓' : '')), max: LAB.max }; },
    night() { return { phase: night.phase, t: +night.t.toFixed(1), win: night.win, elapsed: Math.round(elapsed), corpses: corpseN, soldiers: humans.filter(h => h.soldier).length, posts: humans.filter(h => h.post).length, unlocked: allUnlocked(), missing: missingSites() }; },
    skipTime(sec) { started = true; elapsed += sec; },
    village() { return { water: waterSys ? Math.round(waterSys.water) : null, food: farm ? farm.food : null, lab: labs[0] ? { heads: labs[0].nHeads, coal: labs[0].nCoal, made: labs[0].made } : null, humans: humans.map(h => h.st), corridor: extraWalls.length > 0 }; },
    killDog() { if (dog && dog.st !== 'dead') { dog.st = 'lost'; dog.hp = 0.001; dogBite(0.01); } return this.dog(); },
    rescueDog() { if (dog && dog.st === 'lost') { dog.x = player.x - 1; dog.z = player.z; } return this.dog(); },
    lumber() { const L = lumbers[0]; return L ? { st: L.st, load: L.load, total: L.total, x: +L.x.toFixed(1), z: +L.z.toFixed(1) } : null; },
    giant() { return giant ? { phase: giant.phase, x: giant.x, z: giant.z } : null; },
    camp() { return campInfo(); },
    setWeapon(i) { const lv = WEAPON_LEVELS[i]; if (lv) setAxes(lv); return AXES.kind; },
    debugDrops() { const out = {}; for (const k in drops) for (const it of drops[k].items) { const key = k + ':' + it.st; out[key] = (out[key] || 0) + 1; } return { out, guide: (() => { const g = guideTarget(); return g && { kind: g.kind, x: g.x, z: g.z }; })(), meatLeft: dropsLeft, sample: drops.meat.items.slice(0, 3).map(i => [i.st, i.x.toFixed(1), i.y.toFixed(2), i.z.toFixed(1)]) }; },
  };
</script>
