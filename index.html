<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="雪のキャンプ">
<meta name="theme-color" content="#cfe3f2">
<title>雪のキャンプ</title>
<style>
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: #cfe3f2; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  .stick {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    display: none;
    transform: translate(-50%, -50%);
  }
  #stick-base { width: 112px; height: 112px; background: rgba(255, 255, 255, .3); border: 3px solid rgba(255, 255, 255, .7); }
  #stick-knob { width: 52px; height: 52px; background: rgba(255, 255, 255, .95); box-shadow: 0 2px 6px rgba(0, 0, 0, .25); }
  #hint {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom) + 40px);
    text-align: center;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    text-shadow: 0 2px 4px rgba(0, 0, 0, .5);
    pointer-events: none;
    transition: opacity .6s;
  }
  #hud {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 12px);
    left: 12px; right: 12px;
    display: flex;
    gap: 10px;
    align-items: center;
    pointer-events: none;
  }
  .pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(40, 30, 25, .55);
    color: #fff;
    font-size: 17px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  #fire-pill { flex: 1; }
  #fire-bar { flex: 1; height: 12px; border-radius: 6px; background: rgba(255, 255, 255, .25); overflow: hidden; }
  #fire-fill { height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, #ffb02e, #ff5a1f); transition: width .15s; }
  #toast {
    position: fixed;
    left: 0; right: 0;
    top: calc(env(safe-area-inset-top) + 72px);
    text-align: center;
    color: #fff;
    font-size: 24px;
    font-weight: 900;
    text-shadow: 0 2px 0 #c2410c, 0 4px 8px rgba(0, 0, 0, .35);
    pointer-events: none;
    opacity: 0;
    transform: scale(.8);
    transition: opacity .25s, transform .25s;
  }
  #toast.show { opacity: 1; transform: scale(1); }
  .warm-bar {
    position: fixed;
    width: 40px; height: 7px;
    margin-left: -20px;
    border-radius: 4px;
    background: rgba(30, 50, 80, .55);
    overflow: hidden;
    pointer-events: none;
  }
  .warm-bar div { height: 100%; width: 0; background: linear-gradient(90deg, #7cc8ff, #ffb02e); }
  #version {
    position: fixed;
    right: 8px;
    bottom: calc(env(safe-area-inset-bottom) + 6px);
    color: rgba(60, 70, 90, .55);
    font-size: 11px;
    pointer-events: none;
  }
  #reset {
    position: fixed;
    left: 8px;
    bottom: calc(env(safe-area-inset-bottom) + 4px);
    padding: 3px 8px;
    border: 0;
    border-radius: 6px;
    background: rgba(60, 70, 90, .25);
    color: rgba(40, 50, 70, .7);
    font: inherit;
    font-size: 11px;
  }
  #error {
    position: fixed;
    left: 8px; right: 8px;
    bottom: calc(env(safe-area-inset-bottom) + 90px);
    padding: 8px 10px;
    border-radius: 8px;
    background: rgba(180, 30, 30, .9);
    color: #fff;
    font-size: 12px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-all;
    display: none;
    pointer-events: none;
  }
  .pile-label {
    position: fixed;
    transform: translate(-50%, -100%);
    padding: 2px 10px;
    border-radius: 10px;
    background: rgba(40, 30, 25, .6);
    color: #ffd76a;
    font-size: 16px;
    font-weight: 900;
    pointer-events: none;
    display: none;
  }
  #max {
    position: fixed;
    transform: translate(-50%, -100%);
    padding: 2px 10px;
    border-radius: 8px;
    background: #ff5a1f;
    color: #fff;
    font-size: 15px;
    font-weight: 900;
    pointer-events: none;
    display: none;
  }
</style>
</head>
<body>
  <div id="stick-base" class="stick"></div>
  <div id="stick-knob" class="stick"></div>
  <div id="hud">
    <div id="fire-pill" class="pill">🔥<div id="fire-bar"><div id="fire-fill"></div></div></div>
    <div class="pill">🪵 <span id="carry">0/12</span></div>
    <div class="pill">💰 <span id="money">0</span></div>
  </div>
  <div id="toast"></div>
  <div id="bars"></div>
  <div id="max">MAX</div>
  <div id="hint">画面をなぞって歩こう</div>
  <div id="version"></div>
  <button id="reset" type="button">はじめから</button>
  <div id="error"></div>

<script type="module">
  import * as THREE from './vendor/three.module.min.js';

  // ================================================================
  //  設定(ここの数字を変えると、遊びやすさを調整できます)
  // ================================================================
  const PX = 7, PZ = 9;          // 最初のキャンプ(柵の内側)の半分の広さ
  const camp = { x1: -PX, x2: PX, z1: -PZ, z2: PZ }; // 今の柵の内側の範囲(拡張すると広がる)
  const EXPAND_COST = 80;        // キャンプ拡張の値段
  const EXPAND_X2 = 13;          // 拡張したあとの、キャンプの右端
  const SPEED = 6.5;             // 主人公の歩く速さ(単位/秒)
  const STICK_RADIUS = 56;       // バーチャルスティックの半径(px)
  const PLAYER_R = 0.4;          // 当たり判定の半径

  const CARRY_START = 12;        // 最初に運べる薪の本数
  const CARRY_UPGRADED = 24;     // リュック拡張後に運べる本数
  // 道具のレベル: 1〜4 は斧、5 はチェーンソー
  const AXE_INTERVALS = [0.34, 0.28, 0.22, 0.17, 0.1]; // レベルごとの、1回切る時間(秒)
  const AXE_LOGS = [2, 2, 3, 3, 2];                    // レベルごとの、1回でとれる薪の数
  const HELPER_AXE_LOGS = [1, 1, 2, 2, 2];             // 仲間が1回でとれる薪の数
  const CHAINSAW_LEVEL = 5;
  const TREE_LOGS = 8;           // 木1本からとれる薪の数
  const WOOD_PILE_MAX = 30;      // 焚き火の横の薪置き場に、見た目として積む本数の上限
  const FEED_INTERVAL = 0.3;     // 薪置き場から焚き火へ、1本くべる間隔(秒)
  const COIN_COLUMNS = 4;        // お金置き場の硬貨の柱の数
  const COIN_PILE_MAX = 160;     // お金置き場に、見た目として積む枚数の上限(柱1本あたり40枚)
  const TREE_REGROW = 10;        // 切った木が生え直すまでの時間(秒)
  const BRANCH_COUNT = 14;       // 柵の外に落ちている枝の数
  const BRANCH_RESPAWN = 3;      // 拾った枝が、別の場所にまた落ちるまでの時間(秒)
  const WORLD = 30;              // 歩ける範囲(柵の外も含む)の半分の広さ
  const DROP_INTERVAL = 0.06;    // 薪を焚き火に1本入れる間隔(秒)
  const FLY_TIME = 0.22;         // 薪やお金が飛んでいく時間(秒)

  const HEAT_START = 35;         // 最初の火の強さ(0〜100)
  const HEAT_PER_LOG = 4;        // 薪1本で増える火の強さ
  const HEAT_DECAY = 1.0;        // 火が弱まる速さ(1秒あたり)
  const HEAT_DECAY_PER_GUEST = 0.3; // 温まっている人1人あたり、さらに弱まる速さ

  const WARM_RATE = 0.22;        // 人が温まる速さ
  const COINS_PER_GUEST = 5;     // 温まった人が置いていくお金
  const GUEST_INTERVAL = 2.4;    // 人がやってくる間隔(秒)
  const GUEST_INTERVAL_TENT = 1.3; // テント解放後の間隔(秒)
  const GUEST_SPEED = 3;         // 人の歩く速さ
  const HELPER_SPEED = 4.2;      // 仲間の歩く速さ
  const HELPER_CARRY = 5;        // 仲間が一度に運ぶ本数
  const HELPER_CHOP_INTERVAL = 0.45; // 仲間が斧を1回振る時間(秒)

  // お金を払って解放するもの(枠ごとに、上から順に出てきます)
  const CAMP_UPGRADES = [
    { icon: '🎒', label: 'リュック', cost: 15, message: 'リュックが大きくなった!', apply: () => { player.carrier.max = CARRY_UPGRADED; } },
    { icon: '🔥', label: '火の番', cost: 20, message: '火の番が来た! 薪を自動でくべてくれるよ', apply: () => hireFireKeeper(fires[0]) },
    { icon: '🛎️', label: '受付係', cost: 30, message: '受付係が来た! お金を自動で受け取ってくれるよ', apply: () => hireReceptionist() },
    { icon: '👷', label: '木こり', cost: 40, message: '木こりの仲間が来た!', apply: () => spawnHelper() },
    { icon: '⛺', label: 'テント', cost: 60, message: 'テントができた! 泊まるお客さんは宿泊代も払うよ', apply: () => openTent() },
  ];
  const TENT_FEE = 8;            // テントに泊まったお客さんが上乗せして払うお金
  const TENT_BEDS = 2;           // テントに同時に泊まれる人数
  const SLEEP_TIME = 6;          // テントで休む時間(秒)
  const SAVE_KEY = 'snow-camp-save-v1'; // 進み具合を保存する名前
  // 狩り: 道具はパチンコ → 弓 → ボウガン
  const WEAPONS = [
    { name: 'パチンコ', range: 5.0, cool: 0.7, dmg: 1, kind: 'stone' },
    { name: '弓', range: 6.5, cool: 0.55, dmg: 2, kind: 'arrow' },
    { name: 'ボウガン', range: 8.0, cool: 0.4, dmg: 3, kind: 'bolt' },
  ];
  const BOAR_COUNT = 5;          // 狩り場にいるイノシシの数
  const BOAR_SIZE = 1.3;         // イノシシの大きさ
  const BOAR_HP = 4;             // イノシシの体力
  const BOAR_MEAT = 2;           // 1頭からとれる肉の数
  const BOAR_RESPAWN = 6;        // 倒したイノシシがまた現れるまでの時間(秒)
  const COOK_TIME = 3;           // 肉が焼けるまでの時間(秒)
  const MEAT_PRICE = 6;          // 焼いた肉をお客さんに渡したときにもらえるお金
  const MEAT_WANT_RATE = 0.5;    // 肉をほしがるお客さんの割合
  const HUNT_UPGRADES = [
    { icon: '🏹', label: '弓', cost: 50, message: '弓を手に入れた! 遠くから強く撃てる', apply: () => setWeapon(2) },
    { icon: '🐗', label: '猟師', cost: 90, message: '猟師が来た! 狩った肉を焼き台にのせてくれるよ', apply: () => hireHunter() },
    { icon: '🎯', label: 'ボウガン', cost: 140, message: 'ボウガンを手に入れた! もっと遠く、もっと強く', apply: () => setWeapon(3) },
    { icon: '🍽️', label: '配膳係', cost: 120, message: '配膳係が来た! 焼けた肉をお客さんに配ってくれるよ', apply: () => hireWaiter() },
  ];
  const AXE_UPGRADES = [
    { icon: '🪓', label: '斧 Lv2', cost: 20, message: '斧が軽くなった! 速く切れる', apply: () => setAxeLevel(2) },
    { icon: '🪓', label: '斧 Lv3', cost: 50, message: '金の斧! もっと速く切れる', apply: () => setAxeLevel(3) },
    { icon: '🪓', label: '斧 Lv4', cost: 100, message: '伝説の斧! もっともっと速く切れる', apply: () => setAxeLevel(4) },
    { icon: '🪚', label: 'チェーンソー', cost: 180, message: 'チェーンソーを手に入れた! ギュイーン!', apply: () => setAxeLevel(CHAINSAW_LEVEL) },
  ];

  const CAM_YAW = Math.PI / 4;   // カメラを45度回して、ステージを斜めに見せる
  const CAM_DIST = 24;           // カメラまでの水平距離
  const CAM_HEIGHT = 25;         // カメラの高さ
  const CAM_OFFSET = new THREE.Vector3(Math.sin(CAM_YAW) * CAM_DIST, CAM_HEIGHT, Math.cos(CAM_YAW) * CAM_DIST);
  // 画面の「右」と「下」が、ステージ上でどちら向きになるか
  const SCREEN_RIGHT = { x: Math.cos(CAM_YAW), z: -Math.sin(CAM_YAW) };
  const SCREEN_DOWN = { x: Math.sin(CAM_YAW), z: Math.cos(CAM_YAW) };

  const $ = (id) => document.getElementById(id);

  // 版の番号(変更を公開するたびに上げる)。iPhone で古い版のまま遊んでいないか確かめる用
  const GAME_VERSION = '2026.11.09-5';
  $('version').textContent = 'v' + GAME_VERSION;

  // エラーが起きたら画面に出す(iPhone ではエラーの内容が見えないため。スクショで原因がわかる)
  const errorsSeen = [];
  function reportError(where, err) {
    const text = where + ': ' + (err && err.message ? err.message : String(err));
    if (errorsSeen.includes(text)) return;
    errorsSeen.push(text);
    console.error(where, err);
    const box = $('error');
    const stack = err && err.stack ? '\n' + String(err.stack).split('\n').slice(0, 3).join('\n') : '';
    box.textContent = 'エラー(v' + GAME_VERSION + ') ' + text + stack;
    box.style.display = 'block';
  }
  window.addEventListener('error', (e) => reportError('window', e.error || e.message));
  window.addEventListener('unhandledrejection', (e) => reportError('promise', e.reason));
  const hint = $('hint');

  // ================================================================
  //  3Dの土台
  // ================================================================
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.prepend(renderer.domElement);

  const SKY = '#cfe3f2';
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(SKY);
  scene.fog = new THREE.Fog(SKY, 50, 85);

  const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 120);
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.fov = w < h ? 40 : 28; // 縦長の画面では少し広く見せる
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  scene.add(new THREE.HemisphereLight('#e6f1ff', '#b08a6a', 1.5));
  const sun = new THREE.DirectionalLight('#ffe6c4', 2.1);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -24, right: 24, top: 24, bottom: -24, near: 1, far: 80 });
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.03;
  scene.add(sun, sun.target);
  const SUN_OFFSET = new THREE.Vector3(-10, 22, 4);

  // ================================================================
  //  小さな道具
  // ================================================================
  let seed = 11; // 毎回同じ配置にするための種つき乱数
  function rand() {
    seed = (seed * 16807) % 2147483647;
    return (seed - 1) / 2147483646;
  }
  const mats = {};
  function mat(color, opts = {}) {
    const key = color + JSON.stringify(opts);
    return mats[key] || (mats[key] = new THREE.MeshStandardMaterial({ color, roughness: 0.85, ...opts }));
  }
  function mesh(geometry, material, x = 0, y = 0, z = 0, parent = scene) {
    const m = new THREE.Mesh(geometry, material);
    m.position.set(x, y, z);
    m.castShadow = true;
    m.receiveShadow = true;
    parent.add(m);
    return m;
  }
  function canvasTexture(size, draw) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    draw(c.getContext('2d'), size);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    return tex;
  }
  const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
  // 同じ形の物をまとめて描く(InstancedMesh)ときの計算用
  const _m4 = new THREE.Matrix4(), _local = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler();
  const _pos = new THREE.Vector3(), _scl = new THREE.Vector3();
  const flat = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);

  // ---- 当たり判定(丸と四角) ----
  const circles = [];
  const boxes = [];
  function pushOut(p, R) {
    for (const c of circles) {
      if (c.off) continue;
      const dx = p.x - c.x, dz = p.z - c.z;
      const d = Math.hypot(dx, dz), min = c.r + R;
      if (d < min && d > 1e-4) { p.x = c.x + dx / d * min; p.z = c.z + dz / d * min; }
    }
    for (const b of boxes) {
      if (b.off) continue;
      const cx = Math.max(b.x - b.hx, Math.min(b.x + b.hx, p.x));
      const cz = Math.max(b.z - b.hz, Math.min(b.z + b.hz, p.z));
      const dx = p.x - cx, dz = p.z - cz;
      const d = Math.hypot(dx, dz);
      if (d < R && d > 1e-4) { p.x = cx + dx / d * R; p.z = cz + dz / d * R; }
    }
  }
  function keepInWorld(p, R) {
    p.x = Math.max(-WORLD + R, Math.min(WORLD - R, p.x));
    p.z = Math.max(-WORLD + R, Math.min(WORLD - R, p.z));
  }
  // 広場の中は床が少し高い
  const insidePlaza = (x, z) => x > camp.x1 - 0.7 && x < camp.x2 + 0.7 && z > camp.z1 - 0.7 && z < camp.z2 + 0.7;
  const groundY = (x, z) => insidePlaza(x, z) ? 0.2 : 0;
  function followGround(p, dt) { p.y += (groundY(p.x, p.z) - p.y) * Math.min(1, dt * 15); }

  // ================================================================
  //  ステージ
  // ================================================================
  const snow = new THREE.Mesh(new THREE.PlaneGeometry(140, 140), mat('#eef4fb', { roughness: 1 }));
  snow.rotation.x = -Math.PI / 2;
  snow.receiveShadow = true;
  scene.add(snow);
  for (let i = 0; i < 40; i++) { // 雪のこんもり
    const x = (rand() * 2 - 1) * 30, z = (rand() * 2 - 1) * 30;
    if (Math.abs(x) < PX + 2 && Math.abs(z) < PZ + 2) continue;
    if (x < -PX && z > -3 && z < 6) continue; // 入口の外の道と受付のまわりはあけておく
    const s = 0.6 + rand() * 1.2;
    const m = mesh(new THREE.SphereGeometry(1, 12, 8), mat('#f7fbff', { roughness: 1 }), x, 0, z);
    m.scale.set(s * 1.4, s * 0.35, s);
    m.castShadow = false;
  }

  // キャンプの土の広場
  const dirtTex = canvasTexture(256, (g, n) => {
    g.fillStyle = '#d8a47a'; g.fillRect(0, 0, n, n);
    for (let i = 0; i < 260; i++) {
      g.fillStyle = rand() < 0.5 ? 'rgba(255,240,220,.18)' : 'rgba(150,90,50,.12)';
      g.beginPath();
      g.ellipse(rand() * n, rand() * n, 2 + rand() * 7, 1 + rand() * 4, rand() * 3, 0, Math.PI * 2);
      g.fill();
    }
  });
  dirtTex.wrapS = dirtTex.wrapT = THREE.RepeatWrapping;
  const plazaSide = mat('#a5704a');
  const plazaTop = new THREE.MeshStandardMaterial({ map: dirtTex, roughness: 0.95 });
  let plaza = null;
  function buildPlaza() {
    if (plaza) { scene.remove(plaza); plaza.geometry.dispose(); }
    const w = camp.x2 - camp.x1, d = camp.z2 - camp.z1;
    dirtTex.repeat.set(w / 5, d / 5);
    plaza = new THREE.Mesh(new THREE.BoxGeometry(w + 1.4, 0.2, d + 1.4), [plazaSide, plazaSide, plazaTop, plazaSide, plazaSide, plazaSide]);
    plaza.position.set((camp.x1 + camp.x2) / 2, 0.1, (camp.z1 + camp.z2) / 2);
    plaza.receiveShadow = true;
    scene.add(plaza);
  }
  buildPlaza();
  const FLOOR = 0.2; // 広場の床の高さ

  // 入口から外へ続く雪の道
  const path = mesh(new THREE.PlaneGeometry(18, 2.2), mat('#dfe8f2', { roughness: 1 }), -PX - 9.7, 0.01, 2.5);
  path.rotation.x = -Math.PI / 2;
  path.castShadow = false;

  // 丸太の柵(左側に入口のすき間をあける)
  const logSide = mat('#b9733f');
  const logTop = mat('#f1c890');
  const postGeo = new THREE.CylinderGeometry(0.28, 0.3, 1, 10);
  const GATE_Z = 2.5;
  const FX = PX + 0.35, FZ = PZ + 0.35, GAP = 0.58;
  const BACK_GATE_X = 4.0; // 奥の出入口(森へ行く道)
  const FRONT_GATE_X = -3.0; // 手前の出入口(狩り場へ行く道)

  function zoneCanvas(size, draw) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    const redraw = (...args) => {
      const g = c.getContext('2d');
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.clearRect(0, 0, size, size);
      draw(g, size, ...args);
      tex.needsUpdate = true;
    };
    return { tex, redraw };
  }
  function zoneFrame(g, n, fill) {

    g.lineWidth = 10;
    g.beginPath();
    g.roundRect(m, m, n - m * 2, n - m * 2, r);
    g.fill();
    g.stroke();
  }

    g.strokeStyle = 'rgba(60,35,20,.6)';

    g.restore();

    // 腕と足は付け根を軸にして振る

    function addLimb(parent, x, y, isLeg, side) {

    addLimb(root, -0.15, 0.36, true, -1);
    addLimb(root, 0.15, 0.36, true, 1);
    const leftArm = addLimb(body, -0.4, 0.82, false, -1);

    let axeHead = null, axeGroup = null, sawGroup = null;

  // 歩く・振る・ふるえる などの動き
  function animateCharacter(ch, dt, time) {
    const speed = Math.hypot(ch.vx, ch.vz);
    const moving = speed > 0.4;
    let target = null;
    if (moving) target = Math.atan2(ch.vx, ch.vz);
    else if (ch.face) target = Math.atan2(ch.face.x - ch.root.position.x, ch.face.z - ch.root.position.z);
    if (target !== null) {
      let diff = target - ch.angle;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      ch.angle += diff * Math.min(1, dt * 16);
    }
    ch.root.rotation.y = ch.angle;
    if (moving) ch.walk += speed * dt * 2.6;
    else ch.walk += (Math.round(ch.walk / Math.PI) * Math.PI - ch.walk) * Math.min(1, dt * 10);

    const amount = Math.min(1, speed / ch.speedRef);
    const swing = Math.sin(ch.walk);
    for (const l of ch.limbs) {
      l.pivot.rotation.x = swing * l.side * (l.isLeg ? 0.9 : -1.0) * amount;
      if (!l.isLeg) l.pivot.rotation.z = -l.side * 0.3;
    }
    // 斧を振る(振り上げてから、すばやく振り下ろす)
    if (ch.chop > 0) {
      ch.chop = Math.max(0, ch.chop - dt * 6);
      ch.rightArm.rotation.x = -2.4 * Math.sin(ch.chop * Math.PI * 0.5);
    }
    ch.hop = Math.max(0, ch.hop - dt);
    const hopY = ch.hop > 0 ? Math.abs(Math.sin(ch.hop * Math.PI * 4)) * 0.35 : 0;
    ch.body.position.y = (moving ? Math.abs(Math.cos(ch.walk)) * 0.08 * amount : Math.sin(time * 2.5) * 0.012) + hopY;
    ch.body.rotation.x = 0.1 * amount;
    ch.body.rotation.z = ch.shiver * Math.sin(time * 45) * 0.06;
    ch.head.rotation.z = Math.sin(ch.walk) * 0.06 * amount;

    // 斧を振る: 両手で頭の上まで振りかぶって(前半)、一気に振り下ろし(70%の時点で木に当たる)、戻す
    if (ch.swing && ch.tool === 'saw') {
      const sw = ch.swing;
      sw.t += dt;
      const k = Math.min(1, sw.t / sw.dur);
      const buzz = Math.sin(time * 90) * 0.06;
      ch.rightArm.rotation.x = -1.2 + buzz;
      ch.rightArm.rotation.z = -0.05;
      ch.leftArm.rotation.x = -1.1 + buzz;
      ch.leftArm.rotation.z = 0.45;
      ch.body.rotation.x += 0.15;
      ch.body.position.x = buzz * 0.3;
      if (!sw.hit && k >= 0.5) {
        sw.hit = true;
        if (sw.onHit) sw.onHit();
      }
      if (k >= 1) { ch.swing = null; ch.body.position.x = 0; }
    } else if (ch.swing) {
      const sw = ch.swing;
      sw.t += dt;
      const k = Math.min(1, sw.t / sw.dur);
      let arm, lean;
      if (k < 0.5) {
        const e = k / 0.5;
        arm = -3.0 * (1 - (1 - e) * (1 - e));
        lean = -0.2 * e;
      } else if (k < 0.7) {
        const e = (k - 0.5) / 0.2;
        arm = -3.0 + 1.9 * e * e;
        lean = -0.2 + 0.55 * e;
      } else {
        const e = (k - 0.7) / 0.3;
        arm = -1.1 * (1 - e);
        lean = 0.35 * (1 - e);
      }
      ch.rightArm.rotation.x = arm;
      ch.rightArm.rotation.z = -0.1;
      ch.leftArm.rotation.x = arm * 0.95;
      ch.leftArm.rotation.z = 0.35; // 左手も斧の柄にそえる
      ch.body.rotation.x += lean;
      if (!sw.hit && k >= 0.7) {
        sw.hit = true;
        if (sw.onHit) sw.onHit();
      }
      if (k >= 1) ch.swing = null;
    }
  }
  function startSwing(ch, dur, onHit) {
    ch.swing = { t: 0, dur, hit: false, onHit };
  }

  // 背中に薪を積むしくみ(主人公と仲間で共通)
  function makeCarrier(ch, max) {

  }
  const LOG_STEP = 0.27;
  const slotLocal = (i, out) => out.set(0, i * LOG_STEP, 0);
  const carrierFull = (c) => c.stack.length + c.pending >= c.max;

  // ================================================================
  //  飛んでいく物(薪・お金)
  // ================================================================
  const flying = [];
  function fly(obj, from, toFn, onLand, arc = 1.2, dur = FLY_TIME) {
    obj.position.copy(from);
    scene.add(obj);
    flying.push({ obj, from: from.clone(), toFn, onLand, arc, dur, t: 0 });
  }
  function updateFlying(dt) {
    for (let i = flying.length - 1; i >= 0; i--) {
      const f = flying[i];
      f.t += dt;
      const k = Math.min(1, f.t / f.dur);
      f.obj.position.lerpVectors(f.from, f.toFn(), k);
      f.obj.position.y += Math.sin(Math.PI * k) * f.arc;
      f.obj.rotation.x += dt * 14;
      if (k >= 1) {
        flying.splice(i, 1);
        scene.remove(f.obj);
        f.onLand();
      }
    }
  }

  const woodGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.85, 9);
  function makeLog() {
    const m = new THREE.Mesh(woodGeo, [logSide, logTop, logTop]);
    m.castShadow = true;
    return m;
  }
  const tmpA = V(), tmpB = V();

  // 背中に積む物: 薪(log)、生肉(raw)、焼いた肉(cooked)
  function makeItem(kind) {
    if (kind === 'log') { const m = makeLog(); m.userData.kind = 'log'; return m; }
    return makeMeat(kind);
  }
  function itemRest(item) {
    if (item.userData.kind === 'log') item.rotation.set(0, 0, Math.PI / 2);
    else item.rotation.set(0, 0, 0);
  }
  // 物を1つ、背中へ飛ばす
  function addItem(carrier, from, kind, onLand) {
    const item = makeItem(kind);
    if (kind === 'log') item.rotation.set(0, Math.random() * 3, Math.PI / 2);
    const index = carrier.stack.length + carrier.pending;
    carrier.pending++;
    fly(item, from, () => carrier.stackRoot.localToWorld(slotLocal(index, tmpB)), () => {
      carrier.pending--;
      itemRest(item);
      slotLocal(carrier.stack.length, item.position);
      carrier.stackRoot.add(item);
      carrier.stack.push(item);
      if (onLand) onLand();
    });
  }
  function addLog(carrier, from, onLand) { addItem(carrier, from, 'log', onLand); }
  const countKind = (carrier, kind) => carrier.stack.reduce((n, it) => n + (it.userData.kind === kind ? 1 : 0), 0);
  // 背中から、いちばん上にある指定の種類の物を取り出す(場所はワールド座標で tmpA に入る)
  function takeItem(carrier, kind) {
    for (let i = carrier.stack.length - 1; i >= 0; i--) {
      const item = carrier.stack[i];
      if (item.userData.kind !== kind) continue;
      item.getWorldPosition(tmpA);
      carrier.stackRoot.remove(item);
      carrier.stack.splice(i, 1);
      return item;
    }
    return null;
  }
  // 背中のいちばん上の薪を、焚き火の横の薪置き場へ飛ばす
  function dropLog(carrier, fire) {
    const log = takeItem(carrier, 'log');
    if (!log) return;
    const wood = fire.wood;
    const index = Math.min(WOOD_PILE_MAX - 1, wood.stock + wood.pending);
    wood.pending++;
    fly(log, tmpA, () => woodSlot(wood, index, tmpB), () => {
      wood.pending--;
      wood.stock++;
      drawWoodPile(wood);
      blip(260 + Math.min(wood.stock, 30) * 12, 0.05, 'triangle', 0.06, 0.8);
    }, 1.3);
  }
  function swayStack(carrier, time) {
    const speed = Math.hypot(carrier.ch.vx, carrier.ch.vz) / carrier.ch.speedRef;
    carrier.lean += (speed - carrier.lean) * 0.1;
    carrier.stack.forEach((log, i) => {
      log.position.y = i * LOG_STEP; // 途中の物を取り出したら、上の物が下がる
      log.position.z = -carrier.lean * i * i * 0.006;
      log.position.x = Math.sin(time * 9 + i * 0.5) * 0.012 * i * carrier.lean;
      log.rotation.y = ((i * 37) % 7 - 3) * 0.04;
    });
  }

  // ================================================================
  //  小さな粒(火の粉・木くず・土ぼこり)
  // ================================================================
  function makeParticles(geo, material, count) {
    const list = [];
    for (let i = 0; i < count; i++) {
      const m = new THREE.Mesh(geo, material);
      m.visible = false;
      scene.add(m);
      list.push({ mesh: m, life: 0, vx: 0, vy: 0, vz: 0 });
    }
    return { list, i: 0 };
  }
  function burst(pool, pos, count, spread, up) {
    for (let n = 0; n < count; n++) {
      const s = pool.list[pool.i++ % pool.list.length];
      s.life = 0.45 + Math.random() * 0.3;
      s.vx = (Math.random() - 0.5) * spread;
      s.vz = (Math.random() - 0.5) * spread;
      s.vy = up * (0.6 + Math.random() * 0.6);
      s.mesh.position.copy(pos);
      s.mesh.visible = true;
    }
  }
  function updateParticles(pool, dt, gravity) {
    for (const s of pool.list) {
      if (s.life <= 0) continue;
      s.life -= dt;
      s.vy -= gravity * dt;
      s.mesh.position.x += s.vx * dt;
      s.mesh.position.y += s.vy * dt;
      s.mesh.position.z += s.vz * dt;
      if (s.life <= 0) s.mesh.visible = false;
    }
  }
  const sparks = makeParticles(new THREE.SphereGeometry(0.06, 6, 4), new THREE.MeshBasicMaterial({ color: '#ffcf4a' }), 40);
  const chips = makeParticles(new THREE.BoxGeometry(0.1, 0.06, 0.1), mat('#e8b27a'), 40);

  const dustGeo = new THREE.SphereGeometry(0.16, 8, 6);
  const dustPool = [];
  for (let i = 0; i < 16; i++) {
    const m = new THREE.Mesh(dustGeo, new THREE.MeshBasicMaterial({ color: '#f6e3cc', transparent: true, opacity: 0, depthWrite: false }));
    m.visible = false;
    scene.add(m);
    dustPool.push({ mesh: m, life: 0, max: 1 });
  }
  let dustIndex = 0;
  function puff(x, y, z) {
    const d = dustPool[dustIndex++ % dustPool.length];
    d.life = d.max = 0.45;
    d.mesh.position.set(x + (Math.random() - 0.5) * 0.2, y + 0.1, z + (Math.random() - 0.5) * 0.2);
    d.mesh.visible = true;
  }
  function updateDust(dt) {
    for (const d of dustPool) {
      if (d.life <= 0) continue;
      d.life -= dt;
      const a = Math.max(0, d.life / d.max);
      d.mesh.material.opacity = a * 0.75;
      d.mesh.scale.setScalar(1 + (1 - a) * 1.6);
      d.mesh.position.y += dt * 0.4;
      if (d.life <= 0) d.mesh.visible = false;
    }
  }

  // ================================================================
  //  効果音(ファイルを使わず、その場で音を作る)
  // ================================================================
  let audio = null;
  function unlockAudio() {
    if (audio) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audio = new AC();
  }
  function blip(freq, dur = 0.07, type = 'triangle', vol = 0.08, slide = 1.5) {
    if (!audio) return;
    const t = audio.currentTime;
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audio.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  // ================================================================
  //  焚き火
  // ================================================================
  function feedFire(fire) {
    fire.heat = Math.min(100, fire.heat + HEAT_PER_LOG);
    fire.pop = Math.min(0.5, fire.pop + 0.25);
    burst(sparks, tmpA.set(fire.x, FLOOR + 0.6, fire.z), 5, 2.5, 4.5);
    blip(300 + fire.heat * 4, 0.09, 'sine', 0.1);
    advanceHint(2);
  }
  // 火の番: 薪置き場のそばに立って、薪を火にくべてくれる
  function hireFireKeeper(fire) {
    if (!fire || fire.keeper) return;
    const ch = makeCharacter({ coat: '#e07b39', coatDark: '#c4632a', hat: '#7a4a26' });
    const x = fire.x + 0.85, z = fire.z + 2.05;
    ch.root.position.set(x, FLOOR, z);
    ch.face = fire.wood;
    ch.angle = Math.atan2(fire.wood.x - x, fire.wood.z - z);
    ch.hop = 0.5;
    scene.add(ch.root);
    circles.push({ x, z, r: 0.35 });
    fire.keeper = { ch };
  }
  function updateFires(dt, time) {
    for (const fire of fires) updateFire(fire, dt, time);
  }
  function updateFire(fire, dt, time) {
    // 薪置き場から焚き火へ、1本ずつくべる(火がいっぱいのときは待つ)
    const wood = fire.wood;
    wood.feedTimer -= dt;
    if (fire.keeper) animateCharacter(fire.keeper.ch, dt, time);
    const tended = fire.tendedByPlayer || fire.keeper;
    if (tended && wood.feedTimer <= 0 && wood.stock > 0 && fire.heat <= 100 - HEAT_PER_LOG) {
      wood.feedTimer = FEED_INTERVAL;
      if (fire.keeper) fire.keeper.ch.chop = 0.6; // 火の番が薪を放りこむ
      wood.stock--;
      woodSlot(wood, Math.min(wood.stock, WOOD_PILE_MAX - 1), tmpA);
      drawWoodPile(wood);
      const log = makeLog();
      log.rotation.z = Math.PI / 2;
      fly(log, tmpA, () => tmpB.set(fire.x, FLOOR + 0.4, fire.z), () => feedFire(fire), 0.9, 0.3);
    }
    fire.heat = Math.max(0, fire.heat - (HEAT_DECAY + HEAT_DECAY_PER_GUEST * fire.warming) * dt);
    fire.pop = Math.max(0, fire.pop - dt * 3);
    const power = (0.35 + fire.heat / 100 * 1.05) * (1 + fire.pop);
    for (const f of fire.flames) {
      const flick = 1 + Math.sin(time * 12 + f.phase) * 0.12 + Math.sin(time * 7.3 + f.phase) * 0.08;
      const s = power * flick;
      const w = Math.sqrt(power) / Math.sqrt(flick);
      f.mesh.scale.set(w, s, w);
      f.mesh.position.y = 0.2 + f.h * s / 2;
      f.mesh.rotation.y += dt * 2;
    }
    fire.light.intensity = (2 + fire.heat / 100 * 7) * (1 + fire.pop) + Math.sin(time * 15) * 0.8 + Math.sin(time * 9.1) * 0.6;
  }

  // ================================================================
  //  切れる木(広場の奥の林)
  // ================================================================
  const trees = [];
  const stumpGeo = new THREE.CylinderGeometry(0.24, 0.3, 0.3, 8);
  const forestSpots = [];
  for (let gx = FOREST.x1 + 0.8; gx < FOREST.x2; gx += 2.5) {
    for (let gz = FOREST.z2 - 0.6; gz > FOREST.z1; gz -= 2.4) {
      const x = gx + (rand() - 0.5) * 1.0, z = gz + (rand() - 0.5) * 0.8;
      if (Math.abs(x - BACK_GATE_X) < 1.7 && z > -14.2) continue; // 出入口の前はあけておく
      forestSpots.push([x, z]);
    }
  }
  // 森の木も、雪原に生えている木も、すべて切れる
  const allTreeSpots = forestSpots.map(([x, z]) => [x, z, 0.8 + rand() * 0.25]).concat(wildSpots);
  let treesDirty = true;
  const treeMeshes = TREE_PARTS.map(part => {
    const im = new THREE.InstancedMesh(part.geo, part.mat, allTreeSpots.length);
    im.castShadow = im.receiveShadow = true;
    im.frustumCulled = false;
    scene.add(im);
    return im;
  });
  for (const [x, z, s] of allTreeSpots) {

    if (!helper) return;
    const h = helper, ch = h.ch, p = ch.root.position;
    if (h.state === 'toTree') {
      if (!h.tree || h.tree.hp <= 0) {
        // 出入口から近い木を選ぶ
        h.tree = nearestTree(insidePlaza(p.x, p.z) ? BACK_OUT : p, 100);
        if (h.tree) {
          const from = insidePlaza(p.x, p.z) ? BACK_OUT : p;
          const dx = from.x - h.tree.x, dz = from.z - h.tree.z, d = Math.hypot(dx, dz) || 1;
          h.path = route(p, { x: h.tree.x + dx / d * 1.0, z: h.tree.z + dz / d * 1.0 });
        }
      }
      if (h.tree && walkPath(ch, h.path, HELPER_SPEED, dt)) { h.state = 'chop'; ch.face = h.tree; }
      if (!h.tree) { ch.vx = ch.vz = 0; }
    } else if (h.state === 'chop') {
      ch.vx = ch.vz = 0;
      h.timer -= dt;
      if (h.timer <= 0 && !ch.swing) {
        const dur = HELPER_CHOP_INTERVAL * AXE_INTERVALS[axeLevel - 1] / AXE_INTERVALS[0];
        h.timer = dur;
        if (h.tree.hp > 0 && !carrierFull(h.carrier)) {
          const tree = h.tree;
          startSwing(ch, dur, () => hitTree(tree, h.carrier, HELPER_AXE_LOGS[axeLevel - 1]));
        } else if (h.carrier.pending === 0) {
          ch.face = null;
          if (h.carrier.stack.length > 0) {
            h.state = 'toFire';
            h.fire = fires.reduce((a, b) => (a.heat <= b.heat ? a : b)); // 火の弱いほうへ
            h.path = route(p, { x: h.fire.dropZone.x + 0.6, z: h.fire.dropZone.z - 0.2 });
          } else {
            h.state = 'toTree';
            h.tree = null;
          }
        }
      }
    } else if (h.state === 'toFire') {
      if (walkPath(ch, h.path, HELPER_SPEED, dt)) { h.state = 'drop'; ch.face = h.fire; }
    } else if (h.state === 'drop') {
      ch.vx = ch.vz = 0;
      h.timer -= dt;
      if (h.timer <= 0) {
        h.timer = DROP_INTERVAL * 2;
        if (h.carrier.stack.length > 0) dropLog(h.carrier, h.fire);
        else { h.state = 'toTree'; h.tree = null; ch.face = null; }
      }
    }
    pushOut(p, 0.35);
    keepInWorld(p, 0.35);
    // 木や柵に引っかかって進めないときは、横にずれてから行き直す
    if ((h.state === 'toTree' || h.state === 'toFire') && h.path.length) {
      const moved = flat(p, h.last);
      h.stuck = moved < HELPER_SPEED * dt * 0.3 ? h.stuck + dt : 0;
      if (h.stuck > 0.6) {
        const t = h.path[0], dx = t.x - p.x, dz = t.z - p.z, d = Math.hypot(dx, dz) || 1;
        const side = Math.random() < 0.5 ? 1 : -1;
        h.path.unshift({ x: p.x - dz / d * 1.2 * side, z: p.z + dx / d * 1.2 * side });
        h.stuck = 0;
      }
    }
    h.last.copy(p);
    animateCharacter(ch, dt, time);
    swayStack(h.carrier, time);
  }

  function updateBoars(dt, time) {
    const hs = hunters();
    for (const b of boars) {
      const p = b.root.position;
      if (!b.alive) {
        b.respawn -= dt;
        if (b.respawn <= 0) {
          // 狩り場のはしから、また出てくる
          const spot = randomMeadowSpot();
          spot.z = MEADOW.z2;
          p.set(spot.x, 0, spot.z);
          b.hp = BOAR_HP;
          b.alive = true;
          b.root.visible = true;
          b.root.scale.setScalar(0.01);
        }
        continue;
      }
      if (b.root.scale.x < BOAR_SIZE) b.root.scale.setScalar(Math.min(BOAR_SIZE, b.root.scale.x + dt * 3));
      // 近くに人が来たら逃げる
      let near = null, nearD = 3.2;
      for (const h of hs) { const d = flat(p, h); if (d < nearD) { near = h; nearD = d; } }
      let tvx = 0, tvz = 0;
      if (b.hit > 0) {
        b.hit -= dt;
      } else if (near) {
        const dx = p.x - near.x, dz = p.z - near.z, d = Math.hypot(dx, dz) || 1;
        tvx = dx / d * 3.4; tvz = dz / d * 3.4;
      } else if (b.idle > 0) {
        b.idle -= dt;
      } else {
        const dx = b.target.x - p.x, dz = b.target.z - p.z, d = Math.hypot(dx, dz);
        if (d < 0.3) { b.target = randomMeadowSpot(); b.idle = 1 + Math.random() * 2; }
        else { tvx = dx / d * 1.3; tvz = dz / d * 1.3; }
      }
      const k = Math.min(1, dt * 6);
      b.vx += (tvx - b.vx) * k;
      b.vz += (tvz - b.vz) * k;
      p.x = Math.max(MEADOW.x1, Math.min(MEADOW.x2, p.x + b.vx * dt));
      p.z = Math.max(MEADOW.z1, Math.min(MEADOW.z2, p.z + b.vz * dt));
      const speed = Math.hypot(b.vx, b.vz);
      if (speed > 0.2) {
        let diff = Math.atan2(b.vx, b.vz) - b.root.rotation.y;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        b.root.rotation.y += diff * Math.min(1, dt * 10);
        b.walk += speed * dt * 5;

    }

    const index = carrier.stack.length + carrier.pending;
    carrier.pending++;
    fly(item, tmpA, () => carrier.stackRoot.localToWorld(slotLocal(index, tmpB)), () => {
      carrier.pending--;
      itemRest(item);
      slotLocal(carrier.stack.length, item.position);
      carrier.stackRoot.add(item);
      carrier.stack.push(item);
      blip(640, 0.05);
      if (carrier === player.carrier) advanceHint(7);
    }, 1.0, 0.25);
    return true;
  }
  let smokeTimer = 0;
  function updateGrill(dt) {
    let cooking = false;
    for (const s of grillSlots) {
      if (!s.item || s.item.userData.kind !== 'raw') continue;
      cooking = true;
      s.t += dt;
      if (s.t >= COOK_TIME) { cookMeat(s.item); blip(980, 0.06, 'sine', 0.04, 1.2); }
    }
    smokeTimer -= dt;
    if (cooking && smokeTimer <= 0) {
      smokeTimer = 0.35;
      burst(smoke, tmpA.set(GRILL.x, FLOOR + 0.8, GRILL.z), 1, 0.4, 1.2);
    }
  }

  // ---- お客さんに肉を渡す ----
  const meatIcons = new Map();
  function wantingGuests() { return guests.filter(g => g.state === 'warm' && g.wantsMeat); }
  function serveMeat(fromCarrier, g, toPlayer) {
    const item = takeItem(fromCarrier, 'cooked');
    if (!item) return;
    g.wantsMeat = false;
    const gp = g.ch.root.position;
    fly(item, tmpA, () => tmpB.set(gp.x, gp.y + 1.3, gp.z), () => {
      g.warm = Math.min(1, g.warm + 0.25); // 食べて早く温まる
      g.ch.hop = 0.4;
      blip(760, 0.1, 'sine', 0.06, 1.4);
      for (let i = 0; i < MEAT_PRICE; i++) {
        if (toPlayer) {
          // 主人公が渡したときは、お金がそのまま手元に来る
          const coin = makeCoin();
          const pp = player.ch.root.position;
          fly(coin, V(gp.x + (Math.random() - 0.5) * 0.4, gp.y + 1.2 + i * 0.1, gp.z), () => tmpB.set(pp.x, pp.y + 1.1, pp.z), () => {
            money++;
            blip(1000 + (money % 10) * 40, 0.04, 'sine', 0.04, 1.2);
          }, 0.8, 0.35 + i * 0.05);
        } else {
          payToPile(V(gp.x, gp.y + 1.2, gp.z)); // 配膳係が渡したときは受付のお金置き場へ
        }
      }
      if (toPlayer) advanceHint(8);
    }, 1.0, 0.3);
  }
  let serveTimer = 0, grillTimer = 0;
  function updatePlayerMeat(dt, time) {
    const p = player.ch.root.position, carrier = player.carrier;
    // 🍖 の枠: 焼けた肉を受け取り、生肉をのせる
    const inGrill = inZone(grillZone, p);
    setZoneActive(grillZone, inGrill, time);
    grillTimer -= dt;
    if (inGrill && grillTimer <= 0) {
      if (unloadGrill(carrier) || loadGrill(carrier)) grillTimer = 0.15;
    }
    // 近くの、肉をほしがっているお客さんに渡す
    serveTimer -= dt;
    if (serveTimer <= 0 && countKind(carrier, 'cooked') > 0) {
      const g = wantingGuests().find(g => flat(g.ch.root.position, p) < 1.6);
      if (g) { serveTimer = 0.25; serveMeat(carrier, g, true); }
    }
  }
  function updateMeatIcons(time) {
    for (const g of guests) {
      let el = meatIcons.get(g);
      const show = g.state === 'warm' && g.wantsMeat;
      if (!el && show) {
        el = document.createElement('div');
        el.className = 'pile-label';
        el.textContent = '🍖';
        document.body.appendChild(el);
        meatIcons.set(g, el);
      }
      if (!el) continue;
      el.style.display = show ? 'block' : 'none';
      if (show) placeLabel(el, g.ch.root.position.x, FLOOR + 2.9 + Math.sin(time * 4 + g.warm * 10) * 0.08, g.ch.root.position.z);
    }
    for (const [g, el] of meatIcons) {
      if (!guests.includes(g)) { el.remove(); meatIcons.delete(g); }
    }
  }

  // ---- 猟師(自動で狩って、焼き台に生肉をのせる) ----
  let hunter = null;
  const FRONT_IN = () => ({ x: FRONT_GATE_X, z: camp.z2 - 0.6 });
  const FRONT_OUT = () => ({ x: FRONT_GATE_X, z: camp.z2 + 1.6 });
  function routeFront(from, to) {
    const a = insidePlaza(from.x, from.z), b = insidePlaza(to.x, to.z);
    if (a === b) return [to];
    return a ? [FRONT_IN(), FRONT_OUT(), to] : [FRONT_OUT(), FRONT_IN(), to];
  }
  function hireHunter() {
    if (hunter) return;
    const ch = makeCharacter({ coat: '#6b7a3a', coatDark: '#55622d', hat: '#c94f4f', pack: true });
    ch.speedRef = HELPER_SPEED;
    const pos = shops[3].pos;
    ch.root.position.set(pos.x, FLOOR, pos.z);
    ch.hop = 0.5;
    scene.add(ch.root);
    hunter = { ch, carrier: makeCarrier(ch, 6), state: 'out', path: [], timer: 0, boar: null };
    hunter.path = routeFront(ch.root.position, randomMeadowSpot());
  }
  function updateHunter(dt, time) {
    if (!hunter) return;
    const h = hunter, ch = h.ch, p = ch.root.position;
    h.timer -= dt;
    if (h.state === 'out') {
      if (walkPath(ch, h.path, HELPER_SPEED, dt)) h.state = 'hunt';
    } else if (h.state === 'hunt') {
      if (countKind(h.carrier, 'raw') >= 4 || carrierFull(h.carrier)) {
        if (h.carrier.pending === 0) { h.state = 'back'; h.path = routeFront(p, { x: -4.4, z: 7.0 }); }
      } else {
        const w = weapon();
        if (!h.boar || !h.boar.alive) h.boar = nearestBoar(p, 100);
        if (h.boar) {
          const bp = h.boar.root.position, d = flat(p, bp);
          if (d > w.range * 0.8) {
            walkPath(ch, [{ x: bp.x, z: bp.z }], HELPER_SPEED, dt);
          } else {
            ch.vx = ch.vz = 0;
            ch.face = bp;
            if (h.timer <= 0) { h.timer = w.cool * 1.3; ch.chop = 0.6; shoot(V(p.x, p.y + 1.1, p.z), h.boar, w, h.carrier); }
          }
        } else { ch.vx = ch.vz = 0; }
      }
    } else if (h.state === 'back') {
      if (walkPath(ch, h.path, HELPER_SPEED, dt)) { h.state = 'load'; ch.face = GRILL; }
    } else if (h.state === 'load') {
      ch.vx = ch.vz = 0;
      if (h.timer <= 0) {
        if (countKind(h.carrier, 'raw') === 0) { h.state = 'out'; ch.face = null; h.path = routeFront(p, randomMeadowSpot()); }
        else if (loadGrill(h.carrier)) h.timer = 0.25;
        else h.timer = 0.5; // 焼き台がいっぱいのときは待つ
      }
    }
    pushOut(p, 0.35);
    keepInWorld(p, 0.35);
    animateCharacter(ch, dt, time);
    swayStack(h.carrier, time);
  }

  // ---- 配膳係(焼けた肉を、ほしがっているお客さんに配る) ----
  let waiter = null;
  function hireWaiter() {
    if (waiter) return;
    const ch = makeCharacter({ coat: '#f2f2f2', coatDark: '#d8d8d8', hat: '#ef6c3a', pack: true });
    ch.speedRef = HELPER_SPEED;
    const pos = shops[3].pos;
    ch.root.position.set(pos.x, FLOOR, pos.z);
    ch.hop = 0.5;
    scene.add(ch.root);
    waiter = { ch, carrier: makeCarrier(ch, 4), state: 'toGrill', timer: 0, target: null };
  }
  function updateWaiter(dt, time) {
    if (!waiter) return;
    const w = waiter, ch = w.ch, p = ch.root.position;
    w.timer -= dt;
    const has = countKind(w.carrier, 'cooked');
    if (w.state === 'toGrill') {
      if (walkPath(ch, [{ x: -4.4, z: 7.0 }], HELPER_SPEED, dt)) { w.state = 'take'; ch.face = GRILL; }
    } else if (w.state === 'take') {
      ch.vx = ch.vz = 0;
      if (w.timer <= 0) {
        if (!carrierFull(w.carrier) && unloadGrill(w.carrier)) w.timer = 0.2;
        else if (has > 0 && w.carrier.pending === 0 && wantingGuests().length) { w.state = 'serve'; ch.face = null; }
        else w.timer = 0.4;
      }
    } else if (w.state === 'serve') {
      if (!w.target || !w.target.wantsMeat || w.target.state !== 'warm') {
        const list = wantingGuests();
        w.target = list.sort((a, b) => flat(a.ch.root.position, p) - flat(b.ch.root.position, p))[0] || null;
      }
      if (!w.target || has === 0) { w.state = 'toGrill'; w.target = null; }
      else {
        const gp = w.target.ch.root.position;
        if (flat(p, gp) > 1.2) walkPath(ch, [{ x: gp.x, z: gp.z }], HELPER_SPEED, dt);
        else { ch.vx = ch.vz = 0; serveMeat(w.carrier, w.target, false); w.target = null; }
      }
    }
    pushOut(p, 0.35);
    keepInWorld(p, 0.35);
    animateCharacter(ch, dt, time);
    swayStack(w.carrier, time);
  }

  // ================================================================
  //  入力(タッチ/マウス と キーボード)
  // ================================================================
  const stick = { active: false, id: null, ox: 0, oy: 0, dx: 0, dy: 0 };
  const keys = {};
  const canvas = renderer.domElement;
  const stickBase = $('stick-base'), stickKnob = $('stick-knob');
  function showStick() {
    stickBase.style.display = stickKnob.style.display = stick.active ? 'block' : 'none';
    stickBase.style.left = stick.ox + 'px';
    stickBase.style.top = stick.oy + 'px';
    stickKnob.style.left = (stick.ox + stick.dx) + 'px';
    stickKnob.style.top = (stick.oy + stick.dy) + 'px';
  }
  canvas.addEventListener('pointerdown', (e) => {
    if (stick.active) return;
    e.preventDefault();
    unlockAudio();
    Object.assign(stick, { active: true, id: e.pointerId, ox: e.clientX, oy: e.clientY, dx: 0, dy: 0 });
    canvas.setPointerCapture(e.pointerId);
    showStick();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!stick.active || e.pointerId !== stick.id) return;
    let dx = e.clientX - stick.ox, dy = e.clientY - stick.oy;
    const len = Math.hypot(dx, dy);
    if (len > STICK_RADIUS) {
      // 指が遠くまで行ったら、スティックの中心ごと引っぱってくる
      stick.ox += dx - dx / len * STICK_RADIUS;
      stick.oy += dy - dy / len * STICK_RADIUS;
      dx = dx / len * STICK_RADIUS;
      dy = dy / len * STICK_RADIUS;
    }
    stick.dx = dx;
    stick.dy = dy;
    showStick();
  });
  function endStick(e) {
    if (e.pointerId !== stick.id) return;
    Object.assign(stick, { active: false, id: null, dx: 0, dy: 0 });
    showStick();
  }
  canvas.addEventListener('pointerup', endStick);
  canvas.addEventListener('pointercancel', endStick);
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  window.addEventListener('keydown', (e) => { keys[e.key] = true; unlockAudio(); });
  window.addEventListener('keyup', (e) => { keys[e.key] = false; });

  function readInput() {
    let sx = 0, sy = 0;
    if (stick.active) {
      sx = stick.dx / STICK_RADIUS;
      sy = stick.dy / STICK_RADIUS;
      if (Math.hypot(sx, sy) < 0.15) sx = sy = 0; // 少しの指ブレは無視
    }
    if (keys.ArrowLeft || keys.a) sx -= 1;
    if (keys.ArrowRight || keys.d) sx += 1;
    if (keys.ArrowUp || keys.w) sy -= 1;
    if (keys.ArrowDown || keys.s) sy += 1;
    const len = Math.hypot(sx, sy);
    if (len > 1) { sx /= len; sy /= len; }
    // 画面の向きを、45度回したステージの向きに直す
    return { ix: sx * SCREEN_RIGHT.x + sy * SCREEN_DOWN.x, iz: sx * SCREEN_RIGHT.z + sy * SCREEN_DOWN.z };
  }

  // ================================================================
  //  主人公の更新
  // ================================================================
  let chopTimer = 0, dropTimer = 0, collectTimer = 0, payTimer = 0, dustTimer = 0;
  function updatePlayer(dt, time) {
    const ch = player.ch, carrier = player.carrier, p = ch.root.position;
    const { ix, iz } = readInput();
    const k = Math.min(1, dt * 14); // 目標の速さにすばやく近づける(キビキビ動く)
    ch.vx += (ix * SPEED - ch.vx) * k;
    ch.vz += (iz * SPEED - ch.vz) * k;
    p.x += ch.vx * dt;
    p.z += ch.vz * dt;
    pushOut(p, PLAYER_R);
    keepInWorld(p, PLAYER_R);
    followGround(p, dt);

    const moving = Math.hypot(ch.vx, ch.vz) > 0.5;
    if (moving) {
      dustTimer -= dt;
      if (dustTimer <= 0) { dustTimer = 0.1; puff(p.x, p.y, p.z); }
      advanceHint(0);
    }

    // 近くの木を自動で切る
    chopTimer -= dt;
    const tree = carrierFull(carrier) ? null : nearestTree(p, PLAYER_R + 0.9);
    ch.face = tree;
    if (tree && !ch.swing && chopTimer <= 0) {
      const dur = AXE_INTERVALS[axeLevel - 1];
      chopTimer = dur;
      startSwing(ch, dur, () => hitTree(tree, carrier, AXE_LOGS[axeLevel - 1], () => {
        blip(420 + carrier.stack.length * 30);
        advanceHint(1);
      }));
    }

    // 🔥 の枠で薪を入れる
    dropTimer -= dt;
    for (const fire of fires) {
      const inDrop = inZone(fire.dropZone, p);
      fire.tendedByPlayer = inDrop; // 枠に立っているあいだは、薪置き場から火にくべる
      setZoneActive(fire.dropZone, inDrop, time);
      if (inDrop && dropTimer <= 0 && countKind(carrier, 'log') > 0) {
        dropTimer = DROP_INTERVAL;
        dropLog(carrier, fire);
      }
    }
    // 🛎️ の枠に立つと、受付でお金を受け取れる
    deskAttended = inZone(deskZone, p);
    setZoneActive(deskZone, deskAttended, time);
    // 💰 の枠でお金を拾う
    const inCash = inZone(cashZone, p);
    collectTimer -= dt;
    if (inCash && collectTimer <= 0 && pileCount > 0) {
      collectTimer = 0.03;
      pileCount--;
      pileSlot(Math.min(pileCount, COIN_PILE_MAX - 1), tmpA);
      coinPile.count = Math.min(pileCount, COIN_PILE_MAX);
      const coin = makeCoin();
      fly(coin, tmpA, () => tmpB.set(p.x, p.y + 1.1, p.z), () => {
        money++;
        blip(1000 + (money % 10) * 40, 0.04, 'sine', 0.04, 1.2);
        advanceHint(4);
      }, 0.8, 0.18);
    }
    // 光る枠でお金を払う
    payTimer -= dt;
    for (const shop of shops) {
      const u = shopItem(shop);
      if (!u) continue;
      const inShop = inZone(shop.zone, p);
      if (inShop && payTimer <= 0 && money > 0 && shop.paid + shop.pending < u.cost) {
        payTimer = 0.04;
        payShop(shop);
      }
      setZoneActive(shop.zone, inShop || money >= u.cost - shop.paid, time);
    }

    setZoneActive(cashZone, inCash, time);
    updateBranches(dt, time, carrier);

    animateCharacter(ch, dt, time);
    swayStack(carrier, time);
  }

  // ================================================================
  //  画面の文字(HUD)
  // ================================================================
  const fireFill = $('fire-fill'), carryLabel = $('carry'), moneyLabel = $('money'), maxLabel = $('max');
  function updateHud(dt) {
    const c = player.carrier;
    const pp = player.ch.root.position;
    const near = fires.reduce((a, b) => (flat(pp, a) <= flat(pp, b) ? a : b));
    fireFill.style.width = near.heat + '%';
    carryLabel.textContent = c.stack.length + '/' + c.max;
    moneyLabel.textContent = money;
    if (c.stack.length >= c.max) {
      c.stackRoot.localToWorld(slotLocal(c.stack.length + 1, tmpA));
      tmpA.project(camera);
      maxLabel.style.left = ((tmpA.x + 1) / 2 * window.innerWidth) + 'px';
      maxLabel.style.top = ((1 - tmpA.y) / 2 * window.innerHeight) + 'px';
      maxLabel.style.display = 'block';
    } else {
      maxLabel.style.display = 'none';
    }
    if (toastTimer > 0) {
      toastTimer -= dt;
      if (toastTimer <= 0) $('toast').classList.remove('show');
    }
  }

  // ================================================================
  //  メインループ
  // ================================================================
  const camTarget = player.ch.root.position.clone();
  let camShake = 0;
  function shakeCamera(t) { camShake = Math.max(camShake, t); }
  let last = performance.now();
  function frame(now) {
    // 次のコマの予約を先にしておく(途中でエラーが起きても、ゲーム全体が止まらないように)
    requestAnimationFrame(frame);
    step(now);
  }
  // 1つの処理でエラーが起きても、ほかの処理と画面の描画は続ける
  function safe(name, fn) {
    try { fn(); } catch (err) { reportError(name, err); }
  }
  function step(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const time = now / 1000;

    safe('player', () => updatePlayer(dt, time));
    safe('helper', () => updateHelper(dt, time));
    safe('hunt', () => {
      updatePlayerHunting(dt);
      updatePlayerMeat(dt, time);
      updateBoars(dt, time);
      updateProjectiles(dt);
      updateGrill(dt);
      updateHunter(dt, time);
      updateWaiter(dt, time);
      updateParticles(smoke, dt, -1.5);
      updateMeatIcons(time);
    });
    safe('guests', () => updateGuests(dt, time));
    safe('trees', () => updateTrees(dt, time));
    safe('flying', () => updateFlying(dt));
    safe('fires', () => updateFires(dt, time));
    safe('effects', () => {
      updateParticles(sparks, dt, 9);
      updateParticles(chips, dt, 12);
      updateDust(dt);
    });

    // カメラは主人公を少し遅れて追いかける
    const p = player.ch.root.position;
    const ck = Math.min(1, dt * 6);
    camTarget.x += (p.x - camTarget.x) * ck;
    camTarget.z += (p.z - camTarget.z) * ck;
    camera.position.copy(camTarget).add(CAM_OFFSET);
    camera.lookAt(camTarget.x, 0.8, camTarget.z);
    if (camShake > 0) {
      camShake = Math.max(0, camShake - dt);
      const a = camShake * 0.6;
      camera.position.x += (Math.random() - 0.5) * a;
      camera.position.y += (Math.random() - 0.5) * a;
    }
    // 影はカメラのまわりだけ描けば十分なので、太陽ごとついてくる
    sun.position.copy(camTarget).add(SUN_OFFSET);
    sun.target.position.copy(camTarget);

    safe('hud', () => { updateHud(dt); updatePileLabel(); });
    safe('render', () => renderer.render(scene, camera));
    adaptQuality(now);
  }
  requestAnimationFrame(frame);

  // ================================================================
  //  進み具合のセーブ(iPhone の中に保存する。サーバーには送らない)
  // ================================================================
  let saveDisabled = false;
  function addLogInstant(carrier) {
    const log = makeLog();
    log.rotation.set(0, 0, Math.PI / 2);
    slotLocal(carrier.stack.length, log.position);
    carrier.stackRoot.add(log);
    carrier.stack.push(log);
  }
  function saveGame() {
    if (saveDisabled) return;
    const p = player.ch.root.position;
    const data = {
      version: 1, money: money + shops.reduce((n, s) => n + s.pending, 0), pile: pileCount + pilePending,
      shops: shops.map(s => [s.index, s.paid]), axe: axeLevel,
      heats: fires.map(f => Math.round(f.heat)), wood: fires.map(f => f.wood.stock + f.wood.pending),
      carry: countKind(player.carrier, 'log'), tutorial, x: p.x, z: p.z,
    };
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) { /* 保存できない設定のときは何もしない */ }
  }
  function loadGame() {
    let data = null;
    try { data = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { data = null; }
    if (!data || data.version !== 1) return false;
    // 解放済みのものを、音やお知らせなしで順に元に戻す
    shops.forEach((shop, i) => {
      const [index, paid] = data.shops[i] || [0, 0];
      for (let j = 0; j < index && j < shop.list.length; j++) shop.list[j].apply();
      shop.index = Math.min(index, shop.list.length);
      shop.paid = shopItem(shop) ? Math.min(paid, shopItem(shop).cost - 1) : 0;
      if (shopItem(shop)) shop.zone.redraw(shopItem(shop), shop.paid);
      else shop.zone.mesh.visible = false;
    });
    setAxeLevel(data.axe || axeLevel);
    money = data.money || 0;
    pileCount = data.pile || 0;
    drawCoinPile();
    fires.forEach((f, i) => {
      if (data.heats && data.heats[i] != null) f.heat = data.heats[i];
      if (data.wood && data.wood[i] != null) { f.wood.stock = data.wood[i]; drawWoodPile(f.wood); }
    });
    for (let i = 0; i < Math.min(data.carry || 0, player.carrier.max); i++) addLogInstant(player.carrier);
    if (typeof data.x === 'number' && typeof data.z === 'number') {
      player.ch.root.position.set(data.x, groundY(data.x, data.z), data.z);
      camTarget.copy(player.ch.root.position);
    }
    tutorial = data.tutorial || 0;
    if (tutorial < HINTS.length) hint.textContent = HINTS[tutorial];
    else hint.style.opacity = '0';
    return true;
  }
  safe('load', () => { if (loadGame()) toast('つづきから'); });
  setInterval(() => safe('save', saveGame), 5000);
  window.addEventListener('pagehide', () => safe('save', saveGame));
  document.addEventListener('visibilitychange', () => { if (document.hidden) safe('save', saveGame); });
  $('reset').addEventListener('click', () => {
    if (!confirm('最初からやり直しますか?(今の進み具合は消えます)')) return;
    saveDisabled = true;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* 何もしない */ }
    location.reload();
  });

  // 3秒ごとに平均の速さを見て、遅い(1秒に40コマ未満)ときは画面の細かさを一段下げる
  let qualityFrames = 0, qualityStart = performance.now();
  let pixelRatio = renderer.getPixelRatio();
  function adaptQuality(now) {
    qualityFrames++;
    const elapsed = now - qualityStart;
    if (elapsed < 3000) return;
    const fps = qualityFrames / (elapsed / 1000);
    qualityFrames = 0;
    qualityStart = now;
    if (document.hidden) return;
    if (fps < 40 && pixelRatio > 1) {
      pixelRatio = Math.max(1, pixelRatio - 0.25);
      renderer.setPixelRatio(pixelRatio);
      resize();
    }
  }
  // 一時停止から戻ったときに、時間が大きく飛ばないようにする
  document.addEventListener('visibilitychange', () => { last = performance.now(); qualityStart = last; qualityFrames = 0; });
  // iPhone でメモリが足りなくなると、3D の描画が止まることがある。そのときは再読み込みを案内する
  renderer.domElement.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    hint.textContent = '画面が止まりました。ページを再読み込みしてください';
    hint.style.opacity = '1';
  });

  // 自動テスト用(画面には影響しません)
  window.__scene = scene; window.__renderer = renderer; window.__player = player; // 自動テストで重さを測る用
  window.__game = {
    get state() {
      return {
        x: player.ch.root.position.x, z: player.ch.root.position.z,
        carry: player.carrier.stack.length, max: player.carrier.max, money, pile: pileCount,
        woodPiles: fires.map(f => f.wood.stock),
        heat: FIRE.heat, heats: fires.map(f => Math.round(f.heat)), camp: { ...camp }, guests: guests.length,
        guestStates: guests.map(g => g.state).join(','), errors: errorsSeen.slice(),
        queue: payQueue.length, sleepers, weaponLevel, boarsAlive: boars.filter(b => b.alive).length,
        meat: { raw: countKind(player.carrier, 'raw'), cooked: countKind(player.carrier, 'cooked') },
        grill: grillSlots.map(s => s.item ? s.item.userData.kind[0] : '-').join(''), wanting: wantingGuests().length,
        hunterState: hunter && hunter.state, waiterState: waiter && waiter.state, boarSpots: boars.filter(b => b.alive).map(b => [b.root.position.x, b.root.position.z]), keepers: fires.map(f => !!f.keeper), receptionist: !!receptionist, tutorial, shops: shops.map(s => s.index + ':' + s.paid), axeLevel,
        branches: branches.length, branchSpots: branches.map(b => [b.x, b.z]),
        treeSpots: trees.filter(t => t.hp > 0).map(t => [t.x, t.z]), helper: !!helper, hx: helper && helper.ch.root.position.x, hz: helper && helper.ch.root.position.z,
        helperState: helper && helper.state, slots: slots.length, tent: tent.visible,
      };
    },
    addMoney(n) { money += n; },
    setHeat(v) { for (const f of fires) f.heat = v; },
    wantingSpots() { return wantingGuests().map(g => [g.ch.root.position.x, g.ch.root.position.z]); },
  };
</script>
