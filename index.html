<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="雪のキャンプ">
<meta name="theme-color" content="#cfe3f2">
<title>雪のキャンプ</title>
<style>
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: #cfe3f2; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  .stick {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    display: none;
    transform: translate(-50%, -50%);
  }
  #stick-base { width: 112px; height: 112px; background: rgba(255, 255, 255, .3); border: 3px solid rgba(255, 255, 255, .7); }
  #stick-knob { width: 52px; height: 52px; background: rgba(255, 255, 255, .95); box-shadow: 0 2px 6px rgba(0, 0, 0, .25); }
  #hint {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom) + 40px);
    text-align: center;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    text-shadow: 0 2px 4px rgba(0, 0, 0, .5);
    pointer-events: none;
    transition: opacity .6s;
  }
  #hud {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 12px);
    left: 12px; right: 12px;
    display: flex;
    gap: 10px;
    align-items: center;
    pointer-events: none;
  }
  .pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(40, 30, 25, .55);
    color: #fff;
    font-size: 17px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  #fire-pill { flex: 1; }
  #fire-bar { flex: 1; height: 12px; border-radius: 6px; background: rgba(255, 255, 255, .25); overflow: hidden; }
  #fire-fill { height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, #ffb02e, #ff5a1f); transition: width .15s; }
  #max {
    position: fixed;
    transform: translate(-50%, -100%);
    padding: 2px 10px;
    border-radius: 8px;
    background: #ff5a1f;
    color: #fff;
    font-size: 15px;
    font-weight: 900;
    pointer-events: none;
    display: none;
  }
</style>
</head>
<body>
  <div id="stick-base" class="stick"></div>
  <div id="stick-knob" class="stick"></div>
  <div id="hud">
    <div id="fire-pill" class="pill">🔥<div id="fire-bar"><div id="fire-fill"></div></div></div>
    <div class="pill">🪵 <span id="carry">0/12</span></div>
  </div>
  <div id="max">MAX</div>
  <div id="hint">画面をなぞって歩こう</div>

<script type="module">
  import * as THREE from './vendor/three.module.min.js';

  // ---- 設定 ----
  const PX = 7, PZ = 9;       // キャンプ(柵の内側)の半分の広さ
  const SPEED = 6.5;          // 歩く速さ(単位/秒)
  const STICK_RADIUS = 56;    // バーチャルスティックの半径(px)
  const PLAYER_R = 0.4;       // キャラクターの当たり判定の半径
  const CAM_YAW = Math.PI / 4;   // カメラを45度回して、ステージを斜めに見せる
  const CAM_DIST = 24;           // カメラまでの水平距離
  const CAM_HEIGHT = 25;         // カメラの高さ
  const CAM_OFFSET = new THREE.Vector3(Math.sin(CAM_YAW) * CAM_DIST, CAM_HEIGHT, Math.cos(CAM_YAW) * CAM_DIST);
  // 画面の「右」と「下」が、ステージ上でどちら向きになるか
  const SCREEN_RIGHT = { x: Math.cos(CAM_YAW), z: -Math.sin(CAM_YAW) };
  const SCREEN_DOWN = { x: Math.sin(CAM_YAW), z: Math.cos(CAM_YAW) };

  const hint = document.getElementById('hint');
  const stickBase = document.getElementById('stick-base');
  const stickKnob = document.getElementById('stick-knob');

  // ---- 3Dの土台 ----
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.prepend(renderer.domElement);

  const SKY = '#cfe3f2';
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(SKY);
  scene.fog = new THREE.Fog(SKY, 50, 85);

  const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 120);

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.fov = w < h ? 40 : 28; // 縦長の画面では少し広く見せる
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- 光 ----
  scene.add(new THREE.HemisphereLight('#e6f1ff', '#b08a6a', 1.5));
  const sun = new THREE.DirectionalLight('#ffe6c4', 2.1);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -24, right: 24, top: 24, bottom: -24, near: 1, far: 80 });
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.03;
  scene.add(sun, sun.target);
  const SUN_OFFSET = new THREE.Vector3(-10, 22, 4);

  // ---- 小さな道具 ----
  let seed = 11; // 毎回同じ配置にするための種つき乱数
  function rand() {
    seed = (seed * 16807) % 2147483647;
    return (seed - 1) / 2147483646;
  }
  const mats = {};
  function mat(color, opts = {}) {
    const key = color + JSON.stringify(opts);
    return mats[key] || (mats[key] = new THREE.MeshStandardMaterial({ color, roughness: 0.85, ...opts }));
  }
  function mesh(geometry, material, x = 0, y = 0, z = 0, parent = scene) {
    const m = new THREE.Mesh(geometry, material);
    m.position.set(x, y, z);
    m.castShadow = true;
    m.receiveShadow = true;
    parent.add(m);
    return m;
  }
  function canvasTexture(size, draw) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    draw(c.getContext('2d'), size);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    return tex;
  }

  // ---- 当たり判定(丸と四角) ----
  const circles = [];
  const boxes = [];
  function pushOut(p) {
    for (const c of circles) {
      const dx = p.x - c.x, dz = p.z - c.z;
      const d = Math.hypot(dx, dz), min = c.r + PLAYER_R;
      if (d < min && d > 1e-4) { p.x = c.x + dx / d * min; p.z = c.z + dz / d * min; }
    }
    for (const b of boxes) {
      const cx = Math.max(b.x - b.hx, Math.min(b.x + b.hx, p.x));
      const cz = Math.max(b.z - b.hz, Math.min(b.z + b.hz, p.z));
      const dx = p.x - cx, dz = p.z - cz;
      const d = Math.hypot(dx, dz);
      if (d < PLAYER_R && d > 1e-4) { p.x = cx + dx / d * PLAYER_R; p.z = cz + dz / d * PLAYER_R; }
    }
  }

  // ---- 地面:まわりの雪原 ----
  const snow = new THREE.Mesh(new THREE.PlaneGeometry(140, 140), mat('#eef4fb', { roughness: 1 }));
  snow.rotation.x = -Math.PI / 2;
  snow.receiveShadow = true;
  scene.add(snow);
  for (let i = 0; i < 40; i++) { // 雪のこんもり
    const x = (rand() * 2 - 1) * 30, z = (rand() * 2 - 1) * 30;
    if (Math.abs(x) < PX + 2 && Math.abs(z) < PZ + 2) continue;
    const s = 0.6 + rand() * 1.2;
    const m = mesh(new THREE.SphereGeometry(1, 12, 8), mat('#f7fbff', { roughness: 1 }), x, 0, z);
    m.scale.set(s * 1.4, s * 0.35, s);
    m.castShadow = false;
  }

  // ---- 地面:キャンプの土の広場 ----
  const dirtTex = canvasTexture(256, (g, n) => {
    g.fillStyle = '#d8a47a'; g.fillRect(0, 0, n, n);
    for (let i = 0; i < 260; i++) {
      g.fillStyle = rand() < 0.5 ? 'rgba(255,240,220,.18)' : 'rgba(150,90,50,.12)';
      g.beginPath();
      g.ellipse(rand() * n, rand() * n, 2 + rand() * 7, 1 + rand() * 4, rand() * 3, 0, Math.PI * 2);
      g.fill();
    }
  });
  dirtTex.wrapS = dirtTex.wrapT = THREE.RepeatWrapping;
  dirtTex.repeat.set(PX / 2.5, PZ / 2.5);
  const plazaSide = mat('#a5704a');
  const plaza = new THREE.Mesh(
    new THREE.BoxGeometry(PX * 2 + 1.4, 0.2, PZ * 2 + 1.4),
    [plazaSide, plazaSide, new THREE.MeshStandardMaterial({ map: dirtTex, roughness: 0.95 }), plazaSide, plazaSide, plazaSide]
  );
  plaza.position.y = 0.1;
  plaza.receiveShadow = true;
  scene.add(plaza);
  const FLOOR = 0.2; // 広場の床の高さ

  // ---- 丸太の柵 ----
  const logSide = mat('#b9733f');
  const logTop = mat('#f1c890');
  const postGeo = new THREE.CylinderGeometry(0.28, 0.3, 1, 10);
  function addPost(x, z) {
    const h = 1.0 + rand() * 0.35;
    const post = new THREE.Mesh(postGeo, [logSide, logTop, logSide]);
    post.position.set(x, FLOOR + h / 2, z);
    post.scale.y = h;
    post.rotation.y = rand() * 6;
    post.castShadow = post.receiveShadow = true;
    scene.add(post);
  }
  const FX = PX + 0.35, FZ = PZ + 0.35, GAP = 0.58;
  for (let x = -FX; x <= FX + 0.01; x += GAP) { addPost(x, -FZ); addPost(x, FZ); }
  for (let z = -FZ + GAP; z < FZ - 0.01; z += GAP) { addPost(-FX, z); addPost(FX, z); }

  // ---- 雪の木(柵の外) ----
  const trunkMat = mat('#7a4e2d', { flatShading: true });
  const pineMats = [mat('#2e7d55', { flatShading: true }), mat('#2a6e4c', { flatShading: true })];
  const snowCap = mat('#ffffff', { flatShading: true, roughness: 1 });
  function addPine(x, z) {
    const s = 1 + rand() * 0.6;
    const tree = new THREE.Group();
    mesh(new THREE.CylinderGeometry(0.2, 0.28, 1, 6), trunkMat, 0, 0.5, 0, tree);
    const leaf = pineMats[Math.floor(rand() * pineMats.length)];
    for (let i = 0; i < 3; i++) {
      const r = 1.15 - i * 0.28, y = 1.25 + i * 0.7;
      mesh(new THREE.ConeGeometry(r, 1.2, 7), leaf, 0, y, 0, tree).rotation.y = rand() * 3;
      mesh(new THREE.ConeGeometry(r * 0.55, 0.55, 7), snowCap, 0, y + 0.36, 0, tree).rotation.y = rand() * 3;
    }
    tree.position.set(x, 0, z);
    tree.scale.setScalar(s);
    tree.rotation.y = rand() * 6;
    scene.add(tree);
  }
  for (let i = 0; i < 150; i++) {
    const x = (rand() * 2 - 1) * 36, z = (rand() * 2 - 1) * 36;
    if (Math.abs(x) < PX + 2.2 && Math.abs(z) < PZ + 2.2) continue;
    addPine(x, z);
  }

  // ---- キャンプの小物 ----
  const woodMat = mat('#d9894a');
  const woodDark = mat('#b06a35');

  function addBench(x, z, alongX) {
    const g = new THREE.Group();
    const len = 2.2;
    for (let i = -1; i <= 1; i++) mesh(new THREE.BoxGeometry(len, 0.1, 0.2), woodMat, 0, 0.5, i * 0.22, g);
    for (const sx of [-1, 1]) {
      mesh(new THREE.BoxGeometry(0.12, 0.45, 0.55), woodDark, sx * (len / 2 - 0.25), 0.23, 0, g);
    }
    g.position.set(x, FLOOR, z);
    if (!alongX) g.rotation.y = Math.PI / 2;
    scene.add(g);
    boxes.push(alongX ? { x, z, hx: len / 2, hz: 0.33 } : { x, z, hx: 0.33, hz: len / 2 });
  }

  const crateTex = canvasTexture(128, (g, n) => {
    g.fillStyle = '#c98a4b'; g.fillRect(0, 0, n, n);
    g.fillStyle = 'rgba(0,0,0,.12)';
    for (let i = 1; i < 4; i++) g.fillRect(0, i * n / 4 - 2, n, 4);
    g.strokeStyle = '#8d5a2c'; g.lineWidth = 12; g.strokeRect(6, 6, n - 12, n - 12);
    g.lineWidth = 10; g.beginPath(); g.moveTo(10, n - 10); g.lineTo(n - 10, 10); g.stroke();
  });
  const crateMat = new THREE.MeshStandardMaterial({ map: crateTex, roughness: 0.9 });
  function addCrate(x, z, y = FLOOR, s = 0.8) {
    const c = mesh(new THREE.BoxGeometry(s, s, s), crateMat, x, y + s / 2, z);
    c.rotation.y = (rand() - 0.5) * 0.4;
    return c;
  }

  function addLogPile(x, z) {
    const g = new THREE.Group();
    const geo = new THREE.CylinderGeometry(0.22, 0.22, 1.6, 10);
    const rows = [3, 2, 1];
    rows.forEach((count, row) => {
      for (let i = 0; i < count; i++) {
        const log = mesh(geo, [logSide, logTop, logTop], 0, 0.22 + row * 0.38, (i - (count - 1) / 2) * 0.45, g);
        log.rotation.z = Math.PI / 2;
      }
    });
    g.position.set(x, FLOOR, z);
    scene.add(g);
    boxes.push({ x, z, hx: 0.85, hz: 0.7 });
  }

  // 焚き火(炎はゆらゆら動かす)
  const flames = [];
  let fireLight;
  function addCampfire(x, z) {
    const g = new THREE.Group();
    const stoneMat = mat('#9aa3ad', { flatShading: true });
    for (let i = 0; i < 9; i++) {
      const a = i / 9 * Math.PI * 2;
      const s = mesh(new THREE.DodecahedronGeometry(0.22, 0), stoneMat, Math.cos(a) * 0.75, 0.12, Math.sin(a) * 0.75, g);
      s.scale.set(1.2, 0.8, 1);
      s.rotation.set(rand(), rand() * 6, rand());
    }
    for (let i = 0; i < 3; i++) {
      const log = mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.1, 8), [logSide, logTop, logTop], 0, 0.15, 0, g);
      log.rotation.z = Math.PI / 2 - 0.2;
      log.rotation.y = i / 3 * Math.PI;
    }
    const flameData = [['#ff7b29', 0.42, 1.0], ['#ffb02e', 0.3, 0.75], ['#ffe27a', 0.17, 0.5]];
    for (const [color, r, h] of flameData) {
      const f = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7), new THREE.MeshBasicMaterial({ color }));
      f.position.y = 0.2 + h / 2;
      g.add(f);
      flames.push({ mesh: f, h, phase: rand() * 6 });
    }
    fireLight = new THREE.PointLight('#ff9a40', 6, 7, 1.6);
    fireLight.position.y = 1;
    g.add(fireLight);
    g.position.set(x, FLOOR, z);
    scene.add(g);
    circles.push({ x, z, r: 0.95 });
  }

  // 床の四角い枠(乗ると薪を拾う/置く場所)
  function addZone(x, z, size, icon) {
    const tex = canvasTexture(256, (g, n) => {
      const r = 40, m = 14;
      g.fillStyle = 'rgba(255,246,230,.3)';
      g.strokeStyle = 'rgba(255,250,240,1)';
      g.lineWidth = 10;
      g.beginPath();
      g.roundRect(m, m, n - m * 2, n - m * 2, r);
      g.fill();
      g.stroke();
      // 斜めのカメラから見て、アイコンがまっすぐ立って見えるように回す
      g.translate(n / 2, n / 2);
      g.rotate(-CAM_YAW);
      g.font = '120px sans-serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText(icon, 0, 8);
    });
    const material = new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 1, depthWrite: false });
    const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size), material);
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, FLOOR + 0.01, z);
    m.receiveShadow = true;
    scene.add(m);
    return { x, z, half: size / 2, mesh: m, material };
  }
  function inZone(zone, p) {
    return Math.abs(p.x - zone.x) < zone.half && Math.abs(p.z - zone.z) < zone.half;
  }

  const FIRE = { x: -2.2, z: -2.5 };
  addCampfire(FIRE.x, FIRE.z);
  addBench(-2.2, -4.6, true);
  addBench(-4.6, -2.5, false);
  addLogPile(4.8, -6.5);
  addCrate(5.6, 7.6); addCrate(4.7, 7.8); addCrate(5.2, 7.7, FLOOR + 0.8, 0.7);
  boxes.push({ x: 5.15, z: 7.7, hx: 0.95, hz: 0.5 });
  addCrate(-6.1, 6.2);
  circles.push({ x: -6.1, z: 6.2, r: 0.5 });
  const pickupZone = addZone(4.8, -4.5, 2.4, '🪵');
  const dropZone = addZone(-2.2, -0.35, 2.4, '🔥');

  // ---- キャラクター(頭の大きいちびキャラ) ----
  const C = {
    coat: mat('#3f7fd6', { roughness: 0.75 }),
    coatDark: mat('#2f66b3', { roughness: 0.75 }),
    skin: mat('#ffdcbc', { roughness: 0.6 }),
    hat: mat('#ef6c3a', { roughness: 0.9 }),
    knit: mat('#fff3e2', { roughness: 1 }),
    boots: mat('#4a3b35'),
    pack: mat('#8a5a34'),
    eye: mat('#1e1e28', { roughness: 0.3 }),
    cheek: mat('#ff9e9e', { roughness: 1 }),
  };

  const player = new THREE.Group();   // 位置と向き(前は +z)
  const body = new THREE.Group();     // 上下に弾む部分
  player.add(body);

  mesh(new THREE.CapsuleGeometry(0.34, 0.22, 6, 16), C.coat, 0, 0.62, 0, body).scale.set(1, 1, 0.9);
  mesh(new THREE.CylinderGeometry(0.36, 0.4, 0.12, 16), C.coatDark, 0, 0.4, 0, body); // すそ
  mesh(new THREE.BoxGeometry(0.06, 0.4, 0.04), C.knit, 0, 0.66, 0.31, body);          // 前のファスナー
  const scarf = mesh(new THREE.TorusGeometry(0.27, 0.11, 10, 20), C.hat, 0, 0.92, 0, body);
  scarf.rotation.x = Math.PI / 2;
  mesh(new THREE.BoxGeometry(0.14, 0.32, 0.08), C.hat, 0.14, 0.78, 0.3, body).rotation.z = 0.15; // マフラーのたれ
  // リュック(あとで荷物を積み上げる場所)
  mesh(new THREE.BoxGeometry(0.48, 0.5, 0.24), C.pack, 0, 0.7, -0.34, body);
  mesh(new THREE.BoxGeometry(0.5, 0.12, 0.26), mat('#6e4527'), 0, 0.97, -0.34, body);

  const head = new THREE.Group();
  head.position.y = 1.38;
  body.add(head);
  mesh(new THREE.SphereGeometry(0.5, 28, 20), C.skin, 0, 0, 0, head).scale.set(1, 0.94, 0.95);
  const hatTop = mesh(new THREE.SphereGeometry(0.53, 28, 14, 0, Math.PI * 2, 0, Math.PI * 0.42), C.hat, 0, 0.06, -0.03, head);
  hatTop.scale.set(1, 1.05, 1);
  const brim = mesh(new THREE.TorusGeometry(0.5, 0.1, 10, 28), C.knit, 0, 0.18, -0.04, head);
  brim.scale.set(0.93, 0.93, 1);
  brim.rotation.x = Math.PI / 2 - 0.15;
  mesh(new THREE.SphereGeometry(0.15, 14, 10), C.knit, 0, 0.62, -0.06, head);
  for (const side of [-1, 1]) {
    const eye = mesh(new THREE.SphereGeometry(0.065, 12, 10), C.eye, side * 0.17, -0.02, 0.45, head);
    eye.scale.set(1, 1.35, 0.6);
    const shine = mesh(new THREE.SphereGeometry(0.022, 8, 6), C.knit, side * 0.17 + 0.02, 0.02, 0.49, head);
    shine.castShadow = false;
    const cheek = mesh(new THREE.SphereGeometry(0.07, 10, 8), C.cheek, side * 0.29, -0.15, 0.37, head);
    cheek.scale.set(1, 0.6, 0.4);
    cheek.castShadow = false;
  }
  mesh(new THREE.SphereGeometry(0.05, 10, 8), mat('#f5b896'), 0, -0.11, 0.48, head);

  // 腕と足は付け根を軸にして振る
  const limbs = [];
  function addLimb(parent, x, y, len, radius, material, endMat, isLeg, side) {
    const pivot = new THREE.Group();
    pivot.position.set(x, y, 0);
    mesh(new THREE.CapsuleGeometry(radius, len, 4, 10), material, 0, -len / 2 - radius * 0.3, 0, pivot);
    mesh(new THREE.SphereGeometry(radius * 1.25, 12, 10), endMat, 0, -len - radius * 0.6, isLeg ? 0.05 : 0, pivot)
      .scale.set(1, 0.85, isLeg ? 1.3 : 1);
    parent.add(pivot);
    limbs.push({ pivot, isLeg, side });
  }
  addLimb(player, -0.15, 0.36, 0.12, 0.12, C.coatDark, C.boots, true, -1);
  addLimb(player, 0.15, 0.36, 0.12, 0.12, C.coatDark, C.boots, true, 1);
  addLimb(body, -0.4, 0.82, 0.22, 0.1, C.coat, C.hat, false, -1);
  addLimb(body, 0.4, 0.82, 0.22, 0.1, C.coat, C.hat, false, 1);
  for (const l of limbs) if (!l.isLeg) l.pivot.rotation.z = -l.side * 0.3;

  player.position.set(1.5, FLOOR, 4.5);
  scene.add(player);

  const state = { vx: 0, vz: 0, angle: Math.PI / 4, walk: 0 };

  // ---- 土ぼこり ----
  const dustGeo = new THREE.SphereGeometry(0.16, 8, 6);
  const dustPool = [];
  for (let i = 0; i < 16; i++) {
    const m = new THREE.Mesh(dustGeo, new THREE.MeshBasicMaterial({ color: '#f6e3cc', transparent: true, opacity: 0, depthWrite: false }));
    m.visible = false;
    scene.add(m);
    dustPool.push({ mesh: m, life: 0, max: 1 });
  }
  let dustIndex = 0;
  function puff(x, z) {
    const d = dustPool[dustIndex++ % dustPool.length];
    d.life = d.max = 0.45;
    d.mesh.position.set(x + (Math.random() - 0.5) * 0.2, FLOOR + 0.1, z + (Math.random() - 0.5) * 0.2);
    d.mesh.visible = true;
  }

  // ---- 効果音(ファイルを使わず、その場で音を作る) ----
  let audio = null;
  function unlockAudio() {
    if (audio) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audio = new AC();
  }
  function blip(freq, dur = 0.07, type = 'triangle', vol = 0.08) {
    if (!audio) return;
    const t = audio.currentTime;
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(freq * 1.5, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audio.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  // ---- 説明の文字 ----
  const HINTS = [
    '画面をなぞって歩こう',
    '🪵 の枠に入って、薪を拾おう',
    '🔥 の枠まで運ぼう',
  ];
  let tutorial = 0;
  function setHint(step) {
    tutorial = step;
    if (step < HINTS.length) {
      hint.textContent = HINTS[step];
      hint.style.opacity = '1';
    } else {
      hint.style.opacity = '0';
    }
  }

  // ---- 薪を拾って、背中に積んで、焚き火に運ぶ ----
  const MAX_CARRY = 12;
  const PICK_INTERVAL = 0.09;  // 薪を1本拾う間隔(秒)
  const DROP_INTERVAL = 0.06;  // 薪を1本置く間隔(秒)
  const FLY_TIME = 0.22;       // 薪が飛んでいく時間(秒)
  const HEAT_PER_LOG = 5;      // 薪1本で増える火の強さ
  const HEAT_DECAY = 1.5;      // 火が弱まる速さ(1秒あたり)

  const fire = { heat: 30, pop: 0 };
  const carryLabel = document.getElementById('carry');
  const fireFill = document.getElementById('fire-fill');
  const maxLabel = document.getElementById('max');

  const woodGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.85, 9);
  function makeLog() {
    const m = new THREE.Mesh(woodGeo, [logSide, logTop, logTop]);
    m.castShadow = true;
    return m;
  }

  // 背中の薪の山
  const stackRoot = new THREE.Group();
  stackRoot.position.set(0, 0.6, -0.62);
  body.add(stackRoot);
  const stack = [];
  const LOG_STEP = 0.27; // 1本ごとの高さ
  function slotLocal(i, out) {
    return out.set(0, i * LOG_STEP, 0);
  }

  const flying = [];
  let pendingPickups = 0;
  let pickTimer = 0, dropTimer = 0;
  let lean = 0;
  const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();

  function fly(meshObj, from, toFn, onLand, arc) {
    meshObj.position.copy(from);
    scene.add(meshObj);
    flying.push({ mesh: meshObj, from: from.clone(), toFn, onLand, arc, t: 0 });
  }

  function pickOne() {
    const log = makeLog();
    log.rotation.set(0, Math.random() * 3, Math.PI / 2);
    const index = stack.length + pendingPickups;
    pendingPickups++;
    const from = new THREE.Vector3(4.8 + (Math.random() - 0.5) * 0.8, FLOOR + 0.8, -6.5 + (Math.random() - 0.5) * 0.6);
    fly(log, from, () => stackRoot.localToWorld(slotLocal(index, tmpB)), () => {
      pendingPickups--;
      log.position.set(0, 0, 0);
      log.rotation.set(0, 0, Math.PI / 2);
      slotLocal(stack.length, log.position);
      stackRoot.add(log);
      stack.push(log);
      blip(420 + stack.length * 45);
      if (tutorial === 1) setHint(2);
    }, 1.2);
  }

  function dropOne() {
    const log = stack.pop();
    log.getWorldPosition(tmpA);
    stackRoot.remove(log);
    const target = new THREE.Vector3(FIRE.x, FLOOR + 0.5, FIRE.z);
    fly(log, tmpA, () => target, () => {
      fire.heat = Math.min(100, fire.heat + HEAT_PER_LOG);
      fire.pop = Math.min(0.5, fire.pop + 0.25);
      sparkBurst();
      blip(300 + fire.heat * 4, 0.09, 'sine', 0.1);
      if (tutorial === 2 && stack.length === 0) setHint(3);
    }, 1.6);
  }

  // 火の粉
  const sparkGeo = new THREE.SphereGeometry(0.06, 6, 4);
  const sparkMat = new THREE.MeshBasicMaterial({ color: '#ffcf4a' });
  const sparks = [];
  for (let i = 0; i < 40; i++) {
    const m = new THREE.Mesh(sparkGeo, sparkMat);
    m.visible = false;
    scene.add(m);
    sparks.push({ mesh: m, life: 0, vx: 0, vy: 0, vz: 0 });
  }
  let sparkIndex = 0;
  function sparkBurst() {
    for (let i = 0; i < 5; i++) {
      const s = sparks[sparkIndex++ % sparks.length];
      s.life = 0.5 + Math.random() * 0.3;
      s.vx = (Math.random() - 0.5) * 2.5;
      s.vz = (Math.random() - 0.5) * 2.5;
      s.vy = 3 + Math.random() * 2.5;
      s.mesh.position.set(FIRE.x, FLOOR + 0.6, FIRE.z);
      s.mesh.visible = true;
    }
  }

  function setZoneActive(zone, active, time) {
    const pulse = active ? 0.9 + Math.sin(time * 10) * 0.1 : 0.8;
    zone.material.opacity = pulse;
    zone.material.color.set(active ? '#fff3b0' : '#ffffff');
    const s = active ? 1.06 : 1;
    zone.mesh.scale.set(s, s, 1);
  }

  function updateWood(dt, time) {
    const p = player.position;
    const inPick = inZone(pickupZone, p);
    const inDrop = inZone(dropZone, p);
    setZoneActive(pickupZone, inPick, time);
    setZoneActive(dropZone, inDrop, time);

    pickTimer -= dt;
    if (inPick && pickTimer <= 0 && stack.length + pendingPickups < MAX_CARRY) {
      pickTimer = PICK_INTERVAL;
      pickOne();
    }
    dropTimer -= dt;
    if (inDrop && dropTimer <= 0 && stack.length > 0) {
      dropTimer = DROP_INTERVAL;
      dropOne();
    }

    // 飛んでいる薪(放物線を描いて飛ぶ)
    for (let i = flying.length - 1; i >= 0; i--) {
      const f = flying[i];
      f.t += dt;
      const k = Math.min(1, f.t / FLY_TIME);
      const to = f.toFn();
      f.mesh.position.lerpVectors(f.from, to, k);
      f.mesh.position.y += Math.sin(Math.PI * k) * f.arc;
      f.mesh.rotation.x += dt * 14;
      if (k >= 1) {
        flying.splice(i, 1);
        scene.remove(f.mesh);
        f.onLand();
      }
    }

    // 走ると背中の薪の山が後ろにしなる
    const speed = Math.hypot(state.vx, state.vz) / SPEED;
    lean += (speed - lean) * Math.min(1, dt * 6);
    stack.forEach((log, i) => {
      log.position.z = -lean * i * i * 0.006;
      log.position.x = Math.sin(time * 9 + i * 0.5) * 0.012 * i * lean;
      log.rotation.y = ((i * 37) % 7 - 3) * 0.04; // 少し不ぞろいに積む
    });

    for (const s of sparks) {
      if (s.life <= 0) continue;
      s.life -= dt;
      s.vy -= 9 * dt;
      s.mesh.position.x += s.vx * dt;
      s.mesh.position.y += s.vy * dt;
      s.mesh.position.z += s.vz * dt;
      if (s.life <= 0) s.mesh.visible = false;
    }

    fire.heat = Math.max(0, fire.heat - HEAT_DECAY * dt);
    fireFill.style.width = fire.heat + '%';
    carryLabel.textContent = stack.length + '/' + MAX_CARRY;

    // いっぱいのときは頭の上に MAX を出す
    if (stack.length >= MAX_CARRY) {
      stackRoot.localToWorld(slotLocal(stack.length + 1, tmpA));
      tmpA.project(camera);
      maxLabel.style.left = ((tmpA.x + 1) / 2 * window.innerWidth) + 'px';
      maxLabel.style.top = ((1 - tmpA.y) / 2 * window.innerHeight) + 'px';
      maxLabel.style.display = 'block';
    } else {
      maxLabel.style.display = 'none';
    }
  }

  // ---- 入力(タッチ/マウス と キーボード) ----
  const stick = { active: false, id: null, ox: 0, oy: 0, dx: 0, dy: 0 };
  const keys = {};
  const canvas = renderer.domElement;

  function showStick() {
    stickBase.style.display = stickKnob.style.display = stick.active ? 'block' : 'none';
    stickBase.style.left = stick.ox + 'px';
    stickBase.style.top = stick.oy + 'px';
    stickKnob.style.left = (stick.ox + stick.dx) + 'px';
    stickKnob.style.top = (stick.oy + stick.dy) + 'px';
  }
  canvas.addEventListener('pointerdown', (e) => {
    if (stick.active) return;
    e.preventDefault();
    unlockAudio();
    Object.assign(stick, { active: true, id: e.pointerId, ox: e.clientX, oy: e.clientY, dx: 0, dy: 0 });
    canvas.setPointerCapture(e.pointerId);
    showStick();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!stick.active || e.pointerId !== stick.id) return;
    let dx = e.clientX - stick.ox;
    let dy = e.clientY - stick.oy;
    const len = Math.hypot(dx, dy);
    if (len > STICK_RADIUS) {
      // 指が遠くまで行ったら、スティックの中心ごと引っぱってくる
      stick.ox += dx - dx / len * STICK_RADIUS;
      stick.oy += dy - dy / len * STICK_RADIUS;
      dx = dx / len * STICK_RADIUS;
      dy = dy / len * STICK_RADIUS;
    }
    stick.dx = dx;
    stick.dy = dy;
    showStick();
  });
  function endStick(e) {
    if (e.pointerId !== stick.id) return;
    Object.assign(stick, { active: false, id: null, dx: 0, dy: 0 });
    showStick();
  }
  canvas.addEventListener('pointerup', endStick);
  canvas.addEventListener('pointercancel', endStick);
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  window.addEventListener('keydown', (e) => { keys[e.key] = true; unlockAudio(); });
  window.addEventListener('keyup', (e) => { keys[e.key] = false; });

  // 画面上の向き(右・下)を返す
  function readInput() {
    let sx = 0, sy = 0;
    if (stick.active) {
      sx = stick.dx / STICK_RADIUS;
      sy = stick.dy / STICK_RADIUS;
      if (Math.hypot(sx, sy) < 0.15) sx = sy = 0; // 少しの指ブレは無視
    }
    if (keys.ArrowLeft || keys.a) sx -= 1;
    if (keys.ArrowRight || keys.d) sx += 1;
    if (keys.ArrowUp || keys.w) sy -= 1;
    if (keys.ArrowDown || keys.s) sy += 1;
    const len = Math.hypot(sx, sy);
    if (len > 1) { sx /= len; sy /= len; }
    // 画面の向きを、45度回したステージの向きに直す
    return {
      ix: sx * SCREEN_RIGHT.x + sy * SCREEN_DOWN.x,
      iz: sx * SCREEN_RIGHT.z + sy * SCREEN_DOWN.z,
    };
  }

  // ---- 更新 ----
  let dustTimer = 0;
  const camTarget = player.position.clone();

  function update(dt, time) {
    const { ix, iz } = readInput();

    // 目標の速さにすばやく近づける(キビキビした動きのため強め)
    const k = Math.min(1, dt * 14);
    state.vx += (ix * SPEED - state.vx) * k;
    state.vz += (iz * SPEED - state.vz) * k;
    const p = player.position;
    p.x += state.vx * dt;
    p.z += state.vz * dt;
    pushOut(p);
    // 柵の外に出ない
    p.x = Math.max(-PX + PLAYER_R, Math.min(PX - PLAYER_R, p.x));
    p.z = Math.max(-PZ + PLAYER_R, Math.min(PZ - PLAYER_R, p.z));

    const speed = Math.hypot(state.vx, state.vz);
    const moving = speed > 0.5;
    if (moving) {
      // 進む方向へなめらかに向きを変える
      let diff = Math.atan2(state.vx, state.vz) - state.angle;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      state.angle += diff * Math.min(1, dt * 18);
      state.walk += speed * dt * 2.6;

      dustTimer -= dt;
      if (dustTimer <= 0) { dustTimer = 0.1; puff(p.x, p.z); }
      if (tutorial === 0) setHint(1);
    } else {
      // 止まったら足をそろえる
      state.walk += (Math.round(state.walk / Math.PI) * Math.PI - state.walk) * Math.min(1, dt * 10);
    }
    player.rotation.y = state.angle;

    // 手足を振る・体を弾ませる・止まっているときは呼吸
    const amount = Math.min(1, speed / SPEED);
    const swing = Math.sin(state.walk);
    for (const l of limbs) l.pivot.rotation.x = swing * l.side * (l.isLeg ? 0.9 : -1.0) * amount;
    body.position.y = moving
      ? Math.abs(Math.cos(state.walk)) * 0.08 * amount
      : Math.sin(time * 2.5) * 0.012;
    body.rotation.x = 0.1 * amount;                 // 走るときは少し前のめり
    head.rotation.z = Math.sin(state.walk) * 0.06 * amount; // 頭も少しゆれる

    for (const d of dustPool) {
      if (d.life <= 0) continue;
      d.life -= dt;
      const a = Math.max(0, d.life / d.max);
      d.mesh.material.opacity = a * 0.75;
      d.mesh.scale.setScalar(1 + (1 - a) * 1.6);
      d.mesh.position.y += dt * 0.4;
      if (d.life <= 0) d.mesh.visible = false;
    }

    updateWood(dt, time);

    // 焚き火の炎をゆらす(火の強さで大きさが変わる)
    fire.pop = Math.max(0, fire.pop - dt * 3);
    const power = (0.4 + fire.heat / 100 * 1.0) * (1 + fire.pop);
    for (const f of flames) {
      const s = power * (1 + Math.sin(time * 12 + f.phase) * 0.12 + Math.sin(time * 7.3 + f.phase) * 0.08);
      const w = Math.sqrt(power) / Math.sqrt(s / power);
      f.mesh.scale.set(w, s, w);
      f.mesh.position.y = 0.2 + f.h * s / 2;
      f.mesh.rotation.y += dt * 2;
    }
    fireLight.intensity = (2 + fire.heat / 100 * 7) * (1 + fire.pop)
      + Math.sin(time * 15) * 0.8 + Math.sin(time * 9.1) * 0.6;

    // カメラはキャラクターを少し遅れて追いかける
    const ck = Math.min(1, dt * 6);
    camTarget.x += (p.x - camTarget.x) * ck;
    camTarget.z += (p.z - camTarget.z) * ck;
    camera.position.copy(camTarget).add(CAM_OFFSET);
    camera.lookAt(camTarget.x, 0.8, camTarget.z);

    // 影はキャラクターのまわりだけ描けば十分なので、太陽ごとついてくる
    sun.position.copy(camTarget).add(SUN_OFFSET);
    sun.target.position.copy(camTarget);
  }

  // ---- メインループ ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt, now / 1000);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
