<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="雪原開拓">
<meta name="theme-color" content="#cfe2f0">
<title>雪原開拓(仮)</title>
<style>
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: #cfe2f0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  .stick { position: fixed; border-radius: 50%; pointer-events: none; display: none; transform: translate(-50%, -50%); }
  #stick-base { width: 112px; height: 112px; background: rgba(255, 255, 255, .25); border: 3px solid rgba(255, 255, 255, .7); }
  #stick-knob { width: 52px; height: 52px; background: rgba(255, 255, 255, .95); }
  #hud { position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: 10px; display: flex; gap: 6px; pointer-events: none; }
  .pill {
    display: flex; align-items: center; gap: 4px; padding: 4px 11px; border-radius: 999px; min-width: 64px; justify-content: center;
    background: rgba(20, 34, 52, .5); border: 1px solid rgba(255, 255, 255, .3); color: #fff; font-size: 16px; font-weight: 800;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .pill.hide { display: none; }
  .pill.bump { animation: bump .18s ease-out; }
  @keyframes bump { 50% { transform: scale(1.15); } }
  #toast { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 52px); text-align: center; pointer-events: none; color: #fff; font-size: 21px; font-weight: 900; text-shadow: 0 2px 0 #2a5a8a, 0 3px 10px rgba(0, 0, 0, .35); opacity: 0; transform: translateY(-8px); transition: opacity .25s, transform .25s; }
  #toast.show { opacity: 1; transform: none; }
  #hint { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 26px); text-align: center; pointer-events: none; color: #fff; font-size: 15px; font-weight: 800; text-shadow: 0 1px 4px rgba(0, 0, 0, .6); transition: opacity .5s; }
  .pop { position: fixed; pointer-events: none; transform: translate(-50%, -50%); white-space: nowrap; font-weight: 900; font-size: 18px; color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .45); display: none; }
  .site-label { position: fixed; pointer-events: none; transform: translate(-50%, -100%); display: none; text-align: center; }
  .site-label b { display: inline-block; padding: 2px 10px; border-radius: 999px; background: rgba(20, 60, 30, .72); color: #fff; font-size: 15px; font-weight: 900; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .site-label .bar { width: 92px; height: 8px; margin: 3px auto 0; border-radius: 4px; background: rgba(0, 0, 0, .35); overflow: hidden; border: 1px solid rgba(255, 255, 255, .6); }
  .site-label .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7dff6a, #3fd35a); }
  .site-label.full b { background: rgba(230, 150, 20, .85); }
  #arrow { position: fixed; display: none; width: 40px; height: 40px; margin: -20px 0 0 -20px; font-size: 28px; line-height: 40px; text-align: center; color: #ffd23f; text-shadow: 0 0 3px #000; pointer-events: none; }
  #version { position: fixed; left: 8px; bottom: calc(env(safe-area-inset-bottom) + 6px); color: rgba(30, 50, 70, .5); font-size: 11px; pointer-events: none; }
  #debug { position: fixed; right: 8px; top: calc(env(safe-area-inset-top) + 8px); padding: 4px 8px; border-radius: 8px; background: rgba(0, 0, 0, .55); color: #fff; font: 11px/1.4 monospace; white-space: pre; pointer-events: none; display: none; }
  #error { position: fixed; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom) + 60px); padding: 8px 10px; border-radius: 10px; background: rgba(180, 30, 30, .92); color: #fff; font-size: 12px; white-space: pre-wrap; display: none; pointer-events: none; }
</style>
</head>
<body>
  <div id="stick-base" class="stick"></div>
  <div id="stick-knob" class="stick"></div>
  <div id="hud">
    <div id="wood-pill" class="pill">🪵 <span id="wood">0</span></div>
    <div id="meat-pill" class="pill hide">🍖 <span id="meat">0</span></div>
    <div id="bld-pill" class="pill">🏠 <span id="bld">1</span></div>
    <div id="pop-pill" class="pill hide">👥 <span id="pop">0</span></div>
  </div>
  <div id="toast"></div>
  <div id="hint">なぞって移動(PCは WASD・矢印キー)</div>
  <div id="arrow">➤</div>
  <div id="version"></div>
  <div id="debug"></div>
  <div id="error"></div>

<script type="module">
  import * as THREE from '../vendor/three.module.min.js';

  // ================================================================
  //  設定(テンポ・気持ちよさの数字)
  // ================================================================
  const GAME_VERSION = '2026.11.13-s1';
  const FX = { shake: 1, particles: 1, volume: 1 };            // 演出の強さ(重いときは粒が自動で減る)
  const PLAYER_CFG = { speed: 7.5, accel: 16, radius: 0.4, reach: 1.35 };
  const MAGNET = { radius: 7.5, settle: 0.42, gap: 0.05, minGap: 0.022 }; // 吸い寄せ: 範囲・地面で止まる時間・1個ずつの間隔
  const STACK = {                                             // 背中の積荷(段ごとに向きを変えて井桁に積む)
    wood: { per: 3, gap: 0.29, layerH: 0.27, max: 150 },
    meat: { per: 2, gap: 0.36, layerH: 0.31, max: 100 },
  };
  const DELIVER = { gap: 0.07, minGap: 0.016, speedUp: 0.92, flight: 0.3 }; // 納品: 最初の間隔・最短・だんだん速く・飛ぶ時間
  const WORLD = { x1: -15, x2: 21, z1: -21, z2: 9 };
  const ZOOM_BASE = 14;
  const RES_ICON = { wood: '🪵', meat: '🍖' };

  // エリア(rect = x1, z1, x2, z2)。開くまで中に入れない。edges = 雪の吹きだまりの柵を置く線
  const AREAS = {
    forest: { name: '奥の森', rect: [-15, -21, 8, -7], edges: [[-15, -7, 8, -7]] },
    hunt: { name: '東の雪原', rect: [8, -7, 21, 9], edges: [[8, -7, 8, 9]] },
    bear: { name: '北東の雪原', rect: [8, -21, 21, -7], edges: [[8, -21, 8, -7], [8, -7, 21, -7]] },
  };

  // ================================================================
  //  シナリオ(データだけで、木の本数・資材の数・建物・演出の順番を変えられる)
  //   after: このシーンが終わったら始まる / delay: その何秒後
  //   enter: 始まったときの出来事 / goal: 完了条件 / exit: 終わったときの出来事
  //   goal.type: 'clear' = tag の対象を全部倒して、資材を全部拾った / 'build' = 建築エリアの建物が全部建った / 'none' = 終わらない
  // ================================================================
  const SCENARIO = [
    { id: 'scene_01', title: '最初の伐採', after: null,
      enter: [
        { do: 'place', building: 'hut' },
        { do: 'spawn', what: 'tree', tag: 'first', hits: 2, chop: 0.38, drops: { wood: 6 }, at: [[2.6, 4.6], [4.3, 2.2], [2.3, 0.2]] },
        { do: 'spawn', what: 'tree', tag: 'forest', hits: 2, chop: 0.27, drops: { wood: 9 }, at: [[-3, -9.6], [-0.4, -10.9], [2.3, -9.7], [5, -10.6], [-1.8, -13.1], [1, -13.7], [3.8, -13.1], [6.2, -14]] },
        { do: 'zoom', level: 1 },
      ],
      goal: { type: 'clear', tag: 'first' } },
    { id: 'scene_02', title: '最初の建築', after: 'scene_01',
      enter: [{ do: 'site', id: 'camp', at: [-2.2, 1.2], res: 'wood', need: 18, build: ['campfire', 'storage'] }],
      goal: { type: 'build', site: 'camp' },
      exit: [{ do: 'zoom', level: 1.08 }] },
    { id: 'scene_03', title: '森の大量伐採', after: 'scene_02', delay: 0.3,
      enter: [
        { do: 'unlock', area: 'forest' },
        { do: 'camera', focus: [1.5, -11], hold: 1.3 },
        { do: 'toast', text: '🌲 奥の森がひらけた!' },
      ],
      goal: { type: 'clear', tag: 'forest' } },
    { id: 'scene_04', title: '住宅建築ラッシュ', after: 'scene_03',
      enter: [{ do: 'site', id: 'town', at: [-7.4, -0.4], res: 'wood', need: 72, build: ['house1', 'house2', 'warehouse'] }],
      goal: { type: 'build', site: 'town' },
      exit: [
        { do: 'villagers', n: 4, from: ['house1', 'house2', 'warehouse', 'hut'] },
        { do: 'zoom', level: 1.25 },
        { do: 'toast', text: '🏘️ 村ができてきた!' },
      ] },
    { id: 'scene_05', title: '狼の狩り', after: 'scene_04', delay: 0.6,
      enter: [
        { do: 'unlock', area: 'hunt' },
        { do: 'spawn', what: 'wolf', tag: 'wolves', hits: 2, chop: 0.3, drops: { meat: 10 }, at: [[12.6, -1.6], [15.2, 2], [12.4, 4.6]] },
        { do: 'camera', focus: [12, 1.5], hold: 1.3 },
        { do: 'toast', text: '🐺 東の雪原に狼があらわれた!' },
      ],
      goal: { type: 'clear', tag: 'wolves' } },
    { id: 'scene_06', title: '調理場の建築', after: 'scene_05',
      enter: [{ do: 'site', id: 'kitchen', at: [4.2, -1.6], res: 'meat', need: 30, build: ['kitchen'] }],
      goal: { type: 'build', site: 'kitchen' },
      exit: [
        { do: 'smoke', buildings: ['kitchen', 'house1', 'house2'] },
        { do: 'lights' },
        { do: 'dusk', k: 1 },
        { do: 'villagers', n: 6, from: ['kitchen', 'house1', 'house2', 'warehouse'] },
        { do: 'zoom', level: 1.4 },
        { do: 'toast', text: '🍲 調理場が完成! 村がにぎやかに!' },
      ] },
    { id: 'scene_07', title: '大きな熊', after: 'scene_06', delay: 2.2,
      enter: [
        { do: 'unlock', area: 'bear' },
        { do: 'spawn', what: 'bear', tag: 'bear', at: [[15, -14]] },
        { do: 'camera', focus: [14, -12], hold: 2.2 },
        { do: 'toast', text: '🐻 遠くの雪原に、大きな熊が…!' },
        { do: 'freeplay' },
        { do: 'stockpile', res: 'wood', at: [-4.6, 0.9], piles: [[-6.6, 0.1], [-6.6, 1.3], [-7.6, 0.1], [-7.6, 1.3], [-8.6, 0.1], [-8.6, 1.3]], layers: 12, delay: 2.5 },
      ],
      goal: { type: 'none' } },
  ];

  const STICK_RADIUS = 56;
  const $ = (id) => document.getElementById(id);
  $('version').textContent = '❄️ v' + GAME_VERSION;
  const DEBUG = /[?&]debug/.test(location.search);

  const errorsSeen = [];
  function reportError(where, err) {
    const text = where + ': ' + (err && err.message ? err.message : String(err));
    if (errorsSeen.includes(text)) return;
    errorsSeen.push(text);
    console.error(where, err);
    const stack = err && err.stack ? '\n' + String(err.stack).split('\n').slice(0, 3).join('\n') : '';
    $('error').textContent = 'エラー(v' + GAME_VERSION + ') ' + text + stack;
    $('error').style.display = 'block';
  }
  window.addEventListener('error', (e) => reportError('window', e.error || e.message));
  window.addEventListener('unhandledrejection', (e) => reportError('promise', e.reason));
  function safe(name, fn) { try { fn(); } catch (err) { reportError(name, err); } }

  // ================================================================
  //  3Dの土台(影は使わず、丸い影で軽く)
  // ================================================================
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  document.body.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  const SKY_DAY = new THREE.Color('#cfe2f0'), SKY_DUSK = new THREE.Color('#e9b9a8');
  scene.background = SKY_DAY.clone();
  scene.fog = new THREE.Fog(SKY_DAY.clone(), 38, 80);
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
  let portrait = false;
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    portrait = w < h;
    camera.fov = portrait ? 60 : 42;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();
  const hemi = new THREE.HemisphereLight('#f4f8ff', '#9db4c8', 1.9);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight('#fff6e8', 1.5);
  sun.position.set(-12, 30, 18);
  scene.add(sun);

  const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
  const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _p = new THREE.Vector3(), _s = new THREE.Vector3(), tmpA = new THREE.Vector3(), _col = new THREE.Color();
  function setInst(mesh, i, x, y, z, sx, sy, sz, ry = 0, rx = 0, rz = 0) {
    _q.setFromEuler(_e.set(rx, ry, rz, 'YXZ'));
    mesh.setMatrixAt(i, _m4.compose(_p.set(x, y, z), _q, _s.set(sx, sy, sz)));
  }
  const M = (x = 0, y = 0, z = 0, sx = 1, sy = 1, sz = 1, rx = 0, ry = 0, rz = 0) =>
    new THREE.Matrix4().compose(V(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), V(sx, sy, sz));
  // いくつかの形を1つにまとめる(色は頂点に焼きこむ)。描く回数を減らして軽くする
  function mergeGeometries(list) {
    let count = 0;
    const gs = list.map(({ geo, m }) => { const g = (geo.index ? geo.toNonIndexed() : geo.clone()).applyMatrix4(m); count += g.attributes.position.count; return g; });
    const pos = new Float32Array(count * 3), nor = new Float32Array(count * 3), col = new Float32Array(count * 3);
    let o = 0;
    gs.forEach((g, gi) => {
      const n = g.attributes.position.count;
      pos.set(g.attributes.position.array, o * 3);
      nor.set(g.attributes.normal.array, o * 3);
      const c = new THREE.Color(list[gi].color || '#ffffff');
      for (let i = 0; i < n; i++) col.set([c.r, c.g, c.b], (o + i) * 3);
      o += n;
      g.dispose();
    });
    const out = new THREE.BufferGeometry();
    out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    out.setAttribute('color', new THREE.BufferAttribute(col, 3));
    return out;
  }
  function canvasTexture(size, draw, repeat = 1) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    draw(c.getContext('2d'), size);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    if (repeat !== 1) { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(repeat, repeat); }
    return tex;
  }
  const vcMat = new THREE.MeshLambertMaterial({ vertexColors: true });
  const windowMat = new THREE.MeshLambertMaterial({ color: '#5a7894', emissive: '#000000' });
  const ghostMat = new THREE.MeshBasicMaterial({ color: '#9fe0ff', transparent: true, opacity: 0.22, depthWrite: false });
  const Box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
  const Cyl = (rt, rb, h, s = 10) => new THREE.CylinderGeometry(rt, rb, h, s);
  const Sph = (r, w = 12, h = 10, ...rest) => new THREE.SphereGeometry(r, w, h, ...rest);
  const Cone = (r, h, s = 9) => new THREE.ConeGeometry(r, h, s);
  const blobGeo = new THREE.CircleGeometry(1, 20);
  const blobMat = new THREE.MeshBasicMaterial({ color: '#4a6a8a', transparent: true, opacity: 0.22, depthWrite: false });
  function blob(r, parent = scene) { const m = new THREE.Mesh(blobGeo, blobMat); m.rotation.x = -Math.PI / 2; m.scale.setScalar(r); m.position.y = 0.03; parent.add(m); return m; }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const backOut = (t) => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  function bounceOut(t) {
    const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t;
    if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375;
    return n * (t -= 2.625 / d) * t + 0.984375;
  }

  // ================================================================
  //  地面・遠くの山・まわりの森・雪
  // ================================================================
  {
    const tex = canvasTexture(256, (g, n) => {
      g.fillStyle = '#f2f7fb'; g.fillRect(0, 0, n, n);
      for (let i = 0; i < 260; i++) { g.fillStyle = i % 3 ? 'rgba(160,190,215,.10)' : 'rgba(255,255,255,.7)'; const r = 2 + Math.random() * 7; g.beginPath(); g.arc(Math.random() * n, Math.random() * n, r, 0, 7); g.fill(); }
    }, 14);
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(160, 120), new THREE.MeshLambertMaterial({ map: tex }));
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(3, 0, -6);
    scene.add(ground);
    // 遠くの山(大きな白い三角)
    const mtn = [];
    for (let i = 0; i < 14; i++) {
      const x = -50 + i * 8 + Math.random() * 4, z = -48 - Math.random() * 10, h = 12 + Math.random() * 14;
      mtn.push({ geo: Cone(8 + Math.random() * 5, h, 7), m: M(x, h / 2 - 1, z), color: i % 2 ? '#b9cadb' : '#c9d7e5' });
      mtn.push({ geo: Cone(3.6, h * 0.36, 7), m: M(x, h - h * 0.18 - 1, z + 0.4), color: '#ffffff' });
    }
    scene.add(new THREE.Mesh(mergeGeometries(mtn), vcMat));
  }
  // 木の形(切れる木・飾りの木で共通)。根元の切り株と、倒れる上の部分に分ける
  const STUMP_H = 0.35;
  const stumpGeo = mergeGeometries([
    { geo: Cyl(0.27, 0.32, STUMP_H, 10), m: M(0, STUMP_H / 2, 0), color: '#6b4426' },
    { geo: Cyl(0.25, 0.25, 0.03, 10), m: M(0, STUMP_H + 0.01, 0), color: '#e6bd85' },
  ]);
  const treeTopGeo = mergeGeometries([
    { geo: Cyl(0.2, 0.26, 1.4, 8), m: M(0, 0.7, 0), color: '#6b4426' },
    { geo: Cone(1.45, 1.7, 9), m: M(0, 1.75, 0), color: '#2e6a4b' },
    { geo: Cone(1.0, 0.42, 9), m: M(0, 2.42, 0), color: '#f4f8fc' },
    { geo: Cone(1.15, 1.45, 9), m: M(0, 2.55, 0), color: '#357a55' },
    { geo: Cone(0.8, 0.38, 9), m: M(0, 3.12, 0), color: '#f4f8fc' },
    { geo: Cone(0.82, 1.25, 9), m: M(0, 3.25, 0), color: '#3d885e' },
    { geo: Cone(0.42, 0.5, 9), m: M(0, 3.68, 0), color: '#ffffff' },
  ]);
  const decorTreeGeo = mergeGeometries([
    { geo: Cyl(0.27, 0.32, 0.6, 8), m: M(0, 0.3, 0), color: '#5d3b22' },
    { geo: Cone(1.45, 1.7, 9), m: M(0, 1.35, 0), color: '#2b6045' },
    { geo: Cone(1.0, 0.42, 9), m: M(0, 2.02, 0), color: '#eef4fa' },
    { geo: Cone(1.15, 1.45, 9), m: M(0, 2.15, 0), color: '#326e4e' },
    { geo: Cone(0.8, 0.38, 9), m: M(0, 2.72, 0), color: '#eef4fa' },
    { geo: Cone(0.82, 1.25, 9), m: M(0, 2.85, 0), color: '#3a7b56' },
    { geo: Cone(0.42, 0.5, 9), m: M(0, 3.28, 0), color: '#ffffff' },
  ]);
  {
    // まわりの森(切れない飾り。1回で描く)
    const spots = [];
    for (let i = 0; i < 900 && spots.length < 230; i++) {
      const x = WORLD.x1 - 9 + Math.random() * (WORLD.x2 - WORLD.x1 + 18), z = WORLD.z1 - 12 + Math.random() * (WORLD.z2 - WORLD.z1 + 16);
      const out = x < WORLD.x1 - 0.5 || x > WORLD.x2 + 0.5 || z < WORLD.z1 - 0.5 || z > WORLD.z2 + 1.5;
      if (!out || z > WORLD.z2 - 1) continue; // 手前(カメラ側)には置かない。画面をふさぐので
      if (spots.some(([a, b]) => Math.hypot(a - x, b - z) < 1.9)) continue;
      spots.push([x, z]);
    }
    const trees = new THREE.InstancedMesh(decorTreeGeo, vcMat, spots.length);
    spots.forEach(([x, z], i) => { const s = 0.9 + Math.random() * 0.7; setInst(trees, i, x, 0, z, s, s * (0.9 + Math.random() * 0.4), s, Math.random() * 6); });
    scene.add(trees);
    // 雪のこんもりと岩(飾り)
    const mounds = [], rocks = [];
    for (let i = 0; i < 40; i++) {
      const x = WORLD.x1 + Math.random() * (WORLD.x2 - WORLD.x1), z = WORLD.z1 + Math.random() * (WORLD.z2 - WORLD.z1);
      if (Math.hypot(x + 2, z - 1) < 9) continue;
      (i % 3 ? mounds : rocks).push([x, z, 0.5 + Math.random()]);

            else { it.vy = 0; it.vx *= 0.8; it.vz *= 0.8; }
            it.rx *= 0.5; it.spin *= 0.5;
          }
          if (it.t > MAGNET.settle && it.y <= 0.14) { it.st = 'ground'; it.t = 0; it.rx = 0; }
        } else if (it.st === 'ground') {

  // ================================================================

  function createSite(a) {

  // 倉庫の置き場: 井桁の山を順番に積んでいく(見た目の上限をこえた分は数だけ)

  function updateSites(dt) {

  // ---- 建物が組み上がる ----

  const PART_DUR = 0.3;
  function construct(id, instant, site) {

  const VMAX = 30;

  function villagerPoints() {

  function spawnVillagers(n, from) {

  function updateVillagers(dt) {

  // ================================================================

  // ================================================================
  //  プレイヤーの更新(移動・ぶつかり・自動で斧を振る)

  function pushOut(o, rad, skipTrees) {
    for (const id in built) {
      const [x1, z1, x2, z2] = built[id].box;
      const px = clamp(o.x, x1, x2), pz = clamp(o.z, z1, z2);

  function updatePlayer(dt) {

    player.vz += (iz * PLAYER_CFG.speed - player.vz) * Math.min(1, dt * PLAYER_CFG.accel);
    const r = PLAYER_CFG.radius;

  // ================================================================

  // 次の行き先: 運べる資材があれば建築エリア → いちばん近い木・狼・落ちている資材 → 熊
  function guideTarget() {

  const marker = new THREE.Mesh(Cone(0.45, 0.9, 12), new THREE.MeshBasicMaterial({ color: '#ffd23a' }));

  // ================================================================
  //  カメラ(プレイヤーを追う。シナリオの出来事で、見せたい場所へ寄って引く)

    zoom += (zt - zoom) * Math.min(1, dt * 1.6);
    const w = cam.fw * 0.8;
    const tx = lerp(player.x + player.vx * 0.12, cam.fx, w), tz = lerp(player.z + player.vz * 0.12, cam.fz, w);
    cam.x += (tx - cam.x) * Math.min(1, dt * 5);
    cam.z += (tz - cam.z) * Math.min(1, dt * 5);
    const D = ZOOM_BASE * zoom * (portrait ? 1.3 : 1);
    camera.position.set(cam.x, D * 0.95, cam.z + D * 0.72);
    camera.lookAt(cam.x, 1.0, cam.z - (portrait ? 2.8 : 0.8)); // 縦画面は少し先(奥)まで見せる
    if (shakeT > 0) { shakeT = Math.max(0, shakeT - dt); camera.position.x += (Math.random() - 0.5) * shakeT * 1.4; camera.position.y += (Math.random() - 0.5) * shakeT * 1.4; }
  }

  // ================================================================
  //  効果(粒・けむり・輪・雪・夕暮れ・窓の明かり)
  // ================================================================
  function updateFx(dt) {
    let i = 0;
    gibs.items = gibs.items.filter(g => (g.t += dt) < g.life);
    for (const g of gibs.items) {
      g.vy -= 20 * dt; g.x += g.vx * dt; g.y += g.vy * dt; g.z += g.vz * dt; g.r += dt * 10;
      if (g.y < 0.08) { g.y = 0.08; g.vy *= -0.3; g.vx *= 0.6; g.vz *= 0.6; }
      const s = g.sc * Math.min(1, (g.life - g.t) * 4);
      setInst(gibs.mesh, i, g.x, g.y, g.z, s, s, s, g.r, g.r);
      gibs.mesh.setColorAt(i, _col.set(g.color));
      i++;
    }
    gibs.mesh.count = i; gibs.mesh.instanceMatrix.needsUpdate = true;
    if (gibs.mesh.instanceColor) gibs.mesh.instanceColor.needsUpdate = true;
    i = 0;
    puffs.items = puffs.items.filter(p => (p.t += dt) < p.life);
    for (const p of puffs.items) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      p.vx *= 1 - dt * 2.5; p.vz *= 1 - dt * 2.5;
      const k = p.t / p.life;
      const s = p.size * (p.grow ? 1 + k * p.grow : 0.6 + k * 0.8) * Math.min(1, (1 - k) * 3) * Math.min(1, p.t * 10);
      setInst(puffs.mesh, i, p.x, p.y, p.z, s, s, s);
      puffs.mesh.setColorAt(i, _col.set(p.color));
      i++;
    }
    puffs.mesh.count = i; puffs.mesh.instanceMatrix.needsUpdate = true;
    if (puffs.mesh.instanceColor) puffs.mesh.instanceColor.needsUpdate = true;
    i = 0;
    rings.items = rings.items.filter(r => (r.t += dt) < r.life);
    for (const r of rings.items) {
      const k = r.t / r.life, s = r.r1 * (0.2 + k * 0.8);
      setInst(rings.mesh, i, r.x, 0.12, r.z, s, s, s, 0, -Math.PI / 2);
      rings.mesh.setColorAt(i, _col.set(r.color).multiplyScalar(1 - k));
      i++;
    }
    rings.mesh.count = i; rings.mesh.instanceMatrix.needsUpdate = true;
    if (rings.mesh.instanceColor) rings.mesh.instanceColor.needsUpdate = true;
    // 広場が広がる
    plazaShown += (plazaR - plazaShown) * Math.min(1, dt * 1.5);
    plaza.scale.set(plazaShown, plazaShown, 1);
    // 夕暮れと窓の明かり
    dusk += (duskTarget - dusk) * Math.min(1, dt * 0.5);
    lightsOn += (lightsTarget - lightsOn) * Math.min(1, dt * 1.5);
    scene.background.copy(SKY_DAY).lerp(SKY_DUSK, dusk * 0.8);
    scene.fog.color.copy(scene.background);
    hemi.intensity = 1.9 - dusk * 0.55;
    sun.color.setRGB(1, 0.96 - dusk * 0.18, 0.9 - dusk * 0.3);
    windowMat.emissive.setRGB(1.0 * lightsOn, 0.72 * lightsOn, 0.28 * lightsOn);
    windowMat.color.setRGB(0.35 + lightsOn * 0.65, 0.47 + lightsOn * 0.45, 0.58 - lightsOn * 0.1);
  }
  function updateSnow(dt) {
    for (let i = 0; i < FLAKES; i++) {
      const f = flakes[i];
      f.y -= dt * f.s; f.x += Math.sin(gt + f.ph) * dt * 0.3;
      if (f.y < 0) { f.y = 14; f.x = (Math.random() - 0.5) * 44; f.z = (Math.random() - 0.5) * 34; }
      setInst(flakeMesh, i, cam.x + f.x, f.y, cam.z + f.z - 4, 1, 1, 1, f.ph);
    }
    flakeMesh.instanceMatrix.needsUpdate = true;
  }

  // ================================================================
  //  メインループ
  // ================================================================
  function logic(dt) {
    gt += dt;
    if (started) elapsed += dt;
    sfxTick(dt);
    for (let i = timers.length - 1; i >= 0; i--) if (gt >= timers[i].at) { const t = timers[i]; timers.splice(i, 1); safe('timer', t.fn); }
    safe('scenario', updateScenario);
    safe('supply', () => ensureSupply(dt));
    safe('player', () => updatePlayer(dt));
    safe('targets', () => updateTargets(dt));
    safe('drops', () => updateDrops(dt));
    safe('stacks', () => updateStacks(dt));
    safe('sites', () => updateSites(dt));
    safe('build', () => { updateConstructions(dt); updateBuildings(dt); });
    safe('villagers', () => updateVillagers(dt));
    safe('areas', () => updateAreas(dt));
    safe('fx', () => updateFx(dt));
  }
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    logic(dt);
    safe('camera', () => updateCamera(dt));
    safe('snow', () => updateSnow(dt));
    safe('hud', () => { updateHud(dt); updateGuide(); });
    safe('render', () => renderer.render(scene, camera));
    adaptQuality(now);
  }
  // 重いとき(1秒に40コマ未満)は、画面の細かさと粒の量を下げる
  let qFrames = 0, qStart = performance.now(), pixelRatio = renderer.getPixelRatio();
  const NO_ADAPT = /[?&]noadapt/.test(location.search);
  function adaptQuality(now) {
    if (NO_ADAPT) return;
    qFrames++;
    const el = now - qStart;
    if (el < 2500) return;
    const fps = qFrames / (el / 1000);
    qFrames = 0; qStart = now;
    if (document.hidden) return;
    if (fps < 40) {
      if (pixelRatio > 1) { pixelRatio = Math.max(1, pixelRatio - 0.25); renderer.setPixelRatio(pixelRatio); resize(); }
      else FX.particles = Math.max(0.3, FX.particles - 0.2);
    }
  }
  document.addEventListener('visibilitychange', () => { last = performance.now(); qStart = last; qFrames = 0; });
  renderer.domElement.addEventListener('webglcontextlost', (e) => { e.preventDefault(); $('hint').textContent = '画面が止まりました。ページを再読み込みしてください'; $('hint').style.opacity = 1; });
  updateCamera(1);
  requestAnimationFrame(frame);

  // 自動テスト・デバッグ用(URL に ?debug を付けると、右上に進み具合が出る)
  window.__renderer = renderer;
  window.__game = {
    get state() {
      return { gt, elapsed, carried: { ...carried }, scenes: SCN.log.map(l => ({ ...l })), active: SCN.active.map(s => s.id), buildings: Object.keys(built).filter(k => built[k].done),
        villagers: villagers.length, targets: targets.filter(t => !t.gone).map(t => t.type + ':' + t.tag), drops: drops.wood.items.length + drops.meat.items.length,
        sites: Object.fromEntries(Object.values(sites).map(s => [s.id, s.paid + '/' + s.need + (s.done ? ' done' : s.building ? ' building' : '')])),
        unlocked: Object.keys(unlocked), errors: errorsSeen.slice(), x: player.x, z: player.z, calls: renderer.info.render.calls, fx: FX.particles };
    },
    bot(on) { bot = on; },
    fastForward(sec, step = 1 / 30) { fastForwarding = true; try { for (let t = 0; t < sec; t += step) logic(step); } finally { fastForwarding = false; } return this.state; },
    teleport(x, z) { player.x = x; player.z = z; },
  };
</script>
</body>
</html>
