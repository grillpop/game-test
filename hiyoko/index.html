<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ひよこ100万羽">
<meta name="theme-color" content="#bfe7a0">
<title>ひよこ100万羽</title>
<style>
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: #bfe7a0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  .stick { position: fixed; border-radius: 50%; pointer-events: none; display: none; transform: translate(-50%, -50%); }
  #stick-base { width: 112px; height: 112px; background: rgba(255, 255, 255, .3); border: 3px solid rgba(255, 255, 255, .7); }
  #stick-knob { width: 52px; height: 52px; background: rgba(255, 255, 255, .95); box-shadow: 0 2px 6px rgba(0, 0, 0, .25); }

  /* 画面上の表示 */
  #hud {
    position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: 10px; right: 10px;
    display: flex; gap: 6px; align-items: stretch; pointer-events: none;
  }
  .pill {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(40, 50, 30, .5); border: 1px solid rgba(255, 255, 255, .2);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    color: #fff; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  #chick-pill { flex: 1.6; font-size: 20px; background: rgba(240, 160, 20, .82); }
  #chick-pill.pop { animation: pop .25s ease-out; }
  @keyframes pop { 50% { transform: scale(1.12); } }
  #feed-pill, #parts-pill { flex: 1; }
  /* 次の目標(100羽 → 1,000羽 → … → 100万羽) */
  #goal {
    position: fixed; top: calc(env(safe-area-inset-top) + 50px); left: 10px; right: 10px;
    display: flex; align-items: center; gap: 8px; padding: 3px 10px; border-radius: 999px;
    background: rgba(40, 50, 30, .45); color: #fff; font-size: 13px; font-weight: 800; pointer-events: none; white-space: nowrap;
  }
  #goal-bar { flex: 1; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .25); overflow: hidden; }
  #goal-fill { height: 100%; width: 0; background: linear-gradient(90deg, #ffe066, #ff9f1c); transition: width .2s; }
  #reset {
    position: fixed; left: 8px; bottom: calc(env(safe-area-inset-bottom) + 6px);
    padding: 4px 10px; border: 0; border-radius: 10px; background: rgba(40, 50, 30, .35); color: rgba(255, 255, 255, .85); font-size: 12px; font-weight: 700;
  }
  #combo {
    position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 86px);
    text-align: center; pointer-events: none; color: #fff; font-weight: 900; font-size: 30px;
    text-shadow: 0 2px 0 #d9480f, 0 4px 10px rgba(0, 0, 0, .35); opacity: 0; transition: opacity .3s;
  }
  #combo.show { opacity: 1; }
  #combo.bump { animation: bump .18s ease-out; }
  @keyframes bump { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
  #toast {
    position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 130px);
    text-align: center; pointer-events: none; color: #fff; font-size: 22px; font-weight: 900;
    text-shadow: 0 2px 0 #b45309, 0 4px 8px rgba(0, 0, 0, .35);
    opacity: 0; transform: scale(.8); transition: opacity .2s, transform .2s;
  }
  #toast.show { opacity: 1; transform: scale(1); }
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 44px);
    text-align: center; pointer-events: none; color: #fff; font-size: 17px; font-weight: 800;
    text-shadow: 0 2px 4px rgba(0, 0, 0, .5); transition: opacity .4s;
  }
  .pop-text {
    position: fixed; pointer-events: none; transform: translate(-50%, -50%); white-space: nowrap;
    font-weight: 900; font-size: 18px; color: #fff; text-shadow: 0 2px 0 rgba(120, 60, 0, .8), 0 3px 6px rgba(0, 0, 0, .4);
    display: none;
  }
  .pop-text.minus { color: #ff5a4a; text-shadow: 0 2px 0 rgba(90, 10, 0, .9), 0 3px 6px rgba(0, 0, 0, .4); }
  #stage-title {
    position: fixed; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none; z-index: 15;
    color: #fff; text-shadow: 0 3px 0 rgba(0, 0, 0, .35), 0 6px 16px rgba(0, 0, 0, .35); opacity: 0;
  }
  #stage-title.show { animation: stagein 2.8s ease-out forwards; }
  #stage-title small { display: block; font-size: 20px; font-weight: 800; }
  #stage-title b { display: block; font-size: 40px; font-weight: 900; }
  @keyframes stagein { 0% { opacity: 0; transform: scale(1.6); } 12% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(.95); } }
  .foe-arrow {
    position: fixed; display: none; width: 34px; height: 34px; margin: -17px 0 0 -17px; pointer-events: none;
    font-size: 26px; line-height: 34px; text-align: center; color: #ff4d3a; text-shadow: 0 0 3px #400, 0 2px 4px rgba(0, 0, 0, .5);
  }
  /* 3択の強化 */
  #cards { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(20, 30, 10, .55); }
  #cards.show { display: flex; }
  #cards .box { width: min(92vw, 380px); text-align: center; color: #fff; animation: cardin .35s cubic-bezier(.2, 1.6, .4, 1); }
  #cards h2 { font-size: 22px; margin-bottom: 12px; text-shadow: 0 2px 4px rgba(0, 0, 0, .5); }
  .card-btn {
    display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 10px; padding: 12px 14px; border: 0; border-radius: 16px;
    background: #fffbea; color: #5a3a10; text-align: left; box-shadow: 0 4px 0 #d9b25a; font-family: inherit;
  }
  .card-btn b { display: block; font-size: 18px; }
  .card-btn span { font-size: 13px; font-weight: 700; color: #8a6a3a; }
  .card-btn i { font-style: normal; font-size: 34px; }
  .hp-bar {
    position: fixed; width: 44px; height: 6px; margin-left: -22px; border-radius: 3px;
    background: rgba(0, 0, 0, .35); overflow: hidden; pointer-events: none; display: none;
  }
  .hp-bar div { height: 100%; background: #ff5a3c; }
  #arrow {
    position: fixed; display: none; width: 44px; height: 44px; margin: -22px 0 0 -22px;
    font-size: 34px; line-height: 44px; text-align: center; color: #ffd23f;
    text-shadow: 0 0 3px #7a4a10, 0 2px 4px rgba(0, 0, 0, .5); pointer-events: none;
  }
  #village-sign {
    position: fixed; transform: translate(-50%, -100%); pointer-events: none; white-space: nowrap; display: none;
    padding: 4px 12px; border-radius: 12px; background: rgba(255, 190, 30, .92); color: #5a3000;
    font-size: 16px; font-weight: 900; box-shadow: 0 2px 6px rgba(0, 0, 0, .25);
  }
  #village-sign.bump { animation: pop .3s ease-out; }
  #version { position: fixed; right: 8px; bottom: calc(env(safe-area-inset-bottom) + 6px); color: rgba(30, 60, 20, .55); font-size: 11px; pointer-events: none; }
  #error {
    position: fixed; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom) + 70px);
    padding: 8px 10px; border-radius: 10px; background: rgba(180, 30, 30, .9); color: #fff;
    font-size: 12px; white-space: pre-wrap; display: none; pointer-events: none;
  }
  #result {
    position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(30, 40, 20, .5);
  }
  #result.show { display: flex; }
  #result .card {
    width: min(86vw, 360px); padding: 22px 20px 18px; border-radius: 22px; background: #fffbea; color: #5a3a10;
    text-align: center; box-shadow: 0 8px 24px rgba(0, 0, 0, .35); animation: cardin .45s cubic-bezier(.2, 1.6, .4, 1);
  }
  @keyframes cardin { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #result h1 { font-size: 22px; color: #c2410c; }
  #result .big { font-size: 46px; font-weight: 900; margin: 6px 0 10px; color: #e08a00; }
  #result .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-bottom: 14px; font-size: 15px; font-weight: 800; }
  #result .stats div { background: #f6ead0; border-radius: 10px; padding: 6px 4px; }
  #result button { display: block; width: 100%; margin-top: 8px; padding: 12px; border: 0; border-radius: 14px; font-size: 18px; font-weight: 900; }
  #keep { background: #ff9f1c; color: #fff; box-shadow: 0 3px 0 #c2410c; }
  #result.fail h1 { color: #4a5a7a; }
  #again { background: #ece2c6; color: #6a4a2c; font-size: 15px !important; }
</style>
</head>
<body>
  <div id="stick-base" class="stick"></div>
  <div id="stick-knob" class="stick"></div>
  <div id="hud">
    <div id="chick-pill" class="pill">🐤 <span id="chicks">0</span></div>
    <div id="feed-pill" class="pill">🌾 <span id="feed">0</span></div>
    <div id="parts-pill" class="pill">⚙️ <span id="parts">0</span></div>
  </div>
  <div id="goal"><span id="goal-text">🎯 100羽</span><div id="goal-bar"><div id="goal-fill"></div></div></div>
  <div id="combo"></div>
  <div id="toast"></div>
  <div id="hint">画面をなぞって ひよこを動かそう</div>
  <div id="arrow">➤</div>
  <div id="village-sign"></div>
  <div id="version"></div>
  <div id="error"></div>
  <button id="reset" type="button">ステージ1から</button>
  <div id="stage-title"><small id="st-small"></small><b id="st-name"></b></div>
  <div id="cards"><div class="box"><h2>⭐ 強化を1つ えらぼう</h2><div id="card-list"></div></div></div>
  <div id="result"><div class="card">
    <h1 id="r-title">🎉 ステージ1 クリア!</h1>
    <div class="big">🐤 <span id="r-chicks">0</span>羽</div>
    <div class="stats">
      <div>📦 <span id="r-broken">0</span>こ</div>
      <div><span id="r-foe-icon">🦊</span> <span id="r-foxes">0</span>匹 撃退</div>
      <div>🔥 <span id="r-combo">0</span>コンボ</div>
      <div>⏱ <span id="r-time">0</span></div>
    </div>
    <button id="keep" type="button">次のステージへ ▶</button>
    <button id="again" type="button">ステージ1から</button>
  </div></div>

<script type="module">
  import * as THREE from '../vendor/three.module.min.js';

  // ================================================================
  //  設定(ここの数字を変えると、テンポや爽快感を調整できます)
  // ================================================================
  // ステージ: 1回3分。2分たつとボス(巨大キツネ)が来る。3分以内に倒せばクリア
  const STAGE_TIME = 180, BOSS_AT = 120;
  const STAGE_KEY = 'hiyoko-stage-v1'; // 今のステージの番号を保存する名前(雪のキャンプとは別)
  let stage = 1;
  try { stage = Math.max(1, Math.floor(+localStorage.getItem(STAGE_KEY)) || 1); } catch (e) { stage = 1; }
  const SK = stage - 1; // ステージが進むほど敵が強くなる
  // ステージごとの雰囲気(4つをくり返す。2周目からは「春の原っぱ 2」のように名前に番号がつく)
  const THEMES = [
    { name: '🌱 春の原っぱ', sky: '#bfe7a0', grass: ['#9fd977', '#93cf6b'], leaf: '#4caf50', trunk: '#8a5a30', flowers: ['#ffffff', '#ffe066', '#ff9ec7'],
      hemi: ['#fffbe8', '#7a9a50', 1.6], sun: ['#fff1d0', 2.0], tint: '#ffffff', weather: 'petals', enemy: 'fox', fog: [45, 95], skin: 'spring' },
    { name: '🌅 夕焼けの丘', sky: '#f4a97f', grass: ['#c8c068', '#bcb45c'], leaf: '#e07b2a', trunk: '#7a4a26', flowers: ['#ffd166', '#ff8a5b', '#ffffff'],
      hemi: ['#ffd2a8', '#8a5a3a', 1.35], sun: ['#ffa060', 2.2], tint: '#ffe0c0', weather: 'leaves', enemy: 'crow', fog: [40, 90], skin: 'sunset' },
    { name: '❄️ 雪の原っぱ', sky: '#d3e4f4', grass: ['#f2f6fb', '#e4ecf6'], leaf: '#2f6f5a', trunk: '#6a4a30', flowers: ['#ffffff', '#cfe9ff', '#ffffff'],
      hemi: ['#eef6ff', '#8a9ab8', 1.5], sun: ['#ffffff', 1.9], tint: '#eaf2ff', weather: 'snow', enemy: 'wolf', fog: [35, 85], skin: 'snow' },
    { name: '🌙 夜の森', sky: '#24305a', grass: ['#3a6a48', '#335f40'], leaf: '#1d4a38', trunk: '#4a3420', flowers: ['#fff6a0', '#a0e0ff', '#ffffff'],
      hemi: ['#9aa8ea', '#2a3648', 1.25], sun: ['#c4d0ff', 1.15], tint: '#9eaad6', weather: 'fireflies', enemy: 'mix', fog: [30, 75], skin: 'night' },
  ];
  const THEME = THEMES[SK % THEMES.length];
  const LAP = Math.floor(SK / THEMES.length) + 1;
  const THEME_NAME = THEME.name + (LAP > 1 ? ' ' + LAP : '');
  // キツネ: 群れを追いかけてきて、群れにぶつかるとひよこが弾け飛んで減る
  const FOX = {
    first: 15,                                   // 最初のキツネが来るまでの秒数
    interval: (t) => Math.max(2.5, 9 - SK * 0.7 - t / 40), // 次のキツネが来るまでの秒数
    max: (t) => 2 + SK + Math.floor(t / 45),     // 同時にいる数の上限
    speed: Math.min(6.8, 5.2 + SK * 0.25),       // 走る速さ(リーダーより少し遅い)
    hpSec: 2.5 * (1 + SK * 0.15),                // 群れ全員で何秒つつけば倒せるか(出てきたときの羽数で決まる)
    crash: Math.min(0.25, 0.12 + SK * 0.015),    // ぶつかったとき減る割合
  };
  const BOSS = { hpSec: 12 * (1 + SK * 0.4), speed: 4 + SK * 0.2, crash: 0.2, stun: 1.8 };
  // 3択の強化: 羽数がこの数をこえるたびに選べる
  const UPGRADE_AT = [25, 80, 250, 800, 2500, 8000, 25000, 80000, 250000, 800000];
  const mods = { dps: 1, speed: 1, hatch: 1, crash: 1, foe: 1, magnet: 1, parts: 1, prod: 1, feed: 1 };
  const CARDS = [
    { icon: '⚔️', name: 'つつく力', desc: '攻撃力 +40%', apply: () => { mods.dps *= 1.4; } },
    { icon: '👟', name: '俊足', desc: 'リーダーの速さ +15%', apply: () => { mods.speed *= 1.15; } },
    { icon: '🥚', name: 'たまご名人', desc: '群れの卵がかえる速さ ×1.6', apply: () => { mods.hatch *= 1.6; } },
    { icon: '🛡️', name: 'かたい羽', desc: 'ぶつかって減る数 -35%', apply: () => { mods.crash *= 0.65; } },
    { icon: '🦊', name: 'キツネ退治', desc: 'キツネへのダメージ ×2', apply: () => { mods.foe *= 2; } },
    { icon: '🧲', name: '吸いこみ', desc: '集まるのが速い・パーツ +30%', apply: () => { mods.magnet *= 1.6; mods.parts *= 1.3; } },
    { icon: '🏠', name: '村の応援', desc: '村の生む速さ ×1.5', apply: () => { mods.prod *= 1.5; } },
    { icon: '🌾', name: '大食い', desc: '出てくるエサ +40%', apply: () => { mods.feed *= 1.4; } },
  ];
  // 8つの建物を建てたあとの「村パワーアップ」: 払うたびに、村ぜんぶの生む速さが2倍になる
  const POWER_COST = (k) => Math.round(6000 * Math.pow(2.8, k) / 100) * 100;
  const START_CHICKS = 4;        // 最初のひよこ(リーダーとは別)
  const LEADER_SPEED = 7.5;      // リーダーの速さ
  // エリア: 門をこわすと次のエリアへ行ける。先のエリアほど、壊す物が大きくなる
  // need: 門を攻撃できるようになる羽数。gateHp: 門の固さ
  const AREAS = [
    { name: 'はじまりの原っぱ', icon: '🌱', x1: -24, x2: 28, z1: -24, z2: 16, open: true },
    { name: '農場', icon: '🚜', x1: -24, x2: 28, z1: 16, z2: 52, need: 300, gateHp: 450, gate: { x: 2, z: 16, along: 'x' }, wall: [[-24, 16], [28, 16]], ground: 'farm' },
    { name: '倉庫街', icon: '🏭', x1: -62, x2: -24, z1: 16, z2: 52, need: 3000, gateHp: 6000, gate: { x: -24, z: 24, along: 'z' }, wall: [[-24, 16], [-24, 52]], ground: 'town' },
  ];
  // まわりの柵(エリア全体の外側)
  const OUTER_WALLS = [[[-24, -24], [28, -24]], [[-24, -24], [-24, 16]], [[28, -24], [28, 52]], [[-62, 52], [28, 52]], [[-62, 16], [-24, 16]], [[-62, 16], [-62, 52]]];
  const MAX_DISPLAY = 360;       // 画面に描くひよこの最大数(これより多いときは、1羽が何羽ぶんかを表す)
  const SPACING = 0.34;          // 群れの中のひよこの間かく
  const PECK_DPS = 1.3;          // ひよこ1羽が1秒に与えるダメージ
  const MAX_TARGETS = 8;         // 同時に攻撃できる物の数
  const EGG_COST = 2;            // 卵1つに使うエサ
  const SELF_HATCH = (n) => 2.5 + Math.sqrt(n) * 0.45; // 群れが自分で卵をかえす速さ(1秒あたり)
  // 壊せる物(2種類)
  const CRATE_TIERS = [ // 木箱: 遠くほど固くて、たくさん出る
    { hp: 8, feed: 9, parts: 4, color: '#ffffff', size: 0.85 },   // color は木目の上にかける色
    { hp: 45, feed: 34, parts: 12, color: '#d9a27a', size: 1.0 },
    { hp: 180, feed: 110, parts: 40, color: '#a9b4c0', size: 1.15 },
  ];
  const CRATE_RESPAWN = 7;       // 木箱が別の場所にまた出るまでの秒数
  const BARREL = { hp: 110, feed: 80, parts: 28, r: 0.55, color: '#9a6a3a' }; // タル(農場から)
  // 大きな物(1つずつ作る)。h: 体力のバーを出す高さ
  const OBJ_TYPES = {
    container: { name: 'コンテナ', hp: 900, feed: 900, parts: 320, r: 1.9, respawn: 25, h: 2.8, color: '#d64545' },
    truck: { name: '軽トラ', hp: 1600, feed: 1300, parts: 450, r: 2.0, respawn: 25, h: 2.6, color: '#4f8fd8' },
    shed: { name: '小屋', hp: 5000, feed: 4000, parts: 1400, r: 2.4, respawn: 30, h: 4.2, color: '#c98a4a' },
    warehouse: { name: '倉庫', hp: 22000, feed: 16000, parts: 5500, r: 4.6, respawn: 40, h: 6.5, color: '#9aa7b4' },
  };
  // ひよこ村: パーツを払うと、建物が1つずつ空から落ちてきて建つ。村がどんどん広がる
  // rate: その建物が1秒に生むひよこ(1羽にエサ1)。x, z は建物の真ん中、w×d は広さ
  // 村の区画(エリアごと。木箱はここに出さない)。農場と倉庫街の区画は、門が開くと建てられる
  const VILLAGES = [
    { area: 0, x1: 3, x2: 23, z1: -19, z2: 1.5, cx: 11, cz: -8 },
    { area: 1, x1: 9, x2: 27.5, z1: 26, z2: 43, cx: 18, cz: 34 },
    { area: 2, x1: -40, x2: -25.5, z1: 36, z2: 51.5, cx: -33, cz: 43 },
  ];
  const BUILDINGS = [
    { type: 'hut', name: '孵化小屋', icon: '🐣', x: 6, z: -5, w: 3.6, d: 3, cost: 40, rate: 4 },
    { type: 'barn', name: 'エサ倉庫', icon: '🌾', x: 10.5, z: -9, w: 3.6, d: 3, cost: 70, rate: 6 },
    { type: 'incub', name: 'ふ卵器ハウス', icon: '🥚', x: 15.6, z: -5.5, w: 3.6, d: 3, cost: 120, rate: 10 },
    { type: 'belt', name: 'たまごコンベア', icon: '🥚', x: 11, z: -3.6, w: 5.4, d: 1.2, cost: 180, rate: 14 },
    { type: 'hut', name: '孵化小屋 2', icon: '🐣', x: 5.5, z: -12, w: 3.6, d: 3, cost: 260, rate: 20 },
    { type: 'mill', name: '風車', icon: '🌬️', x: 16, z: -12.5, w: 3, d: 3, cost: 380, rate: 28 },
    { type: 'factory', name: 'ひよこ工場', icon: '🏭', x: 11, z: -16, w: 6.4, d: 4, cost: 560, rate: 45 },

      if (WEATHER.glow) { f.y = 0.6 + Math.sin(time * 0.8 + f.p) * 0.6 + 0.6; }
      else { f.y -= WEATHER.fall * dt; if (f.y < 0) { f.y = 12 + Math.random() * 3; f.x = (Math.random() - 0.5) * 50; f.z = (Math.random() - 0.5) * 50; } }
      let x = camTarget.x + f.x + Math.sin(time * 0.7 + f.p) * WEATHER.sway, z = camTarget.z + f.z + Math.cos(time * 0.6 + f.p) * WEATHER.sway;
      // カメラから離れすぎたら、反対側へ回す(いつもまわりに降っているように)
      const s = WEATHER.size * (WEATHER.glow ? 0.7 + Math.abs(Math.sin(time * 3 + f.p)) * 0.6 : 1);
      setInst(weather, i, x, f.y, z, s, s, s, time * 1.5 + f.p, WEATHER.flat ? time + f.p : 0);
    });
    weather.instanceMatrix.needsUpdate = true;
  }
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const time = now / 1000;
    logic(dt, time);
    safe('weather', () => updateWeather(dt, time));
    // カメラ: 群れが大きくなるほど引いて、全体が見えるようにする
    camTarget.x += (L.x - camTarget.x) * Math.min(1, dt * 6);
    camTarget.z += (L.z - camTarget.z) * Math.min(1, dt * 6);
    const want = 11 + flock.r * 2.1;
    camDist += (want - camDist) * Math.min(1, dt * 1.5);
    camera.position.set(camTarget.x + Math.sin(CAM_YAW) * camDist * 0.75, camDist * 1.05, camTarget.z + Math.cos(CAM_YAW) * camDist * 0.75);
    camera.lookAt(camTarget.x, 0, camTarget.z);
    if (shake > 0) {
      shake = Math.max(0, shake - dt);
      camera.position.x += (Math.random() - 0.5) * shake * 1.2;
      camera.position.y += (Math.random() - 0.5) * shake * 1.2;
    }
    const sh = Math.max(20, camDist * 1.3);
    Object.assign(sun.shadow.camera, { left: -sh, right: sh, top: sh, bottom: -sh, near: 1, far: 120 });
    sun.shadow.camera.updateProjectionMatrix();
    sun.position.copy(camTarget).add(SUN_OFFSET);
    sun.target.position.copy(camTarget);
    safe('hud', () => { updateHud(dt); updateGuide(time); });
    safe('render', () => renderer.render(scene, camera));
    adaptQuality(now);
  }
  let qFrames = 0, qStart = performance.now(), pixelRatio = renderer.getPixelRatio();
  function adaptQuality(now) {
    qFrames++;
    const el = now - qStart;
    if (el < 3000) return;
    const fps = qFrames / (el / 1000);
    qFrames = 0; qStart = now;
    if (document.hidden) return;
    if (fps < 40 && pixelRatio > 1) { pixelRatio = Math.max(1, pixelRatio - 0.25); renderer.setPixelRatio(pixelRatio); resize(); }
  }
  document.addEventListener('visibilitychange', () => { last = performance.now(); qStart = last; qFrames = 0; });
  renderer.domElement.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    $('hint').textContent = '画面が止まりました。ページを再読み込みしてください';
    $('hint').style.opacity = 1;
  });
  // ステージの始めに、場所の名前を大きく出す
  $('st-small').textContent = 'ステージ ' + stage;
  $('st-name').textContent = THEME_NAME;
  $('stage-title').classList.add('show');
  $('version').textContent = '📍' + THEME_NAME + '  🐤 v' + GAME_VERSION;
  if (THEME.skin === 'night') $('version').style.color = 'rgba(255,255,255,.65)';
  requestAnimationFrame(frame);

  // 自動テスト用
  window.__renderer = renderer;
  window.__game = {
    get state() {
      return { chicks: Math.floor(chicks), feed: Math.floor(feed), parts: Math.floor(parts), elapsed, started, ended, stage, foxes: enemies.filter(e => e.alive).length, foxesDown, boss: !!(boss && boss.alive), bossHp: boss ? Math.round(boss.hp) : null, choosing: !!choosing, upgrades: upIdx, mods: { ...mods }, power: village.power, broken, maxCombo, hatchery: village.built, rate: village.rate, marks: { ...marks }, errors: errorsSeen.slice(), display: disp.length, drops: feedPool.items.length + partsPool.items.length, x: L.x, z: L.z, attacking: attackList.map(a => [a.t.kind, Math.round(a.t.hp), a.t.alive]), near: targets.filter(t => t.alive).map(t => [t.kind, +Math.hypot(t.x - L.x, t.z - L.z).toFixed(1), Math.round(t.hp)]).sort((a, b) => a[1] - b[1]).slice(0, 3), flockR: flock.r, open: AREAS.map(a => a.open) };
    },
    bot(on) { bot = on; },
    pick(i) { pickCard(i); },
    teleport(x, z) { L.x = x; L.z = z; flock.cx = x; flock.cz = z; },
    // 描かずに時間を進める(テンポの調整用)
    fastForward(sec, step = 1 / 30) { for (let t = 0; t < sec && !ended; t += step) logic(step, performance.now() / 1000 + t); return this.state; },
  };
</script>
